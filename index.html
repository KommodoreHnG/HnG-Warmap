  /* Hoechstwert und Mittelwert der Farbzeile - fuer die Balkenzeile. */
  const maxF = (a,b) => {
    let m = NaN;
    for (let y = Math.round(a); y <= Math.round(b); y++){
      if (y < fy0 || y > fy1) continue;
      const v = fFarbe[y-fy0];
      if (isNaN(m) || v > m) m = v;
    }
    return m;
  };
  const medF = (a,b) => {
    const w = [];
    for (let y = Math.round(a); y <= Math.round(b); y++){
      if (y < fy0 || y > fy1) continue;
      w.push(fFarbe[y-fy0]);
    }
    return w.length ? median(w) : NaN;
  };
  /* Die Oberkante der Goldkacheln, robust ueber alle Kacheln gemittelt.
     Daraus die Kartenoberkante: 0,11 Kartenhoehen darueber (an panel.png und
     template.png uebereinstimmend nachgemessen, 0,108 und 0,111). */
  const kachelBasis = median(anker.map(a =>
    a.y0 - Panker*Math.round((a.y0 - anker[0].y0)/Panker)));
  const ankerKante = kachelBasis - 0.11*Panker + 0.5*Panker;

  const auswerten = (phase, art) => {
    let e0, Pf;
    if (phase === null){ e0 = ankerKante; Pf = Panker; }   // Lage aus den Kacheln
    else { e0 = fy0 + phase; Pf = P; }
    for (let runde = 0; phase !== null && runde < 4; runde++){
      const pkt = [];
      for (let k = -1; ; k++){
        const c = e0 + k*Pf;
        if (c < fy0) continue;
        if (c > fy1) break;
        let bi = -1, bv = Infinity;
        const von = Math.max(0, Math.round(c - fy0 - 0.12*Pf));
        const bis = Math.min(hoehe-1, Math.round(c - fy0 + 0.12*Pf));
        for (let i = von; i <= bis; i++) if (stR[i] < bv){ bv = stR[i]; bi = i; }
        if (bi >= 0) pkt.push({k, y: fy0+bi, s: bv});
      }
      if (pkt.length < 2) break;
      const sm = median(pkt.map(p=>Math.abs(p.s)));
      const gut = pkt.filter(p => Math.abs(p.s) >= 0.5*sm && Math.abs(p.s) <= 2.0*sm);
      if (gut.length < 2) break;
      const stg = [];
      for (let i = 0; i < gut.length; i++)
        for (let j = i+1; j < gut.length; j++)
          if (gut[j].k !== gut[i].k) stg.push((gut[j].y-gut[i].y)/(gut[j].k-gut[i].k));
      if (!stg.length) break;
      Pf = median(stg);
      e0 = median(gut.map(p => p.y - Pf*p.k));
    }
    if (Math.abs(Pf - Panker) > 0.05*Panker) return null;
    const stellen = [];
    for (let k = -2; k < 200; k++){
      const kante = e0 + k*Pf, t = kante - 0.5*Pf;
      if (t + Pf < fy0) continue;
      if (t > fy1) break;
      const ganz = t >= fy0 && t + Pf <= fy1;
      let wert;
      if (art === "hell"){
        const o = mitP(t+0.04*Pf, t+0.44*Pf), u = mitP(t+0.56*Pf, t+0.92*Pf);
        wert = (isNaN(o)||isNaN(u)) ? -1 : o-u;
      } else {
        /* Die Balkenzeile: eine schmale, kraeftig gefaerbte Zeile bei gut vier
           Fuenfteln der Kartenhoehe. In beiden vorliegenden Bildern steht sie
           an derselben Stelle - bei dunklem wie bei hellem Grund. */
        const s = maxF(t+0.78*Pf, t+0.90*Pf) - medF(t+0.02*Pf, t+0.70*Pf);
        wert = isNaN(s) ? -1 : s*100;
      }
      stellen.push({t, kante, kontrast: wert, ganz});
    }
    const kMed = median(stellen.filter(s=>s.ganz && s.kontrast>0).map(s=>s.kontrast));
    if (!(kMed > (art === "hell" ? 25 : 12))) return null;
    /* Luecken von bis zu zwei Karten ueberbruecken. Die Liste ist im Spiel
       zusammenhaengend; eine blasse oder verdeckte Karte zwischen zwei
       erkannten gehoert dazu. Ohne das schnitt eine einzige gesperrte
       Einheit die Liste ab - bei hellem Gelaende vier von sieben. */
    const gut = stellen.map(s => s.ganz && s.kontrast >= 0.45*kMed);
    let lauf = [], a = -1, b = -1, luecke = 0;
    for (let i = 0; i < stellen.length; i++){
      if (gut[i]){
        if (a < 0) a = i;
        b = i; luecke = 0;
      } else if (a >= 0){
        if (++luecke > 2){
          if (b - a + 1 > lauf.length) lauf = stellen.slice(a, b+1);
          a = -1; b = -1; luecke = 0;
        }
      }
    }
    if (a >= 0 && b - a + 1 > lauf.length) lauf = stellen.slice(a, b+1);
    if (lauf.length < 3) return null;
    return {e0, P: Pf, lauf, art, guete: kMed*lauf.length};
  };
  /* Zwei Merkmale, weil keines allein beide Bilder traegt: der Hell/Dunkel-
     Wechsel innerhalb einer Karte (bei dunklem Gelaende hinter dem Panel) und
     die Balkenzeile (auch bei hellem). Es gewinnt, was im vorliegenden Bild
     wirklich Karten ergibt. */
  let gew = null;
  for (const art of ["hell", "balken"])
    for (const ph of [null].concat(phasen)){        // null = Lage aus den Kacheln, zuerst
      const v = auswerten(ph, art);
      if (v && (!gew || v.guete > gew.guete)) gew = v;
    }
  if (!gew) return kurzWeg();
  P = gew.P;
  const bestLauf = gew.lauf;

  /* ---- Musterprofil aus allen unverdeckten Karten --------------------- */
  const hh = 0.49*P;
  const prof = new Float64Array(Math.round(P));
  const pn = new Int32Array(Math.round(P));
  const hellW = bestLauf.map(s => mitP(s.t+0.04*P, s.t+0.44*P));
  const hMedW = median(hellW);
  const nutz = bestLauf.filter((s,i) => hellW[i] >= 0.85*hMedW);
  for (const s of (nutz.length ? nutz : bestLauf))
    for (let i = 0; i < prof.length; i++){
      const y = Math.round(s.t + i);
      if (y >= fy0 && y <= fy1){ prof[i] += rmean[y-fy0]; pn[i]++; }
    }
  for (let i = 0; i < prof.length; i++) prof[i] /= (pn[i] || 1);
  const sortP = prof.slice().sort((a,b)=>a-b);
  const p90 = sortP[Math.floor(sortP.length*0.90)], p10 = sortP[Math.floor(sortP.length*0.10)];
  const thrInk = (p90 + p10)/2;
  const hellBg = median(Array.from(prof.slice(Math.round(0.05*P), Math.round(0.44*P))));
  const dunkelBg = median(Array.from(prof.slice(Math.round(0.56*P), Math.round(0.95*P))));

  /* ---- Textbeginn rechts vom Kasten ----------------------------------- */
  const boxR = Math.round(median(bestStapel.map(k=>k.x1)));
  const namY = [Math.round(0.07*P), Math.round(0.24*P)];
  const acc = [];
  for (let x = boxR; x <= fx1; x++){
    let dunkel = 0, n = 0;
    for (const s of (nutz.length ? nutz : bestLauf))
      for (let dy = namY[0]; dy <= namY[1]; dy++){
        const y = Math.round(s.t+dy);
        if (y < fy0 || y > fy1) continue;
        if (L[y*W+x] < thrInk) dunkel++;
        n++;
      }
    acc.push(n ? dunkel/n : 0);
  }
  let i2 = 0;
  while (i2 < acc.length && acc[i2] > 0.50) i2++;
  const hatteRahmen = i2 > 0;
  while (i2 < acc.length && acc[i2] > 0.05) i2++;
  while (i2 < acc.length && acc[i2] <= 0.05) i2++;
  /* Am Kriegsfenster nachgemessen: zwischen der rechten Kante des goldenen
     Kastens und dem Textanfang liegen 19 px bei 213 px Kartenhoehe, also gut
     neun Hundertstel. Findet die Spaltensuche den schwarzen Rahmen nicht,
     gilt dieses Verhaeltnis. */
  const textFall = boxR + Math.round(0.09*P);
  const textX = (hatteRahmen && i2 > 0.03*P && i2 < 0.30*P) ? boxR + i2 : textFall;

  /* ---- Zeilenlagen ----------------------------------------------------- */
  const bandSuche = (von, bis, wert, schwelleAnteil) => {
    const n = Math.round(bis-von);
    const p = new Float64Array(n);
    for (let i = 0; i < n; i++){
      let tr = 0, ct = 0;
      for (const s of (nutz.length ? nutz : bestLauf)){
        const y = Math.round(s.t + von + i);
        if (y < fy0 || y > fy1) continue;
        for (let x = textX; x <= fx1; x++){ if (wert(L[y*W+x])) tr++; ct++; }
      }
      p[i] = ct ? tr/ct : 0;
    }
    const spitze = Math.max(...p);
    if (!(spitze > 0)) return [];
    const kern = p.map(v => v > schwelleAnteil*spitze ? 1 : 0);
    const baender = [];
    let a = -1;
    for (let i = 0; i < n; i++){
      if (kern[i]){ if (a < 0) a = i; }
      else if (a >= 0){ baender.push([a, i-1]); a = -1; }
    }
    if (a >= 0) baender.push([a, n-1]);
    // Luecken schliessen
    const zu = [];
    for (const b of baender){
      const letzt = zu[zu.length-1];
      if (letzt && b[0]-letzt[1] <= 0.04*hh) letzt[1] = b[1]; else zu.push([b[0], b[1]]);
    }
    return zu.filter(b => b[1]-b[0] >= 0.06*hh)
             .map(b => {
               let a2 = b[0], b2 = b[1];
               while (a2 > 0 && p[a2-1] > 0.08*spitze) a2--;
               while (b2 < n-1 && p[b2+1] > 0.08*spitze) b2++;
               return [von+a2, von+b2];
             });
  };
  /* Am Kriegsfenster nachgemessene Lagen, als Anteil der Kartenhoehe:
     Name 0,070..0,235, Kuerzel und Ort 0,310..0,441, Zahlen 0,577..0,770.
     Die Tintensuche verfeinert sie nur - sie ersetzt sie nicht mehr. Frueher
     entschied allein die Suche, und wenn sie zwei Zeilen zu einer zog, stand
     der Name der einen Einheit bei der anderen. */
  const sollBand = (a, b) => [a*P, b*P];
  const feinern = (soll, kandidaten) => {
    if (!kandidaten.length) return soll;
    const mitte = (soll[0]+soll[1])/2;
    let best = null, dmin = 0.10*P;
    for (const k of kandidaten){
      const d = Math.abs((k[0]+k[1])/2 - mitte);
      if (d < dmin && (k[1]-k[0]) < 0.30*P){ dmin = d; best = k; }
    }
    return best || soll;
  };
  /* Schrift ist, was vom Grund abweicht - hell auf dunkel im Kriegsfenster,
     weiss UND schwarz nebeneinander im Soldatenfenster (Kuerzel weiss,
     Ortsname schwarz). Die Richtung darf also nicht vorgegeben sein. */
  const abwText = Math.max(30, 0.5*(p90 - p10));
  const textB = bandSuche(0.02*P, 0.52*P, v => Math.abs(v - hellBg) > abwText, 0.25);
  const zwei = [feinern(sollBand(0.070, 0.235), textB),
                feinern(sollBand(0.310, 0.441), textB)];
  const zZahl = [feinern(sollBand(0.577, 0.770),
                         bandSuche(0.50*P, 0.82*P, v => v > hellBg, 0.30))];

  /* ---- Zahlengruppen: Balken plus schwarze Rinne ---------------------- */
  /* Erst das Balkenband selbst messen. Es ist nur rund ein Zwanzigstel der
     Kartenhoehe hoch; sucht man ueber die ganze untere Haelfte, erreicht keine
     Spalte die geforderte Mehrheit der Zeilen. */
  let balkenVon = zZahl[0][1], balkenBis = 0.95*P;
  {
    const von = Math.round(zZahl[0][1]), bis = Math.round(0.98*P);
    const n = Math.max(1, bis - von);
    const p = new Float64Array(n);
    for (let i = 0; i < n; i++){
      let tr = 0, ct = 0;
      for (const s of bestLauf){
        const y = Math.round(s.t + von + i);
        if (y < fy0 || y > fy1) continue;
        for (let x = fx0; x <= fx1; x++){
          const j = y*W+x;
          if (SAT[j] > satThr && !gold[j]) tr++;
          ct++;
        }
      }
      p[i] = ct ? tr/ct : 0;
    }
    const spitze = Math.max(...p);
    if (spitze > 0){
      let a = -1, bestA = -1, bestB = -1;
      for (let i = 0; i <= n; i++){
        const an = i < n && p[i] > 0.40*spitze;
        if (an){ if (a < 0) a = i; }
        else if (a >= 0){ if (i-1-a > bestB-bestA){ bestA = a; bestB = i-1; } a = -1; }
      }
      if (bestA >= 0){ balkenVon = von + bestA; balkenBis = von + bestB; }
    }
  }
  const colMask = new Uint8Array(W);
  for (const s of bestLauf){
    const spalte = new Int32Array(W);
    let zeilen = 0;
    for (let dy = Math.round(balkenVon); dy <= Math.round(balkenBis); dy++){
      const y = Math.round(s.t+dy);
      if (y < fy0 || y > fy1) continue;
      zeilen++;
      for (let x = fx0; x <= fx1; x++){
        const i = y*W+x;
        if (SAT[i] > satThr && !gold[i]) spalte[x]++;
      }
    }
    for (let x = fx0; x <= fx1; x++) if (spalte[x] > zeilen*0.35) colMask[x] = 1;
  }
  /* Die Balkenlaenge haengt vom Fuellstand ab - eine fast leere Einheit hat
     einen kurzen Balken, die Zahl daneben bleibt gleich lang. Deshalb zaehlen
     nur die ANFAENGE der Balken; wie breit eine Gruppe ist, sagt ihr Abstand
     zur naechsten. */
  const anfaenge = [];
  { let a = -1;
    for (let x = fx0; x <= fx1+1; x++){
      if (x <= fx1 && colMask[x]){ if (a < 0) a = x; }
      else if (a >= 0){ if (x-a >= 0.03*P) anfaenge.push(a); a = -1; }
    } }
  const gruppen = [];
  if (anfaenge.length){
    const dd = [];
    for (let i = 1; i < anfaenge.length; i++) dd.push(anfaenge[i]-anfaenge[i-1]);
    const gb = dd.length ? median(dd) : (fx1 - anfaenge[0]);
    for (const x of anfaenge)
      gruppen.push([Math.max(fx0, Math.round(x - 0.012*gb)),
                    Math.min(fx1, Math.round(x + gb*0.98))]);
  }
  if (!gruppen.length) return kurzWeg();

  /* ---- Ergebnis -------------------------------------------------------- */
  const karten = bestLauf.map(s => {
    /* Ob eine Gruppe da ist, entscheidet die SCHRIFT in der Zahlenzeile, nicht
       der Balken darunter: eine Einheit mit 0 von 36 Mann hat einen leeren,
       farblosen Balken - die Gruppe gibt es trotzdem. */
    const belegt = gruppen.map(([x0,x1]) => {
      let n = 0, ct = 0;
      for (let dy = Math.round(zZahl[0][0]); dy <= Math.round(zZahl[0][1]); dy++){
        const y = Math.round(s.t+dy);
        if (y < fy0 || y > fy1) continue;
        for (let x = x0; x <= x1; x++){ if (L[y*W+x] > hellBg) n++; ct++; }
      }
      return ct ? n/ct > 0.02 : false;
    });
    return {
      oben: s.t, unten: s.t + P,
      name:    [s.t + zwei[0][0], s.t + zwei[0][1]],
      kuerzel: [s.t + zwei[1][0], s.t + zwei[1][1]],
      zahlen:  [s.t + zZahl[0][0], s.t + zZahl[0][1]],
      gruppen: gruppen.map(([x0,x1], i) => ({x:[x0,x1], belegt: belegt[i]})),
    };
  });
  /* ---- Wie weit reicht der Text nach rechts? --------------------------
     Nicht ueber die Panelbreite: liegt gleichmaessiger Grund hinter dem Panel,
     ist dessen rechte Kante nicht zu messen (template.png ergab 551 statt 830,
     und der Name wurde zu "AT013 - Kommod"). Die Tinte selbst ist messbar.
     Rechts vom Namen stehen Sinnbilder - Lupe und Auge im Kriegsfenster, zwei
     Punkte im Soldatenfenster -, und davor liegt eine Luecke von fast einer
     ganzen Kartenhoehe (gemessen 0,96). Die groesste Luecke INNERHALB einer
     Zeile ist die zwischen Kuerzel und Ortsname (gemessen 0,37). Bei einer
     halben Kartenhoehe ist also Schluss.
     Der Ortsname ist mal weiss (Kriegsfenster), mal schwarz (Soldatenfenster) -
     es zaehlt der Abstand zum Zeilengrund, nicht die Richtung. */
  const textRechts = zwei.map(band => {
    const von = Math.round(band[0]), bis = Math.round(band[1]);
    const xEnd = Math.min(W-1, textX + Math.round(3.5*P));
    if (xEnd <= textX) return pr;
    const tinte = new Float64Array(xEnd - textX + 1);
    let nk = 0;
    for (const s of bestLauf){
      const werte = [];
      for (let dy = von; dy <= bis; dy += 2){
        const y = Math.round(s.t + dy);
        if (y < fy0 || y > fy1) continue;
        for (let x = textX; x <= xEnd; x += 3) werte.push(L[y*W+x]);
      }
      if (!werte.length) continue;
      const grund = median(werte);
      nk++;
      for (let x = textX; x <= xEnd; x++){
        let n = 0, ct = 0;
        for (let dy = von; dy <= bis; dy++){
          const y = Math.round(s.t + dy);
          if (y < fy0 || y > fy1) continue;
          if (Math.abs(L[y*W+x] - grund) > 45) n++;
          ct++;
        }
        if (ct) tinte[x-textX] += n/ct;
      }
    }
    if (!nk) return pr;
    let letzte = -1, leer = 0;
    for (let i = 0; i < tinte.length; i++){
      if (tinte[i]/nk > 0.05){ letzte = i; leer = 0; }
      else if (letzte >= 0 && ++leer > 0.5*P) break;
    }
    if (letzte < 0) return pr;
    let rechts = Math.min(W-1, textX + letzte + Math.round(0.04*P));
    /* Die Panelkante begrenzt - aber nur, wenn sie glaubwuerdig ist. Eine
       Kante, die weniger als zwei Kartenhoehen Text zulaesst, ist keine:
       rechts der Zahlengruppen ist eine Karte oft leer, und gleichmaessiger
       Grund zaehlt der Spaltensuche nicht als "gehoert dazu". */
    if (pr >= textX + 2*P) rechts = Math.min(rechts, pr);
    return rechts;
  });

  const kastenX = [Math.round(median(bestStapel.map(k=>k.x0))), boxR];
  return {ok:true, n:karten.length, P, panel:[pl,pr], kastenX, textX, textRechts, gruppen, karten,
          kastenH: Math.round(median(bestStapel.map(k=>k.h)))};
}

/* ==== Taktikzeichen erkennen ==========================================
   Die Zahlen sagen den Typ NICHT eindeutig - 24/24 passt auf drei Typen,
   16/14 auf zwei. Das Zeichen schon. Die 18 Vorlagen stammen aus den
   Aufnahmen des Kaufbildschirms und stecken in der Datei; verglichen wird
   auf einem Raster von 48 x 33 Punkten.
   Gemessen an Ennos Bildschirmfoto: alle sieben Zeichen richtig, auch
   Guard gegen Motorized Guard, die nur ein Paar Raeder trennt. */
let ZEICHEN = null;
function zeichenVorlagen(){
  if (ZEICHEN) return ZEICHEN;
  ZEICHEN = [];
  const abc = "0123456789abcdef";
  for (const [k, s] of Object.entries(MAP.sym || {})){
    const v = new Float32Array(s.length);
    for (let i = 0; i < s.length; i++) v[i] = abc.indexOf(s[i]) / 15;
    /* Mittelwert null, Laenge eins. Dann haengt der Vergleich nicht mehr
       daran, wie hell oder wie kontrastreich der Kasten gerade ist. */
    let m = 0;
    for (let i = 0; i < v.length; i++) m += v[i];
    m /= v.length;
    let q = 0;
    for (let i = 0; i < v.length; i++){ v[i] -= m; q += v[i]*v[i]; }
    q = Math.sqrt(q) || 1;
    for (let i = 0; i < v.length; i++) v[i] /= q;
    ZEICHEN.push({k, v});
  }
  return ZEICHEN;
}
/* Den schwarzen Rahmen im goldenen Kasten finden und auf das Raster bringen. */
function zeichenLesen(quelle, x0, y0, breit, hoch){
  const vorl = zeichenVorlagen();
  if (!vorl.length) return null;
  const B = MAP.symB || 48, Hh = MAP.symH || 33;
  x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0));
  breit = Math.min(quelle.width - x0, Math.round(breit));
  hoch = Math.min(quelle.height - y0, Math.round(hoch));
  if (breit < 12 || hoch < 8) return null;
  const g = quelle.getContext("2d", {willReadFrequently:true});
  const bd = g.getImageData(x0, y0, breit, hoch).data;
  const grau = new Uint8Array(breit*hoch);
  for (let i = 0, j = 0; j < breit*hoch; i += 4, j++)
    grau[j] = (299*bd[i] + 587*bd[i+1] + 114*bd[i+2]) / 1000;
  /* Oberkante des Rahmens: erste Zeile mit viel Dunkel. Von dort die Breite
     der schwarzen Linie, das ist der Rahmen. Unterkante: letzte Zeile, die
     ihn noch weitgehend ausfuellt. */
  /* Die Schwelle kommt aus dem Fenster selbst. Fest ging nicht: bei einer
     gesperrten Kampfeinheit ist der Rahmen grau (gemessen 122) statt schwarz,
     und ueber hellem Gelaende ist der Kartengrund mit 96 dunkler als dieser
     Rahmen. Das Dunkelste im Fenster ist aber immer der Rahmen. */
  const hgr = new Uint32Array(256);
  for (let j = 0; j < grau.length; j++) hgr[grau[j]]++;
  const pgr = q => { let s = 0;
    for (let v = 0; v < 256; v++){ s += hgr[v]; if (s >= grau.length*q) return v; } return 255; };
  const gLo = pgr(0.02), gMed = pgr(0.50);
  const gSchwelle = Math.max(20, Math.min(110, gLo + 0.30*(gMed - gLo)));
  const dunkel = v => v < gSchwelle;
  /* Der Rahmen sind zwei schwarze Balken. Das Suchfenster ist etwas hoeher als
     eine halbe Karte und ragt in die naechste hinein - wer die LETZTE schwarze
     Zeile nimmt, erwischt dort deren Oberkante und zieht das Zeichen in die
     Laenge. Bei 1920 und 1600 war genau das der Fall (Verhaeltnis 1,2 statt
     1,45, Guete 0,50 statt 0,95). Also: erster Balken oben, der naechste
     darunter, und dann Schluss. */
  const anteil = new Float32Array(hoch);
  for (let y = 0; y < hoch; y++){
    let n = 0;
    for (let x = 0; x < breit; x++) if (dunkel(grau[y*breit+x])) n++;
    anteil[y] = n/breit;
  }
  const balken = [];
  for (let y = 0, a = -1; y <= hoch; y++){
    const voll = y < hoch && anteil[y] >= 0.60;
    if (voll){ if (a < 0) a = y; }
    else if (a >= 0){ balken.push([a, y-1]); a = -1; }
  }
  if (!balken.length) return null;
  const ry = balken[0][0];
  /* Die Seiten aus einer Zeile des oberen Balkens - der ist durchgehend. */
  const zr = Math.round((balken[0][0] + balken[0][1])/2);
  let rx0 = -1, rx1 = -1;
  for (let x = 0; x < breit; x++) if (dunkel(grau[zr*breit+x])){ if (rx0 < 0) rx0 = x; rx1 = x; }
  if (rx0 < 0 || rx1 - rx0 < 10) return null;
  /* Die Unterkante ueber die Form, nicht ueber "die letzte schwarze Zeile":
     der Rahmen ist im Spiel immer gleich geformt (48 zu 33, dieselbe Form wie
     die Vorlagen), also folgt aus der Breite die Hoehe. Gesucht wird der
     schwarze Balken, der dieser Hoehe am naechsten kommt. So faellt beides
     weg - die durchgehend schwarze Zeile mitten im Zeichen und die Oberkante
     der naechsten Karte, die noch ins Suchfenster ragt. */
  const soll = (rx1-rx0+1) * Hh / B;
  let ry1 = -1, ab = Infinity;
  for (const [, b] of balken){
    const d2 = Math.abs((b - ry + 1) - soll);
    if (d2 <= 0.20*soll && d2 < ab){ ab = d2; ry1 = b; }
  }
  if (ry1 < 0) ry1 = Math.min(hoch-1, ry + Math.round(soll) - 1);
  if (ry1 - ry < 8) return null;
  /* Der Rahmen wird nie auf den Punkt genau getroffen, und bei kleinen Bildern
     kostet schon ein Punkt Versatz die Entscheidung: bei 1920 stand Pathfinders
     gegen Motorized Recon mit vier Zehntausendsteln. Also den Ausschnitt ein
     wenig wackeln lassen - nach links/rechts, oben/unten, enger/weiter - und je
     Typ die beste Lage werten. Verglichen wird normiert, nicht ueber eine
     Spanne: sonst entscheidet mit, wie stark der Goldrand hereinstrahlt. */
  const c = document.createElement("canvas");
  c.width = B; c.height = Hh;
  const cg = c.getContext("2d", {willReadFrequently:true});
  cg.imageSmoothingEnabled = true; cg.imageSmoothingQuality = "high";
  const u = Math.max(1, Math.round((rx1-rx0+1)/40));
  const v = new Float32Array(B*Hh);
  const punkte = new Map();
  for (const dx of [-u, 0, u]) for (const dy of [-u, 0, u]) for (const dr of [-u, 0, u]){
    const ax = x0+rx0+dx-dr, ay = y0+ry+dy-dr;
    const aw = rx1-rx0+1+2*dr, ah = ry1-ry+1+2*dr;
    if (aw < 8 || ah < 6) continue;
    cg.clearRect(0, 0, B, Hh);
    cg.drawImage(quelle, ax, ay, aw, ah, 0, 0, B, Hh);
    const kd = cg.getImageData(0, 0, B, Hh).data;
    let m = 0;
    for (let i = 0, j = 0; j < v.length; i += 4, j++){
      const g2 = -(299*kd[i] + 587*kd[i+1] + 114*kd[i+2]) / 1000;   // dunkel = viel
      v[j] = g2; m += g2;
    }
    m /= v.length;
    let q = 0;
    for (let j = 0; j < v.length; j++){ v[j] -= m; q += v[j]*v[j]; }
    q = Math.sqrt(q);
    if (!(q > 0)) continue;
    for (let j = 0; j < v.length; j++) v[j] /= q;
    for (const zg of vorl){
      let s = 0;
      for (let j = 0; j < v.length; j++) s += v[j]*zg.v[j];
      const bis = punkte.get(zg.k);
      if (bis === undefined || s > bis) punkte.set(zg.k, s);
    }
  }
  let best = null, zweit = null;
  for (const [k, s] of punkte){
    if (!best || s > best.s){ zweit = best; best = {k, s}; }
    else if (!zweit || s > zweit.s) zweit = {k, s};
  }
  /* Ein Zeichen, das nirgends richtig passt, ist keines - dann sollen die
     Zahlen entscheiden statt eines geratenen Typs. */
  if (!best || best.s < 0.45) return null;
  return {k: best.k, abstand: 1 - best.s, zweiter: zweit && zweit.k,
          vorsprung: zweit ? best.s - zweit.s : 1};
}

/* Ein Ausschnitt als eigenes, aufbereitetes Bild - fuer die Einzelzeilen. */
function feldBild(quelle, x, y, w, h, faktor, beidseitig, dunkelKanal){
  x = Math.max(0, Math.round(x)); y = Math.max(0, Math.round(y));
  w = Math.min(quelle.width - x, Math.round(w));
  h = Math.min(quelle.height - y, Math.round(h));
  if (w < 6 || h < 6) return null;
  /* Tesseract liest eine Zeile am besten bei etwa 50 px Schrifthoehe. Das
     Band ist gut doppelt so hoch wie die Schrift darin, also rund 100 px -
     und die Breite gedeckelt, sonst dauert ein Feld eine Sekunde. */
  let f = faktor || Math.max(1, Math.min(4, 100/h));
  if (w*f > 1400) f = 1400/w;
  const c = document.createElement("canvas");
  c.width = Math.round(w*f); c.height = Math.round(h*f);
  const g = c.getContext("2d", {willReadFrequently:true});
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(quelle, x, y, w, h, 0, 0, c.width, c.height);
  /* Dieselbe Umkehrung wie beim ganzen Ausschnitt, nur ohne Ortsbezug -
     ein einzelnes Feld ist klein genug fuer eine globale Spanne. */
  const bd = g.getImageData(0,0,c.width,c.height), d = bd.data;
  const n = c.width*c.height, hist = new Uint32Array(256), grau = new Uint8ClampedArray(n);
  /* Der hellste Kanal laesst alles Helle hell. Der dunkelste dagegen loescht
     Buntes: ein gruener Punkt hat wenig Rot und wenig Blau. Weisse Schrift hat
     in allen Kanaelen viel und ueberlebt beides - deshalb faellt hier die
     Landkarte hinter dem halbdurchsichtigen Panel weg. */
  for (let i=0, j=0; j<n; i+=4, j++){
    const v = dunkelKanal ? Math.min(d[i], d[i+1], d[i+2]) : Math.max(d[i], d[i+1], d[i+2]);
    grau[j] = v; hist[v]++;
  }
  const perz = p => { let s = 0; for (let v=0; v<256; v++){ s += hist[v]; if (s >= n*p) return v; } return 255; };
  /* Ein Feld ohne Inhalt ist flach. Es jetzt zu erkennen ist wichtig: auf dem
     Sammelblatt wuerde es keine Zeile erzeugen, und die Zuordnung von Zeile zu
     Feld waere dahin. */
  if (perz(.98) - perz(.02) < 22) return null;
  /* Beidseitig, nicht auf eine Richtung festgelegt: in der Kuerzelzeile des
     Soldatenfensters steht das Kuerzel weiss und der Ortsname schwarz auf
     demselben grauen Grund. Wer sich fuer eine Richtung entscheidet, wirft
     eines von beiden weg. Es zaehlt der Abstand zum Grund. */
  const grund = perz(.5);
  if (!beidseitig){
    /* Der Regelfall: nur die Mehrheitsrichtung. Beidseitig waere hier teuer -
       das Panel im Kriegsfenster ist halbdurchsichtig, die Landkarte dahinter
       weicht ueberall vom Grund ab, und aus dem Feld wird Rauschen, an dem
       sich die Texterkennung totsucht (gemessen eine Sekunde je Feld statt
       sechzig Tausendsteln). */
    const hell = grund < 128;
    let lo = hell ? grund : perz(.03), hi = hell ? perz(.97) : grund;
    if (hi - lo < 14){ lo = 0; hi = 255; }
    const sp = 255/(hi-lo);
    for (let i=0, j=0; j<n; i+=4, j++){
      let v = (grau[j]-lo)*sp;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      d[i] = d[i+1] = d[i+2] = hell ? 255-v : v; d[i+3] = 255;
    }
  } else {
    /* Beidseitig: im Soldatenfenster stehen Kuerzel (weiss) und Ortsname
       (schwarz) in derselben Zeile. */
    const spanne = Math.max(18, Math.max(perz(.97) - grund, grund - perz(.03)));
    for (let i=0, j=0; j<n; i+=4, j++){
      let v = Math.abs(grau[j]-grund)/spanne*255;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      d[i] = d[i+1] = d[i+2] = 255-v; d[i+3] = 255;
    }
  }
  g.putImageData(bd, 0, 0);
  return c;
}

/* Der Hauptweg. Gibt null zurueck, wenn kein Raster zu erkennen ist -
   dann greift der alte Weg ueber den freien Text. */
/* Jeder Hoechstwert, der in einer Gruppe stehen kann: die Besatzungsstaerken
   aus der WarDatabase, dazu 100 fuer die Moral. Damit muss nicht geraten
   werden, wo eine zusammengelaufene Zahl zu teilen ist. */
const HOECHSTWERTE = new Set([100, ...MAP.at.flatMap(a => a.crew.map(c => c[1]))]);
function paarAus(t){
  const s = String(t).replace(/[^0-9\/]/g, "");
  const d = s.replace(/\//g, "");
  if (!d.length) return null;
  const kand = [];
  const teile = s.split("/").filter(Boolean);
  if (teile.length === 2) kand.push([+teile[0], +teile[1]]);
  for (let k = 1; k < d.length; k++){
    kand.push([+d.slice(0, k), +d.slice(k)]);                 // ohne Trenner
    if (k + 1 < d.length) kand.push([+d.slice(0, k), +d.slice(k+1)]);  // Trenner verlesen
  }
  if (d.length <= 3) kand.push([+d, +d]);
  const gut = kand.filter(([a,b]) => a > 0 && b > 0 && a <= b && b <= 999);
  if (!gut.length) return null;
  const passend = gut.filter(([,b]) => HOECHSTWERTE.has(b));
  return passend.length ? passend[0] : gut[0];
}


/* ---- Fehlende Kuerzel aus der Reihe ergaenzen ------------------------
   Kuerzel folgen im Spiel einem Muster: gleicher Stamm, laufende Nummer, und
   die Nummer entspricht der im Namen. Faellt eines aus, ergibt es sich aus
   einer Nachbarin - aber nur, wenn das Muster dort auch belegt ist, deren
   Name und deren Kuerzel also dieselbe Nummer tragen. */
function kuerzelReihe(liste){
  const zerlegen = s => {
    const m = /^(.*?)(\d+)$/.exec(String(s || "").trim());
    return m && m[1] ? {stamm: m[1], zahl: +m[2], stellen: m[2].length} : null;
  };
  const nummer = s => {
    const m = /(\d+)\s*$/.exec(String(s || "").trim());
    return m ? +m[1] : null;
  };
  for (let i = 0; i < liste.length; i++){
    if (liste[i].tag) continue;
    const z = nummer(liste[i].name);
    if (z === null) continue;
    for (const j of [i-1, i+1, i-2, i+2]){
      if (j < 0 || j >= liste.length) continue;
      const k = zerlegen(liste[j].tag);
      if (!k || k.zahl === z) continue;
      if (nummer(liste[j].name) !== k.zahl) continue;   // Muster nicht belegt
      liste[i].tag = k.stamm + String(z).padStart(k.stellen, "0");
      liste[i].tagAbgeleitet = true;
      break;
    }
  }
  return liste;
}

/* ---- eine Karte auslesen ---------------------------------------------
   Der Typ kommt aus dem Taktikzeichen, nicht aus den Zahlen: 24/24 passt auf
   drei Typen, 16/14 auf zwei. Die Zahlen geben die Truppenstaerke und dienen
   als Gegenprobe - passt die Besetzung nicht zum erkannten Zeichen, wird die
   Zeile zur Pruefung markiert statt stillschweigend geraten. */
async function depotAusRaster(quelle, melde){
  let r;
  try { r = kartenRaster(quelle); }
  catch(e){ return null; }
  if (!r || !r.ok) return null;
  melde(`${r.n} units found — reading …`);

  const raus = [];
  /* Rechts in der Namenszeile sitzen Lupe und Auge. Laesst man das Feld bis
     zum Panelrand laufen, liest die Erkennung NUR diese beiden Sinnbilder und
     der Name faellt ganz weg - gemessen "Q o" statt "Bodenmaenner - 1". */
  /* Je Zeile eigens gemessen - die Namenszeile endet vor den Sinnbildern,
     die Kuerzelzeile hinter dem Ortsnamen. */
  const rueck = r.panel[0] + 0.87*(r.panel[1] - r.panel[0]);
  const rNam = (r.textRechts && r.textRechts[0]) || rueck;
  const rKue = (r.textRechts && r.textRechts[1]) || rueck;
  for (let i = 0; i < r.karten.length; i++){
    const k = r.karten[i];
    melde(`Reading unit ${i+1} of ${r.karten.length} …`);

    /* 1. Das Zeichen - die eigentliche Typangabe. */
    const z = zeichenLesen(quelle, r.kastenX[0] - r.P*0.02, k.oben + r.P*0.02,
                           (r.kastenX[1] - r.kastenX[0]) + r.P*0.06, r.P*0.48);

    /* 2. Name und Kuerzelzeile. */
    let name = "", kzZeile = "", kzAlle = [];
    try {
      /* Der Name ueber beide Farbwege - es gewinnt, was die Erkennung selbst
         hoeher bewertet. Sitzt der erste schon sicher, bleibt es dabei. */
      let bestZ = -1;
      for (const dunkel of [false, true]){
        const nb = feldBild(quelle, r.textX, k.name[0]-2,
                            rNam - r.textX, k.name[1]-k.name[0]+4, 0, false, dunkel);
        if (!nb) continue;
        const a = await ocrMitZuv(nb, 7, ()=>{});
        const txt = saeubern(a.text);
        if (txt && a.zuv > bestZ){ bestZ = a.zuv; name = txt; }
        if (bestZ >= 85) break;
      }
      /* Die Kuerzelzeile ueber beide Farbwege und beide Aufbereitungen. Ein
         getroffener Ortsname schlaegt jede Zuversicht - die Stadtliste ist
         eine harte Gegenprobe. Sitzt er, wird abgebrochen. */
      let bestP = -1;
      for (const beid of [false, true]){
        for (const dunkel of [false, true]){
          const kb = feldBild(quelle, r.textX, k.kuerzel[0]-2,
                              rKue - r.textX, k.kuerzel[1]-k.kuerzel[0]+4, 0, beid, dunkel);
          if (!kb) continue;
          const a = await ocrMitZuv(kb, 7, ()=>{});
          const txt = saeubern(a.text);
          if (!txt) continue;
          kzAlle.push(txt);
          const tr = tagUndOrt(txt, true);
          const p = (tr && tr.stadt != null ? 1000 : 0) + a.zuv;
          if (p > bestP){ bestP = p; kzZeile = txt; }
        }
        if (bestP >= 1000) break;
      }
    } catch(e){ return null; }

    /* 3. Die Zahlen - Staerke und Gegenprobe. */
    const paare = [];
    for (const g of k.gruppen){
      if (!g.belegt){ paare.push(null); continue; }
      const zb = feldBild(quelle, g.x[0], k.zahlen[0]-2, g.x[1]-g.x[0], k.zahlen[1]-k.zahlen[0]+4);
      let t = "";
      if (zb){ try { t = await ocrText(zb, 7, ()=>{}, ZIFFERN); } catch(e){} }
      paare.push(paarAus(t));
    }
    const gute = paare.filter(Boolean);
    let hoechst = gute.map(p => p[1]);
    if (hoechst.length > 1 && hoechst[0] === 100) hoechst = hoechst.slice(1);
    const ausZahlen = ZUSAMMEN.get(hoechst.join("-")) || [];

    /* Zeichen entscheidet. Nur wenn keins zu lesen war, treten die Zahlen an
       seine Stelle. Widersprechen sich beide, bleibt das Zeichen gesetzt und
       die Zeile bekommt beide zur Auswahl. */
    let kand, gewaehlt = "";
    if (z && z.k){
      gewaehlt = z.k;
      kand = ausZahlen.length && !ausZahlen.includes(z.k)
        ? [z.k, ...ausZahlen] : (ausZahlen.length ? ausZahlen : [z.k]);
      if (!kand.includes(z.k)) kand = [z.k, ...kand];
    } else if (ausZahlen.length){
      kand = ausZahlen; gewaehlt = ausZahlen[0];
    } else {
      kand = MAP.at.map(a => a.k);
    }

    /* Der Ort wird gegen alle 1438 Staedte gesucht, und zwar ueber JEDE
       Lesart der Kuerzelzeile - nicht nur die bestbewertete. Findet keine
       davon eine Stadt, bleibt das Feld leer: ein falscher Ortsname ist
       schlechter als keiner. */
    let tag = "", ort = "", stadt = null;
    for (const txt of kzAlle){
      const tr = tagUndOrt(txt, true);
      if (tr && tr.stadt != null){ tag = tr.tag; ort = tr.ort; stadt = tr.stadt; break; }
    }
    if (stadt === null){
      const t2 = tagUndOrt(kzZeile, true);
      if (t2) tag = t2.tag;
      else {
        const w = kzZeile.split(" ").filter(Boolean);
        if (w.length && /^[A-Za-z0-9][A-Za-z0-9_-]{1,11}$/.test(w[0])) tag = w[0].toUpperCase();
      }
    }
    if (!name && !tag && !gewaehlt) continue;
    raus.push({name, tag, ort, stadt, kand, gewaehlt,
               staerke: gute.map(p => p.join("/")).join("  ")});
  }
  if (!raus.length) return null;
  return kuerzelReihe(raus);
}

async function depotLesen(datei, box){
  const st = document.getElementById("ds-status");
  const setz = s => st.innerHTML = s;
  if (!datei){ setz("Pick a picture first."); return; }
  document.getElementById("ds-list").style.display = "none";
  document.getElementById("ds-go").disabled = true;

  /* Erst das Raster. Nur wenn sich keins findet - anderer Ausschnitt,
     anderes Fenster, kein Gruen -, wird der ganze Ausschnitt als Fliesstext
     gelesen wie bisher. */
  let beste = null, rohBest = "", bild = null;
  /* Erst mit dem Rahmen, dann ohne ihn. Der Finder kommt mit dem ganzen
     Bildschirmfoto zurecht, also darf ein Rahmen nie zum Abbruch fuehren -
     zwischen den Einheiten ist Abstand, enger als "alles" geht gar nicht. */
  for (const mitRahmen of (box ? [true, false] : [false])){
    try {
      const farbe = await farbAusschnitt(datei, mitRahmen ? box : null);
      beste = await depotAusRaster(farbe, setz);
    } catch(e){ beste = null; }
    if (beste && beste.length) break;
  }
  try {
    if (beste) rohBest = beste.map(g =>
      `${g.name} | ${g.tag} ${g.ort} | ${g.kand.join(", ")}`).join("\n");
  } catch(e){ beste = null; }

  try { bild = await bildAufbereiten(datei, box); }
  catch(e){ setz("<b>That picture could not be opened.</b>"); return; }
  if (beste && beste.length) return depotAnzeigen(beste, rohBest, bild, setz);

  /* Drei Lesarten - ein Block, eine Spalte, verstreute Zeilen. Je nach Bild
     teilt Tesseract die Liste anders auf; welche am meisten findet, gewinnt.
     Sobald ein Durchgang mehrere Einheiten liefert, reicht das - ueber ein
     ganzes Bildschirmfoto dauert jeder Durchgang sonst eine halbe Minute. */
  const modi = bild.width*bild.height > 1.6e6 ? [6, 4] : [6, 4, 11];
  beste = [];
  for (let m=0; m<modi.length; m++){
    let text = "";
    const vor = modi.length > 1 ? `(${m+1} of ${modi.length}) ` : "";
    try { text = await ocrText(bild, modi[m], s => setz(`${vor}${s}`)); }
    catch(e){
      setz(`<b>The recogniser could not be loaded.</b> It needs internet access and does not work
            offline. Add the teams by hand instead.`);
      return;
    }
    if (!rohBest) rohBest = text;
    const g = depotAusText(text);
    if (g.length > beste.length){ beste = g; rohBest = text; }
    if (beste.length >= 3) break;
  }

  return depotAnzeigen(beste, rohBest, bild, setz);
}

/* Die Anzeige des Ergebnisses - beide Lesewege enden hier. */
function depotAnzeigen(beste, rohBest, bild, setz){
  const roh = document.getElementById("ds-roh");
  document.getElementById("ds-rohtext").textContent = rohBest.trim() || "(nothing)";
  const rb = document.getElementById("ds-rohbild");
  rb.innerHTML = "";
  bild.style.maxWidth = "100%"; bild.style.height = "auto";
  rb.appendChild(bild);
  roh.style.display = "block";

  if (!beste.length){
    setz(`<b>No teams recognised.</b> Take the shot with the game at its own resolution rather than
          a scaled-down window, and make sure the assault team list is open. Open the line below to
          see what came through.`);
    return;
  }
  const c = light() ? "#1a2029" : "#e9e2d5";
  const bekannt = new Set(myDepot().map(d => (d.tag||"").toUpperCase()).filter(Boolean));
  setz(`<b>${beste.length} team${beste.length===1?"":"s"} recognised.</b>
        Check the type where it was ambiguous, then add.`);
  const kiste = document.getElementById("ds-list");
  kiste.innerHTML = beste.map(g => {
    const doppelt = g.tag && bekannt.has(g.tag.toUpperCase());
    return `<label class="zeile" style="display:flex;align-items:center;gap:6px;background:var(--panel2);
        border-radius:2px;padding:5px 7px">
      <input type="checkbox" ${doppelt?"":"checked"}>
      <span style="width:30px">${symbolSVG(g.gewaehlt, c, 26, 18)}</span>
      <input type="text" value="${esc(g.name)}" placeholder="name" style="flex:1;min-width:0;
        background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:3px 6px;
        outline:0;font-size:12px">
      <input type="text" value="${esc(g.tag)}" placeholder="TAG" style="width:76px;
        background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:3px 6px;
        outline:0;font-size:11px">
      <select class="typ" style="width:168px;background:var(--panel);border:1px solid var(--line);
        border-radius:2px;padding:3px 5px;outline:0;font-size:11px">
        ${(g.kand.length>1 ? g.kand : MAP.at.map(a=>a.k)).map(k=>
          `<option value="${k}"${k===g.gewaehlt?" selected":""}>${esc(atName(k))}</option>`).join("")}
      </select>
      <span style="font-size:10px;color:${g.stadt!==null?"var(--accent)":"var(--dim2)"};width:96px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${
        g.stadt!==null ? esc(MAP.n[g.stadt][0]) : (doppelt ? "tag already known" : esc(g.ort||""))}</span>
    </label>`;
  }).join("");
  kiste.querySelectorAll(".zeile").forEach((z,i) => {
    z.dataset.stadt = beste[i].stadt === null ? "" : beste[i].stadt;
    /* Ein hergeleitetes Kuerzel darf nicht aussehen wie ein gelesenes. */
    if (beste[i].tagAbgeleitet){
      const tf = z.querySelectorAll("input[type=text]")[1];
      if (tf){ tf.style.borderStyle = "dashed";
               tf.title = "derived from the numbering of the unit next to it"; }
    }
    const sel2 = z.querySelector("select.typ"), sym = z.querySelector("span");
    sel2.addEventListener("change", ()=>{ sym.innerHTML = symbolSVG(sel2.value, c, 26, 18); });
  });
  kiste.style.display = "flex";
  document.getElementById("ds-go").disabled = false;
}

/* ---- from the text back to the teams ---------------------------------
   No symbol recognition needed: the strength figures give the type away.
   "36/36 9/9" can only be Pathfinders — 36 paratroopers, 9 transport planes.
   Three compositions are shared by two teams each, and those are put up for
   a choice.
   The numbers are deliberately not matched against a fixed pattern. A slash
   read as a 1, or a 6 read as a G, shifts everything along and the pattern
   fails. Instead every known composition is tried against the numbers of the
   line — the question is not "does this look like strength figures" but
   "can this line be read as Pathfinders". */
const ZUSAMMEN = (() => {
  const m = new Map();
  for (const a of MAP.at){
    const s = a.crew.map(c=>c[1]).join("-");
    (m.get(s) || m.set(s, []).get(s)).push(a.k);
  }
  return m;
})();
const COMPS = [...ZUSAMMEN.keys()].map(s => ({s, v: s.split("-").map(Number)}));

/* Buchstaben, die die Erkennung regelmaessig fuer Ziffern haelt - aber nur
   mitten in einer Zahl, sonst wuerde aus "Guard" eine Zahlenkolonne. */
const ZIFFERN = "0123456789/";
const ZIFFER = {O:"0", o:"0", D:"0", Q:"0", l:"1", I:"1", i:"1", "|":"1", "!":"1",
                Z:"2", z:"2", S:"5", s:"5", G:"6", b:"6", T:"7", B:"8", g:"9", q:"9"};
function zahlenAus(zeile){
  const teile = [];
  let cur = "";
  /* Eine Zahl, die an einem WORT klebt, gehoert zum Namen und nicht zur
     Staerke - die 5 in "ROS5" darf die Zaehlung nicht verschieben. Ein
     einzelner Buchstabe davor ist dagegen fast immer ein verlesenes
     Sinnbild ("O10/12"), und dann zaehlt die Zahl sehr wohl. */
  const s = String(zeile) + " ";
  let buchstaben = 0;
  for (let p=0; p<s.length; p++){
    const ch = s[p];
    const ziffer = ch >= "0" && ch <= "9";
    if (ziffer && !cur && buchstaben >= 2){ continue; }
    const z = ziffer ? ch : (cur ? ZIFFER[ch] : null);
    if (z) cur += z;
    else { if (cur) teile.push(cur); cur = ""; }
    buchstaben = /[A-Za-z]/.test(ch) ? buchstaben + 1 : 0;
  }
  /* Keine Besetzung ist groesser als 36 und keine Moral groesser als 100 -
     alles darueber sind zwei zusammengelaufene Zahlen. "36136" ist "36/36"
     mit einem als 1 verlesenen Schraegstrich, "3636" dasselbe ohne Trenner. */
  const raus = [];
  for (const s of teile){
    const v = +s;
    if (v > 0 && v <= 100){ raus.push(v); continue; }
    let zwei = null;
    for (const trenn of [1, 0]){
      const k = (s.length - trenn)/2;
      if (!Number.isInteger(k) || k < 1) continue;
      const a = s.slice(0, k);
      if (a === s.slice(k + trenn) && a[0] !== "0"){ zwei = +a; break; }
    }
    if (zwei) raus.push(zwei, zwei); else if (v > 0) raus.push(v);
  }
  return raus.slice(0, 14);
}
/* Jede Zahl der Zusammensetzung darf einmal auftauchen (nur der Hoechstwert)
   oder zweimal (Ist und Hoechstwert), und der Ist-Wert darf kleiner sein.
   `ab` ueberspringt eine fuehrende Zahl - die Moral steht davor. */
function passtAuf(nums, comp, ab){
  let i = ab;
  for (const c of comp){
    if (nums[i] === c){ i++; if (nums[i] === c) i++; continue; }
    if (nums[i] < c && nums[i+1] === c){ i += 2; continue; }
    return false;
  }
  /* Genau eine Zahl darf uebrig bleiben. Zwei waeren zu lax: die Wache (36)
     wuerde dann auch auf "36/36 12/12" der motorisierten Wache passen. */
  return i >= nums.length - 1;
}
/* Die Moral steht im Kriegsfenster als "44/100" und bringt damit zwei Zahlen
   mit, nicht eine. Sie gehoert nicht zur Besetzung und wird vorher entfernt -
   sonst faengt die Suche zwei Stellen zu frueh an. */
function ohneMoral(nums){
  if (nums.length > 2 && nums[1] === 100 && nums[0] <= 100) return nums.slice(2);
  return nums;
}
function typAusZahlen(nums){
  for (const folge of [ohneMoral(nums), nums])
    for (let ab = 0; ab <= 1; ab++)
      for (const c of COMPS)
        if (passtAuf(folge, c.v, ab)) return ZUSAMMEN.get(c.s);
  return [];
}
/* Die Erkennung haengt gern Satzzeichen und einzelne Fremdzeichen an. */
/* Am Rand des Fensters liest die Erkennung gern einen einzelnen Buchstaben
   mit auf. Ein kurzer Anhang hinter einem richtigen Namen ist fast immer
   genau das - roemische Zahlen und Ziffern natuerlich ausgenommen. */
function endeStutzen(s){
  const w = s.split(" ");
  if (w.length < 2) return s;
  const letzt = w[w.length-1];
  if (letzt.length <= 2 && /^[A-Za-z]+$/.test(letzt) && !/^[IVXLCDM]+$/.test(letzt)
      && w.slice(0,-1).join(" ").length >= 4) w.pop();
  return w.join(" ");
}
function saeubern(s){
  return endeStutzen(String(s || "")
    .replace(/[^\p{L}\p{N}_ \-\[\]()'.]+/gu, " ")   // jede Schrift, nicht nur die lateinische
    .replace(/\s+/g, " ")
    .replace(/^[^\w\[(]+/, "").replace(/[^\w\])]+$/, "")
    .replace(/\s*[-–]\s*(\d+)$/, " - $1")
    .trim());
}
/* Aus einer Zeile wie "s ROS Warsaw" Kuerzel und Ort holen. Die Stadt ist der
   verlaesslichste Anker im ganzen Bild: 1438 Namen sind bekannt, und der
   Vergleich ueber die Editierdistanz uebersteht einiges an Rauschen. Ein
   einzelnes Wort wird nur dann als Ort genommen, wenn es genau passt - sonst
   verschwaende ein Team ohne Standort seinen Namen an eine Stadt. */
/* Eine Einheit, die nirgends steht, zeigt statt des Ortes "Nicht stationiert"
   bzw. "Not deployed". Ohne diese Sperre sucht die Stadtsuche sich daraus die
   naechstbeste Stadt zusammen. */
const NICHT_STATIONIERT = /nicht\s*stat|not\s*deploy|no[nt]\s*station/i;
function tagUndOrt(zeile, sicher){
  if (NICHT_STATIONIERT.test(String(zeile))){
    const w0 = saeubern(zeile).split(" ").filter(Boolean);
    const t0 = w0.length && /^[A-Z0-9][A-Z0-9_-]{1,11}$/.test(w0[0]) ? w0[0] : "";
    return t0 ? {tag: t0, stadt: null, ort: ""} : null;
  }
  const w = saeubern(zeile).split(" ").filter(Boolean);
  if (!w.length) return null;
  let best = null;
  for (let ab = Math.max(0, w.length-3); ab < w.length; ab++){
    const tr = findeStadt(w.slice(ab).join(" "));
    if (tr && (!best || tr.d < best.tr.d)) best = {ab, tr};
  }
  if (!best) return null;
  /* Streng bleiben. Die 0,25 der Stadtsuche reichen fuer eine Ortszeile, in
     der man weiss, dass eine Stadt steht - hier weiss man es nicht, und
     "Eiserner Vorhang" ist zwei Zeichen von "Morhange" entfernt. Ein Fehler
     je acht Zeichen, mindestens einer. */
  /* Wie streng, haengt davon ab, was man weiss. Steht ein Kuerzel davor, ist
     die Zeile mit Sicherheit die Ortszeile - dann darf mehr verlesen sein.
     Ein einzelnes Wort dagegen kann auch ein Teamname sein und muss genau
     passen, sonst frisst die Stadtsuche ihn auf. */
  const laenge = namKey(MAP.n[best.tr.i][0]).length;
  const erlaubt = (sicher && w.length >= 2) ? Math.max(2, Math.floor(laenge/4))
                                            : Math.max(1, Math.floor(laenge/8));
  if (best.tr.d > erlaubt) return null;
  if (w.length < 2 && best.tr.d > 0) return null;
  /* Clankuerzel sind kurz und stehen in Grossbuchstaben - so wird aus dem
     Vornamen kein Kuerzel. */
  const vor = w.slice(0, best.ab).filter(t => /^[A-Z0-9][A-Z0-9_-]{0,7}$/.test(t));
  return {tag: vor[vor.length-1] || "",
          stadt: best.tr.i, ort: MAP.n[best.tr.i][0]};
}
function depotAusText(text){
  const zeilen = String(text).split(/\r?\n/).map(z => z.trim()).filter(z => z.length > 1);
  /* Eine echte Kampfeinheit zeigt mindestens zwei vollstaendige Zahlenpaare -
     Moral und Mannschaft, meist noch Fahrzeuge. Ohne diese Huerde entstanden
     aus dem Rauschen eines ganzen Bildschirms Zeilen wie "Cr ABA AR ARL",
     angeboten mit Haekchen und einen Klick vom Clandepot entfernt. */
  const zahlen = zeilen.map(z => zahlenAus(z));
  const zahlZeile = zeilen.map((z,i) => zahlen[i].length >= 4 ? typAusZahlen(zahlen[i]) : []);
  const raus = [];
  for (let i=0; i<zeilen.length; i++){
    const kand = zahlZeile[i];
    if (!kand.length) continue;
    /* Name, Kuerzel und Ort stehen in den ein bis zwei Zeilen darueber - oder,
       wenn die Erkennung sie mit den Zahlen zusammengezogen hat, davor. */
    const oben = [];
    for (let k=i-1; k>=0 && oben.length<2; k--){
      if (zahlZeile[k].length) break;
      oben.unshift(zeilen[k]);
    }
    /* Nach demselben Massstab abschneiden: alles vor der ersten Zahl, die
       nicht an einem Buchstaben klebt. */
    let schnitt = zeilen[i].length;
    for (let p=0; p<zeilen[i].length; p++){
      const ch = zeilen[i][p];
      if (ch >= "0" && ch <= "9" && !/[A-Za-z]/.test(zeilen[i][p-1] || "")){ schnitt = p; break; }
    }
    const vorn = saeubern(zeilen[i].slice(0, schnitt));
    if (vorn.length > 2) oben.push(vorn);
    let name = "", tag = "", ort = "", stadt = null;
    const rest = [];
    for (const z of oben){
      const t = ort ? null : tagUndOrt(z);
      if (t){ tag = t.tag; ort = t.ort; stadt = t.stadt; } else rest.push(z);
    }
    if (rest.length){
      const letzte = saeubern(rest[rest.length-1]);
      const m = ort ? null : letzte.match(/^([A-Z0-9][A-Z0-9_-]{1,11})\s+(.+)$/);
      if (m){
        tag = m[1]; ort = m[2].trim(); name = rest.length > 1 ? saeubern(rest[0]) : "";
        const tr = findeStadt(ort);
        if (tr) stadt = tr.i;
      }
      else name = saeubern(rest[0]);
    }
    /* Auch eine Zeile ganz ohne lesbaren Namen wird angeboten: der Typ steht
       fest, den Namen tippt man in einer Sekunde nach. */
    raus.push({name, tag, ort, stadt, kand, gewaehlt: kand[0]});
  }
  return raus;
}

/* ---- Welche Ansicht ist offen? --------------------------------------
   Die aktive Registerkarte der oberen Leiste ist golden hinterlegt. An einem
   echten Bildschirmfoto nachgemessen liest sie sich als "KRIEG" mit
   Zuversicht 92 - ein Wort, kein Rauschen. Gesucht wird deshalb der breite,
   flache, gut gefuellte Goldkasten im obersten Achtel.
   Findet sich keiner, ist es kein ganzes Fenster, sondern ein Ausschnitt -
   dann gibt es kein Urteil, und es wird gelesen wie bisher. */
const ANSICHT_KRIEG = ["KRIEG", "WAR"];
const ANSICHT_SOLDAT = ["SOLDATEN", "SOLDIERS", "SOLDATE"];
async function ansichtErkennen(quelle){
  const W = quelle.width, H = quelle.height;
  const hoch = Math.round(H*0.12);
  if (W < 400 || hoch < 24) return null;
  const g = quelle.getContext("2d", {willReadFrequently:true});
  const d = g.getImageData(0, 0, W, hoch).data;
  const gold = new Uint8Array(W*hoch);
  for (let i = 0, j = 0; j < W*hoch; i += 4, j++){
    const R = d[i], G = d[i+1], B = d[i+2];
    const mx = Math.max(R,G,B), mn = Math.min(R,G,B);
    if (mx > 110 && R >= G && G >= B && R > B && (mx-mn)/Math.max(mx,1) > 0.30){
      const gn = (G-B)/Math.max(1, R-B);
      if (gn > 0.42 && gn < 0.86) gold[j] = 1;
    }
  }
  /* Laeufe verbinden - dieselbe Technik wie bei den Kacheln. */
  const eltern = [], stueck = [];
  const finde = a => { while (eltern[a] !== a) a = eltern[a] = eltern[eltern[a]]; return a; };
  const eine = (a,b) => { a = finde(a); b = finde(b); if (a !== b) eltern[b] = a; };
  let vorige = [];
  for (let y = 0; y < hoch; y++){
    const jetzt = [];
    let x = 0;
    while (x < W){
      if (!gold[y*W+x]){ x++; continue; }
      const a = x;
      while (x < W && gold[y*W+x]) x++;
      const id = stueck.length;
      eltern.push(id);
      stueck.push({x0:a, x1:x-1, y0:y, y1:y, n:x-a});
      jetzt.push({id, a, b:x-1});
    }
    for (const j of jetzt) for (const v of vorige) if (j.a <= v.b && v.a <= j.b) eine(v.id, j.id);
    vorige = jetzt;
  }
  const fl = new Map();
  for (let i = 0; i < stueck.length; i++){
    const w = finde(i), k = stueck[i], f = fl.get(w);
    if (!f) fl.set(w, {x0:k.x0, x1:k.x1, y0:k.y0, y1:k.y1, n:k.n});
    else { f.x0 = Math.min(f.x0,k.x0); f.x1 = Math.max(f.x1,k.x1);
           f.y0 = Math.min(f.y0,k.y0); f.y1 = Math.max(f.y1,k.y1); f.n += k.n; }
  }
  /* Eine Registerkarte ist breit, flach und durchgefaerbt. Das Rangabzeichen
     und die Mitgliedschaftsleiste fallen damit heraus. */
  const kand = [...fl.values()].filter(f => {
    const b = f.x1-f.x0+1, hh = f.y1-f.y0+1;
    return b > W*0.035 && hh > hoch*0.12 && b/hh > 1.8 && b/hh < 9 && f.n/(b*hh) > 0.55;
  }).sort((a,b) => (b.x1-b.x0) - (a.x1-a.x0));
  if (!kand.length) return null;
  const k = kand[0];
  /* Knapp am Goldkasten schneiden. Mit Rand kaeme der dunkle Hintergrund
     ringsum mit hinein, und dann ist nicht mehr klar, was Schrift und was
     Grund ist - gelesen wurde damit "AALPAAH" statt "KREG". Dass der knappe
     Schnitt "KREG" liefert, faengt der nachsichtige Vergleich unten ab. */
  const c = document.createElement("canvas");
  const ax = k.x0, ay = k.y0;
  const br = k.x1-k.x0+1, hh = k.y1-k.y0+1;
  const f = Math.max(1, Math.min(4, 90/hh));
  c.width = Math.round(br*f); c.height = Math.round(hh*f);
  const cg = c.getContext("2d");
  cg.imageSmoothingEnabled = true; cg.imageSmoothingQuality = "high";
  cg.drawImage(quelle, ax, ay, br, hh, 0, 0, c.width, c.height);
  let txt = "";
  try { txt = (await ocrMitZuv(c, 7, ()=>{})).text; } catch(e){ return null; }
  txt = txt.toUpperCase().replace(/[^A-ZÄÖÜ]/g, "");
  if (txt.length < 3) return null;
  /* Nachsichtig vergleichen - dieselbe Toleranz wie beim Abgleich der
     Ortsnamen. "KREG" trifft damit "KRIEG"; "SHOP" bleibt mit Abstand 4
     ausserhalb. */
  const passt = liste => liste.some(s =>
    txt.includes(s) || s.includes(txt) || levenshtein(txt, s) <= 2);
  if (passt(ANSICHT_KRIEG))  return {wo:"krieg", text:txt};
  if (passt(ANSICHT_SOLDAT)) return {wo:"soldaten", text:txt};
  return {wo:"andere", text:txt};
}

/* Wo darf ueberhaupt gesucht werden? Es gibt nur zwei Orte: auf der
   Kriegskarte ganz rechts, im Soldatenfenster etwa in der Mitte. An den
   vorliegenden Bildern abgelesen liegt die Liste bei 0,799..0,983 (Krieg)
   und bei 0,357..0,569 (Soldaten) der Bildbreite; die Grenzen sind
   grosszuegig darum gelegt. Alles ausserhalb wird gar nicht erst angeschaut -
   damit fallen Reiterknoepfe und Ordensleisten weg. */
const SUCHFELD = {krieg: [0.62, 1.00], soldaten: [0.22, 0.74]};

/* Der Rahmen wird um das gelegt, was der Finder wirklich gefunden hat -
   nicht auf geratene Bildschirmanteile. */
function listenRahmen(quelle, wo){
  const feld = (wo && SUCHFELD[wo]) || [0, 1];
  const vx = Math.round(feld[0]*quelle.width);
  const vb = Math.round((feld[1]-feld[0])*quelle.width);
  let eng = quelle;
  if (vb > 40 && (vx > 0 || vb < quelle.width)){
    eng = document.createElement("canvas");
    eng.width = vb; eng.height = quelle.height;
    eng.getContext("2d", {willReadFrequently:true})
       .drawImage(quelle, vx, 0, vb, quelle.height, 0, 0, vb, quelle.height);
  }
  let r;
  try { r = kartenRaster(eng); } catch(e){ return null; }
  if (!r || !r.ok || !r.karten.length) return null;
  const W = quelle.width, H = quelle.height;
  const vs = (eng === quelle) ? 0 : vx;
  const oben = Math.min(...r.karten.map(k => k.oben));
  const unten = Math.max(...r.karten.map(k => k.oben)) + r.P;
  const links = Math.min(r.panel[0], r.kastenX[0]) + vs;
  const rechts = Math.max(r.panel[1], r.textRechts ? Math.max(...r.textRechts) : r.panel[1]) + vs;
  const luft = 0.12*r.P;
  const x0 = Math.max(0, links - luft), x1 = Math.min(W, rechts + luft);
  const y0 = Math.max(0, oben - luft), y1 = Math.min(H, unten + luft);
  if (x1 - x0 < 20 || y1 - y0 < 20) return null;
  return {n: r.n, box: {x: x0/W, y: y0/H, w: (x1-x0)/W, h: (y1-y0)/H}};
}

/* ---- reading a battle screenshot -------------------------------------
   The battle detail screen carries far more than names: the town, both
   sides' strength and the whole player list. The town is the easy part —
   we know all 1438 names, so we only have to find the closest one, which
   survives a lot of OCR noise. */
function levenshtein(a, b){
  if (a === b) return 0;
  if (!a.length || !b.length) return Math.max(a.length, b.length);
  let prev = Array.from({length: b.length+1}, (_,i)=>i);
  for (let i=1;i<=a.length;i++){
    const cur = [i];
    for (let j=1;j<=b.length;j++)
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    prev = cur;
  }
  return prev[b.length];
}
const STADT_KEYS = MAP.n.map((n,i) => [namKey(n[0]), i]);
function findeStadt(zeile){
  const k = namKey(zeile);
  if (k.length < 4) return null;
  let best = null;
  for (const [sk, i] of STADT_KEYS){
    if (sk === k) return {i, d:0, sicher:true};
    if (Math.abs(sk.length - k.length) > 4) continue;
    const d = levenshtein(k, sk);
    if (!best || d < best.d) best = {i, d, sicher:false};
  }
  if (!best) return null;
  const rel = best.d / Math.max(4, namKey(MAP.n[best.i][0]).length);
  return rel <= 0.25 ? {...best, sicher: rel <= 0.12} : null;
}
/* "1.4k" -> 1400, "230" -> 230 */
const zahlWert = s => {
  const m = String(s).replace(/,/g, ".").match(/^(\d+(?:\.\d+)?)\s*([km])?$/i);
  if (!m) return null;
  const v = parseFloat(m[1]);
  return Math.round(m[2] ? v * (m[2].toLowerCase() === "k" ? 1000 : 1e6) : v);
};

/* Reading names off a screenshot needs a real OCR engine. It is loaded from a

      const nm = felder[0].value.trim();
      const clan = (felder[1] && felder[1].value.trim()) || clanAlle;
      if (merkeSpieler(nm, fv === "" ? undefined : +fv, clan)) n++;
    });
    // Stadt und Staerke uebernehmen
    let stadtTxt = "";
    const ort = stadtAus("ocr-stadt");
    if (ort !== null && MAP.n[ort]){
      sel = ort;
      const strCb = document.getElementById("ocr-str");
      if (strCb && strCb.checked){
        const st = JSON.parse(document.getElementById("ocr-out").dataset.staerke || "[]");
        if (st.length){
          const txt = st.map(v=>"~"+v.toLocaleString("en")).join(" / ") + " men (from battle screen)";
          setEst(ort, myEst(ort).concat([{text: txt}]));
        }
      }
      stadtTxt = ` · ${MAP.n[ort][0]}`;
    }
    closeDlg();
    if (sel !== null){ flyTo(sel); side(); draw(); }
    toast(`${n} name${n===1?"":"s"} recorded${stadtTxt}`);
  });
}
async function ocrLesen(datei){
  const st = document.getElementById("ocr-status");
  const setz = s => { if (st) st.innerHTML = s; };
  /* Hier bleibt das Bild zunaechst unangetastet. Der Schlachtbildschirm ist
     schon hell auf dunkel und gross gesetzt - gemessen liest Tesseract ihn
     roh besser als aufbereitet, weil die Aufbereitung die Kantenglaettung
     wegnimmt, von der er bei kleiner Schrift lebt. Erst wenn kaum etwas
     ankommt, wird der zweite Weg versucht. */
  let text = "";
  const zaehlbar = t => t.split(/\r?\n/).filter(z => z.trim().length >= 3
                        && /[A-Za-z]/.test(z) && !/^[\d\s.,%:\/-]+$/.test(z.trim())).length;
  try {
    setz("Reading … this takes a few seconds.");
    text = await ocrText(datei, 3, setz);
    if (zaehlbar(text) < 3){
      setz("Reading again, with the picture brightened …");
      const zweit = await ocrText(await bildAufbereiten(datei, null), 3, setz);
      if (zaehlbar(zweit) > zaehlbar(text)) text = zweit;
    }
  } catch(e){
    setz(`<b>Reading failed.</b> The recogniser needs internet access and does not work offline
          or inside the preview. Use <b>Add many at once</b> and type the names instead.`);
    return;
  }

  // Zeilen zu Kandidaten machen: alles was wie ein Name aussehen koennte
  const roh = text.split(/\r?\n/).map(z => z.trim())
    .filter(z => z.length >= 3 && z.length <= 28 && /[A-Za-z]/.test(z));
  const gesehen = new Set(), kand = [];
  for (let z of roh){
    z = z.replace(/\s{2,}.*$/, "").trim();          // Spalten hinter dem Namen abschneiden
    if (/^[\d\s.,%:/-]+$/.test(z)) continue;         // reine Zahlenzeilen raus
    const k = namKey(z);
    if (k.length < 2 || gesehen.has(k)) continue;
    gesehen.add(k); kand.push(z);
  }
  // --- Stadt: gegen alle bekannten Namen abgleichen -------------------
  let stadt = null;
  for (const z of roh.slice(0, 12)){
    const tr = findeStadt(z);
    if (tr && (!stadt || tr.d < stadt.d)) stadt = tr;
    if (stadt && stadt.sicher) break;
  }
  // --- Truppenstärke: die grossen Zahlen der Uebersicht ---------------
  const zahlen = [];
  for (const z of roh){
    const teile = z.split(/\s+/).map(zahlWert).filter(v => v !== null && v > 0);
    if (teile.length >= 3) zahlen.push(teile);
  }
  const staerke = zahlen.sort((a,b)=> Math.max(...b) - Math.max(...a)).slice(0, 2)
                        .map(r => Math.max(...r));

  if (!kand.length && !stadt){
    setz("<b>Nothing recognised.</b> Try a sharper or tighter screenshot."); return;
  }
  setz(`${stadt ? `<b>${esc(MAP.n[stadt.i][0])}</b>${stadt.sicher?"":" (unsure)"} · ` : ""}`
     + `<b>${kand.length}</b> name candidate${kand.length===1?"":"s"}`
     + `${staerke.length ? ` · strength around ${staerke.map(v=>v.toLocaleString("en")).join(" vs ")}` : ""}`);

  const out = document.getElementById("ocr-out");
  out.querySelector("#ocr-stadt-box").innerHTML = `
    <div class="row" style="align-items:center">
      <span style="font-size:12px;color:var(--dim);width:74px">Town</span>
      <div id="ocr-stadt" style="flex:1"></div>
    </div>
    ${staerke.length ? `<label class="toggle" style="margin-top:5px">
      <input type="checkbox" id="ocr-str" checked>
      <span>Note strength there: <b>${staerke.map(v=>"~"+v.toLocaleString("en")).join(" / ")}</b> men</span></label>` : ""}`;
  stadtWahl(document.getElementById("ocr-stadt"), stadt ? stadt.i : null,
            "not recognised — pick it");
  out.dataset.staerke = JSON.stringify(staerke);

  const liste = document.getElementById("ocr-list");
  liste.innerHTML = kand.map(z => {
    // Clan-Tag in eckigen Klammern abtrennen: "[SRB]CrazySerb"
    const clan = tagAus(z), nm = z;
    const bekannt = spielerListe().find(p => namKey(p.name) === namKey(nm));
    return `<label class="zeile" style="display:flex;align-items:center;gap:6px">
      <input type="checkbox" ${bekannt?"":"checked"}>
      <input type="text" value="${esc(nm)}" style="flex:1;background:var(--panel2);
        border:1px solid var(--line);border-radius:2px;padding:3px 6px;outline:0;font-size:12px">
      <input type="text" value="${esc(clan)}" placeholder="clan" style="width:78px;background:var(--panel2);
        border:1px solid var(--line);border-radius:2px;padding:3px 6px;outline:0;font-size:11px">
      ${bekannt?`<span style="font-size:10px;color:var(--dim2)">known</span>`:""}
    </label>`;
  }).join("");
  out.style.display = "flex";
  document.getElementById("ocr-go").disabled = false;
}

/* What we believe one enemy player owns. Shared, so the whole clan builds it
   up together; name and tag are there so nobody enters the same team twice. */
/* ---- Gegnerische Kampfeinheiten: Zeile lesen und abgleichen ----------
   Das Fenster ueber einer Einheit nennt sie "KUERZEL - NAME". Geteilt wird am
   ERSTEN Trenner: der Name darf selbst welche enthalten, "BODEN1 -
   BODENMAENNER - 1" hat das Kuerzel BODEN1.
   Gekuerzt wird nach Fensterbreite, nicht nach Zeichenzahl - am Ende steht
   dann ein Auslassungszeichen. Ein solcher Name ist unvollstaendig und wird
   nie ergaenzt, nur vermerkt. */
const AT_TRENNER = /\s[-\u2010-\u2015\u2212]\s/;
function atZeileTeilen(zeile){
  const s = String(zeile == null ? "" : zeile).replace(/\s+/g, " ").trim();
  if (!s) return null;
  const m = AT_TRENNER.exec(s);
  if (!m) return {tag: "", name: s, kurz: /(\u2026|\.\.\.)$/.test(s)};
  let tag = s.slice(0, m.index).trim();
  let name = s.slice(m.index + m[0].length).trim();
  const kurz = /(\u2026|\.\.\.)$/.test(name);
  if (kurz) name = name.replace(/\s*(\u2026|\.\.\.)$/, "").trim();
  return {tag, name, kurz};
}
/* Kuerzel vergleichbar machen, ohne Zeichen wegzuwerfen: nur Grossschreibung
   und Leerraum. Welche Schrift jemand benutzt, geht uns nichts an. */
const atTagKey = s => String(s == null ? "" : s).replace(/\s+/g, "").toUpperCase();
/* Zwei Eintraege sind dieselbe Einheit, wenn die Kuerzel uebereinstimmen.
   Fehlt eines, hilft der Name - ein abgeschnittener zaehlt als Treffer, wenn
   der laengere so anfaengt. */
function gleicheAT(a, b){
  const ta = atTagKey(a.tag), tb = atTagKey(b.tag);
  if (ta && tb) return ta === tb;
  const na = String(a.name || "").trim().toLowerCase();
  const nb = String(b.name || "").trim().toLowerCase();
  if (!na || !nb) return false;
  if (na === nb) return true;
  const kurz = a.kurz || b.kurz;
  return kurz && (na.startsWith(nb) || nb.startsWith(na));
}
/* "USSR-003" -> Stamm "USSR-", Nummer 3, drei Stellen. Der Stamm ist alles vor
   der abschliessenden Zahl - ob er mit der Fraktion beginnt oder mit "INF",
   spielt keine Rolle. */
function atNummer(tag){
  const m = /^(.*?)(\d+)$/.exec(String(tag == null ? "" : tag).trim());
  if (!m || !m[1]) return null;
  return {stamm: m[1], zahl: +m[2], stellen: m[2].length};
}
/* Welche Nummern unterhalb der eingetragenen fehlen noch? */
/* Bis wohin nehmen wir eine Nummer ernst? Kampfeinheiten kosten Befehls-
   punkte und Kriegsgeld; einige Dutzend sind viel. Wer "-208" dranschreibt,
   will nur groesser wirken. Ab 40 wird deshalb nicht mehr gefragt, und mehr
   als zehn Luecken auf einmal gibt es nie - sonst ploppen zweihundert Zeilen
   auf. */
const AT_NUMMER_MAX = 40;
const AT_LUECKEN_MAX = 15;
function atLuecken(liste, tag){
  const n = atNummer(tag);
  if (!n || n.zahl < 2 || n.zahl > AT_NUMMER_MAX) return [];
  const da = new Set();
  for (const d of liste){
    const q = atNummer(d.tag);
    if (q && q.stamm === n.stamm) da.add(q.zahl);
  }
  const fehlt = [];
  for (let i = 1; i < n.zahl; i++)
    if (!da.has(i)) fehlt.push(n.stamm + String(i).padStart(n.stellen, "0"));
  return fehlt.length > AT_LUECKEN_MAX ? [] : fehlt;
}

/* Ein Platzhalter ist bekannt, aber nicht aufgeklaert. */
const atEcht  = l => (l || []).filter(d => !d.ung);
const atOffen = l => (l || []).filter(d => d.ung);
/* Aus der hoechsten Nummer folgt, wie viele es mindestens gibt: wer USSR-012
   fuehrt, hat zwoelf Kampfeinheiten - auch wenn erst vier bekannt sind.
   Angeberzahlen jenseits der Grenze zaehlen dabei nicht mit. */
function atMindestens(liste){
  let m = 0;
  for (const d of (liste || [])){
    const q = atNummer(d.tag);
    if (q && q.zahl <= AT_NUMMER_MAX) m = Math.max(m, q.zahl);
  }
  return m;
}

/* ---- Zeichenhilfe ----------------------------------------------------
   Namen kommen aus allen Schriften der Welt, und manche bestehen aus
   Sonderzeichen, die auf keiner Tastatur liegen - 8.png ist siebenmal U+3020.
   Eine Bildschirmtastatur dafuer gibt es nicht. Zwei Wege helfen wirklich:
   das Zeichen ueber seine Nummer einfuegen, und eine Ablage der Zeichen, die
   in dieser Datenbank schon vorkommen. Die wiederholen sich, weil dieselben
   Leute dieselben Spielereien treiben. */
function zeichenAblage(){
  const zahl = new Map();
  const nimm = s => {
    for (const ch of String(s || "")){
      if (ch.codePointAt(0) < 128) continue;          // gewoehnliche Tastatur
      zahl.set(ch, (zahl.get(ch) || 0) + 1);
    }
  };
  for (const e of Object.values(S.edep || {}))
    for (const d of (Array.isArray(e.v) ? e.v : [])){ nimm(d.name); nimm(d.tag); }
  for (const e of Object.values(S.roster || {})) nimm(e && e.v && e.v.name);
  return [...zahl.entries()].sort((a,b)=>b[1]-a[1]).slice(0, 48).map(x=>x[0]);
}
/* "3020", "U+3020" oder "〠" selbst - alles ergibt dasselbe Zeichen. */
function zeichenAus(eingabe){
  const s = String(eingabe || "").trim();
  if (!s) return "";
  const m = /^(?:u\+?)?([0-9a-f]{2,6})$/i.exec(s);
  if (m){
    const n = parseInt(m[1], 16);
    if (n > 0 && n <= 0x10ffff){ try { return String.fromCodePoint(n); } catch(e){ return ""; } }
  }
  return s;
}

/* ---- Schlachtanalyse -------------------------------------------------
   Was eine Seite aufstellen kann, folgt aus dem Vorrat am Ort und den Kosten
   eines Truppentyps. Beides steht in den Spieldateien: Infantry kostet 90
   Infantryman, Recon 20 Recon. Das Minimum ueber alle benoetigten Ressourcen
   ist die Zahl - mehr geht nicht, auch wenn von einer anderen Ressource noch
   reichlich da ist. */
const battleStand = i => (S.btl[i] && S.btl[i].v) || null;
function setBattle(i, v){
  S.btl[i] = {v, t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`btl:${i}`); save();
}
function ausRessourcen(vorrat){
  const raus = [];
  for (const a of MAP.at){
    const kost = a.cost || {};
    const ks = Object.keys(kost);
    if (!ks.length) continue;
    let n = Infinity;
    for (const k of ks) n = Math.min(n, Math.floor((+vorrat[k] || 0) / kost[k]));
    if (isFinite(n) && n > 0) raus.push({k: a.k, n, zweig: a.branch || "other"});
  }
  return raus.sort((x,y)=>y.n - x.n);
}
/* Je Zweig die staerkste Aufstellung - so bleibt die Gegenueberstellung
   lesbar, statt achtzehn Zeilen nebeneinanderzustellen. */
function zweigStaerke(liste){
  const m = new Map();
  for (const e of liste){
    const d = m.get(e.zweig) || {zweig: e.zweig, best: 0, typen: []};
    if (e.n > d.best) d.best = e.n;
    d.typen.push(e);
    m.set(e.zweig, d);
  }
  return m;
}
/* Was droht und was fehlt. Bewusst wenige, klare Saetze - wer vor einem
   Kampf steht, liest keine Tabelle mit achtzehn Zeilen. */
function schlachtUrteil(wir, sie){
  const zw = z => (ZWEIGE.find(x=>x.k===z)||{name:z}).name;
  const a = zweigStaerke(wir), b = zweigStaerke(sie);
  const zweige = [...new Set([...a.keys(), ...b.keys()])];
  const droht = [], fehlt = [], gleich = [];
  for (const z of zweige){
    const u = (a.get(z)||{best:0}).best, g = (b.get(z)||{best:0}).best;
    if (!g && !u) continue;
    if (g > 0 && u === 0) fehlt.push(`Nothing to answer their ${zw(z).toLowerCase()} — they can field ${g}, you none.`);
    else if (g >= 2*u && g - u >= 2) droht.push(`${zw(z)}: they can field ${g}, you ${u}.`);
    else if (u >= 2*g && u - g >= 2) gleich.push(`${zw(z)} is yours — ${u} against ${g}.`);
  }
  return {droht, fehlt, stark: gleich};
}

/* ---- Vermutete Zeitzone ----------------------------------------------
   In Stunden gegen UTC, weil das die einzige Angabe ist, die sich aus einer
   Beobachtung wirklich ableiten laesst - eine Region waere schon Deutung.
   Der Clan erbt die haeufigste seiner erfassten Mitglieder. */
const TZ_WAHL = [[-8,"UTC-8 US West"],[-5,"UTC-5 US Ost"],[-3,"UTC-3 Suedamerika"],
                 [0,"UTC+0 UK/Portugal"],[1,"UTC+1 Mitteleuropa"],[2,"UTC+2 Osteuropa"],
                 [3,"UTC+3 Moskau"],[5,"UTC+5 Zentralasien"],[8,"UTC+8 China"],
                 [9,"UTC+9 Japan/Korea"],[10,"UTC+10 Australien"]];
function setSpielerZeit(key, tz){
  const e = S.roster[key];
  if (!e || !e.v) return;
  S.roster[key] = {...e, v: {...e.v, tz: (tz === null || tz === "") ? undefined : +tz},
                   t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`roster:${key}`); save();
}
const spielerZeit = key => {
  const v = S.roster[key] && S.roster[key].v;
  return (v && typeof v.tz === "number") ? v.tz : null;
};
function clanZeit(clanName){
  const z = new Map();
  for (const p of spielerListe()){
    if ((p.clan||"").trim().toLowerCase() !== String(clanName).trim().toLowerCase()) continue;
    const tz = spielerZeit(p.key);
    if (tz !== null) z.set(tz, (z.get(tz)||0) + 1);
  }
  if (!z.size) return null;
  const best = [...z.entries()].sort((a,b)=>b[1]-a[1])[0];
  return {tz: best[0], von: best[1], gesamt: [...z.values()].reduce((s,x)=>s+x,0)};
}
const tzText = tz => tz === null || tz === undefined ? "—"
  : (TZ_WAHL.find(x=>x[0]===tz) || [tz, `UTC${tz>=0?"+":""}${tz}`])[1];

/* ---- Wer ist gerade da? ----------------------------------------------
   Jede Eingabe traegt ihren Zeitstempel. Daraus entsteht von selbst ein Bild
   ueber die Stunden des Tages und ueber die Wochentage - ohne dass jemand
   eine Statistik pflegen muesste. */
function aktMelden(f, clan, n){
  const id = Math.random().toString(36).slice(2,10);
  S.akt[id] = {v: {f, clan: String(clan||"").trim(), n: Math.max(0, +n||0)},
               t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`akt:${id}`); save();
}
function aktListe(){
  const raus = [];
  for (const k of Object.keys(S.akt || {})){
    const e = S.akt[k];
    if (!e || !e.v || !imKrieg(e)) continue;
    raus.push({id:k, t:e.t||0, ...e.v});
  }
  return raus.sort((a,b)=>b.t-a.t);
}
/* Nach Stunde und nach Wochentag, in der Zeit des Betrachters - wer die Karte
   liest, plant in seiner eigenen. */
function aktMuster(liste){
  const std = new Array(24).fill(0), tag = new Array(7).fill(0);
  let hoechst = 0;
  for (const a of liste){
    const d = new Date(a.t);
    std[d.getHours()] += a.n;
    tag[d.getDay()] += a.n;
    hoechst = Math.max(hoechst, a.n);
  }
  return {std, tag, hoechst};
}

/* ---- Ereignisse auf der Zeitachse ------------------------------------
   Was das ganze Spiel verschiebt, gehoert neben die Aktivitaetskurve: sonst
   erklaert niemand mehr, warum ab einem Dienstag alles anders aussieht. */
function ereignisse(){
  const e = S.meta.ereig;
  return (e && Array.isArray(e.v)) ? e.v.slice().sort((a,b)=>String(a.d).localeCompare(String(b.d))) : [];
}
function setEreignisse(l){ setMeta("ereig", l); }

/* ---- Gegnerisches Arsenal und Rollen ---------------------------------
   Beides haengt an derselben Zeile wie die Kampfeinheiten - eine Zeile je
   Spieler, damit der Abgleich zwischen den Clanmitgliedern einfach bleibt.
   Je Fraktion ein eigenes Arsenal: dieselbe Person spielt in verschiedenen
   Kriegen verschiedene Seiten, und was sie als Deutscher fuhr, sagt nichts
   darueber, womit sie als Russe antritt. */
function setFeindTeil(key, teil){
  const alt = S.edep[key] || {};
  S.edep[key] = Object.assign({}, alt, teil,
                              {t: jetzt(), by: S.me, n: S.name || ""});
  dirty.add(`edep:${key}`); save();
}
function feindArsenal(key, f){
  const a = (S.edep[key] && S.edep[key].ars) || {};
  const x = a[f] || a[String(f)] || {};
  return {w: Array.isArray(x.w) ? x.w : [], v: Array.isArray(x.v) ? x.v : []};
}
function setFeindArsenal(key, f, wert){
  const alt = (S.edep[key] && S.edep[key].ars) || {};
  setFeindTeil(key, {ars: Object.assign({}, alt, {[f]: wert})});
}
const feindRollen = key => {
  const r = S.edep[key] && S.edep[key].rollen;
  return Array.isArray(r) ? r : [];
};
/* Der Fraktionscode der Spieldateien ist 1-basiert, 0 heisst "fuer alle". */
const fuerSeite = (eintrag, f) => !eintrag.f || eintrag.f === f + 1;
/* Vorschlaege fuer Rollen: was im Clan schon vergeben wurde, dazu ein paar
   gaengige. So bildet sich eine gemeinsame Sprache statt fuenfzehn
   Schreibweisen fuer dasselbe. */
const ROLLEN_START = ["good pilot", "good tanker", "good at gunner", "sniper",
                      "medic", "squad leader", "recon", "cheater?"];
function rollenVorrat(){
  const z = new Map();
  for (const e of Object.values(S.edep || {}))
    for (const r of (Array.isArray(e.rollen) ? e.rollen : []))
      z.set(r, (z.get(r) || 0) + 1);
  const raus = [...z.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  for (const r of ROLLEN_START) if (!z.has(r)) raus.push(r);
  return raus.slice(0, 40);
}
