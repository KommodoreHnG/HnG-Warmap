/* ---------------- clan depot ----------------
   What the clan owns, how it grew, who carries which part of it and where it
   stands right now — five views on the same set of depots. The strip in the
   header is the short version of the first one. */
const ZWEIG_FARBE = {infantry:"#8fae5f", recon:"#5fa8c8", armor:"#c98a3c",
                     airborne:"#a97fd0", airforce:"#d8686a", other:"#7a705f"};
/* A stable colour per player, so the same person keeps their band in every
   bar without anyone having to pick colours. */
const spielerFarbe = who => `hsl(${parseInt(namHash(String(who)), 36) % 360} 52% 56%)`;
const summeVon = o => Object.values(o||{}).reduce((s,n)=>s+n, 0);

/* One row per day on which anything changed, every player carried forward
   from their last snapshot — otherwise somebody who bought nothing this week
   would silently drop out of the clan total. */
function clanVerlauf(){
  const leute = [...depotIdx.entries()]
    .map(([who,d]) => ({who, name:d.name, h:(d.h||[]).slice().sort((a,b)=>a.d-b.d)}))
    .filter(p => p.h.length);
  const tage = [...new Set(leute.flatMap(p => p.h.map(x=>x.d)))].sort((a,b)=>a-b);
  if (!tage.length) return {reihen:[], leute};
  const heute = tagNr();
  if (tage[tage.length-1] < heute) tage.push(heute);      // bis heute fortschreiben
  const reihen = tage.map(d => {
    const per = {}; let gesamt = 0, men = 0;
    for (const p of leute){
      let letzt = null;
      for (const x of p.h){ if (x.d <= d) letzt = x; else break; }
      if (!letzt) continue;
      for (const [k,n] of Object.entries(letzt.c)){
        const z = zweigVon(k);
        per[z] = (per[z]||0) + n;
        gesamt += n; men += n*atMen(k);
      }
    }
    return {d, per, gesamt, men};
  });
  return {reihen, leute};
}
/* Stepped, not interpolated: a team appears on the day it was bought, not
   gradually over the week before it. */
function wachstumSVG(reihen, breite, hoehe){
  const L = 38, R = 10, O = 10, U = 20;
  const iw = breite - L - R, ih = hoehe - O - U;
  const d0 = reihen[0].d, d1 = reihen[reihen.length-1].d, spanne = Math.max(1, d1-d0);
  const maxY = Math.max(1, ...reihen.map(r=>r.gesamt));
  const schritt = Math.max(1, Math.ceil(maxY/4));
  const X = d => L + (d-d0)/spanne*iw;
  const Y = v => O + ih - (v/maxY)*ih;
  const zweige = ZWEIGE.map(z=>z.k).filter(z => reihen.some(r => r.per[z]));
  const kante = w => {
    const p = [];
    reihen.forEach((r,i)=>{
      p.push([X(r.d), Y(w[i])]);
      if (i < reihen.length-1) p.push([X(reihen[i+1].d), Y(w[i])]);
    });
    return p;
  };
  let unten = reihen.map(()=>0);
  const bahnen = [];
  for (const z of zweige){
    const oben = reihen.map((r,i)=> unten[i] + (r.per[z]||0));
    const o = kante(oben), u = kante(unten).reverse();
    const d = o.map((q,i)=>`${i?"L":"M"}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join("")
            + u.map(q=>`L${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join("") + "Z";
    bahnen.push(`<path d="${d}" fill="${ZWEIG_FARBE[z]}" fill-opacity=".6"
      stroke="${ZWEIG_FARBE[z]}" stroke-width="1.1" stroke-linejoin="round"><title>${
      esc(zweigName(z))}</title></path>`);
    unten = oben;
  }
  const netz = [];
  for (let v=0; v<=maxY; v+=schritt){
    netz.push(`<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${breite-R}" y2="${Y(v).toFixed(1)}"
      stroke="currentColor" stroke-opacity=".16"/>`);
    netz.push(`<text x="${L-5}" y="${(Y(v)+3.4).toFixed(1)}" text-anchor="end" font-size="9"
      fill="currentColor" fill-opacity=".6">${v}</text>`);
  }
  const marken = [[d0,"start",L],[d1,"end",breite-R]].map(([d,anker,x])=>
    `<text x="${x}" y="${hoehe-6}" text-anchor="${anker}" font-size="9"
       fill="currentColor" fill-opacity=".6">${tagDatum(d)}</text>`);
  return `<svg viewBox="0 0 ${breite} ${hoehe}" width="${breite}" height="${hoehe}"
    style="color:var(--dim)">${netz.join("")}${bahnen.join("")}${marken.join("")}</svg>`;
}
/* What each player added since a cut-off day. Somebody whose depot only
   starts after the cut-off counts as entirely new rather than as growth. */
function zuwachs(tageZurueck){
  const grenze = tagNr() - tageZurueck;
  const raus = [];
  for (const [who,d] of depotIdx){
    const h = (d.h||[]).slice().sort((a,b)=>a.d-b.d);
    if (!h.length) continue;
    let vorher = null;
    for (const x of h){ if (x.d <= grenze) vorher = x; else break; }
    const jetztN = summeVon(h[h.length-1].c);
    raus.push({who, name:d.name, mine: who === S.me, frisch: !vorher,
               delta: vorher ? jetztN - summeVon(vorher.c) : null, jetzt: jetztN});
  }
  return raus.sort((a,b)=> b.delta - a.delta);
}
const RANGLISTEN = [
  {name:"Most teams",        sym:"",                   e:"teams",
   wert: l => l.length},
  {name:"Most men",          sym:"infantry",           e:"men",
   wert: l => l.reduce((s,d)=>s+atMen(d.k), 0)},
  {name:"Most tanks",        sym:"medium_armor",       e:"vehicles",
   wert: l => l.filter(d=>isArmor(d.k)).reduce((s,d)=>s+atVeh(d.k), 0)},
  {name:"Most paratroopers", sym:"paratroopers",       e:"men",
   wert: l => l.filter(d=>zweigVon(d.k)==="airborne").reduce((s,d)=>s+atMen(d.k), 0)},
  {name:"Most planes",       sym:"fighter_squadron",   e:"planes",
   wert: l => l.filter(d=>isAir(d.k)).reduce((s,d)=>s+atVeh(d.k), 0)},
  {name:"Most fighters",     sym:"heavy_fighter_squadron", e:"planes",
   wert: l => l.filter(d=>zweigVon(d.k)==="airforce").reduce((s,d)=>s+atVeh(d.k), 0)},
  {name:"Most recon",        sym:"mechanized_recon",   e:"teams",

  {name:"Deepest pockets",   sym:"",                   e:"warfunds",

];

document.getElementById("b-clan").addEventListener("click", ()=>clanDialog());
function clanDialog(tab){
  const c = light() ? "#1a2029" : "#e9e2d5";
  const nz = n => n.toLocaleString("en");
  const {typen, teams, drin} = clanKraft();

  /* One pass over every depot: totals, per player, per type and per type per
     player — everything the five tabs need. */
  let men = 0, veh = 0, cp = 0, wf = 0;
  const leute = [], proTypSpieler = new Map();
  for (const [who, d] of depotIdx){
    const raus = deployedIds(who);
    const orte = new Map();
    for (const [town, gruppen] of unitIdx)
      for (const g of gruppen)
        if (g.who === who && MAP.n[town]) orte.set(town, g.list.length);
    const p = {who, name: d.name || who, mine: who === S.me, liste: d.list,
               gesamt: d.list.length, drin: raus.size, frei: d.list.length - raus.size,
               orte, men:0, veh:0, cp:0, wf:0, armor:0};
    for (const t of d.list){
      const m = proTypSpieler.get(t.k) || new Map();      // auch unbekannte Typen
      m.set(who, (m.get(who)||0) + 1);
      proTypSpieler.set(t.k, m);
      const a = AT[t.k]; if (!a) continue;
      p.men += atMen(t.k); p.veh += atVeh(t.k); p.cp += a.cp; p.wf += a.wf[0];
      if (isArmor(t.k)) p.armor += atVeh(t.k);
    }
    men += p.men; veh += p.veh; cp += p.cp; wf += p.wf;
    leute.push(p);
  }
  leute.sort((a,b)=> b.gesamt - a.gesamt || b.men - a.men);
  const namen = new Map(leute.map(p=>[p.who, p.name]));

  /* What is actually standing on the map, by type — the deployment view. */
  const imFeld = new Map();
  let feldTeams = 0, feldMen = 0;
  for (const [, gruppen] of unitIdx)
    for (const g of gruppen)
      for (const u of g.list){
        const t = imFeld.get(u.k) || {teams:0, men:0, wer:new Set()};
        t.teams += u.s; t.men += u.s*atMen(u.k); t.wer.add(g.who);
        imFeld.set(u.k, t);
        feldTeams += u.s; feldMen += u.s*atMen(u.k);
      }

  const {reihen} = clanVerlauf();
  const anfragen = livePosts().filter(([,e]) => e.v.req);
  const zeigeZweige = ZWEIGE.map(z=>z.k).filter(z => reihen.some(r => r.per[z]));

  const shareBar = (k) => {
    const m = proTypSpieler.get(k) || new Map();
    const ges = [...m.values()].reduce((s,n)=>s+n, 0) || 1;
    return `<div class="share">${[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([who,n])=>
      `<i style="width:${(100*n/ges).toFixed(1)}%;background:${spielerFarbe(who)}"
         title="${esc(namen.get(who)||who)} — ${n} of ${ges} (${Math.round(100*n/ges)} %)"></i>`).join("")}</div>`;

/* ---------------- faction pool: what the side can actually pay for -------
   The pool is the whole faction's, not the clan's — everyone draws from it.
   That is exactly why it is worth watching: 225 heavy tanks at +2 per ten
   minutes is the reason a heavy armour push has to be planned days ahead. */
function poolPanel(){
  const c = light() ? "#1a2029" : "#e9e2d5";
  const nz = n => n.toLocaleString("en");
  const stand = poolStand();
  if (!stand) return `
    
    <div class="row"><button class="btn primary" id="pool-set">Enter the faction pool …</button></div>`;

  const gruppen = ["army", "armor", "air", "other"].filter(g => resListe().some(r => r.grp === g));
  const zeile = r => {
    const proStunde = r.sek ? Math.round(r.pro * 3600 / r.sek) : 0;
    return `<tr>
      <td>${esc(resName(r.k))}</td>
      <td><b>${nz(stand.jetzt[r.k])}</b></td>
      <td style="color:var(--dim2)">${nz(stand.gelesen[r.k])}${
        stand.takte[r.k] ? ` +${stand.takte[r.k]}×${r.pro}` : ""}</td>
      <td>+${nz(r.pro)}</td>
      <td>${nz(proStunde)}</td>
      <td>${nz(proStunde * 24)}</td></tr>`;
  };
  /* Sorted by what the pool is shortest of, because that is the planning
     question — not which team is nominally cheapest. */
  const teams = MAP.at.map(a => ({a, v: teamAusVorrat(a.k, stand)}))
    .filter(x => x.v)
    .sort((x, y) => x.v.stueck - y.v.stueck || y.v.wartenS - x.v.wartenS);

  return `
    <div class="row" style="align-items:center;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--dim)">Read by <b>${esc(stand.by || "?")}</b>
        ${alterText(stand.t)}${stand.f != null ? " · " : ""}</span>
      ${stand.f != null ? fBadge(stand.f) : ""}
      <button class="btn" id="pool-set" style="margin-left:auto">Update the reading …</button>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Resource</th><th>In the pool</th><th>As read</th>
        <th>Per ${resListe()[0] ? Math.round(resListe()[0].sek/60) : 10} min</th>
        <th>Per hour</th><th>Per day</th></tr></thead>
      ${gruppen.map(g => `<tbody>
        <tr><th colspan="6" style="text-align:left">${esc(RES_GRP[g] || g)}</th></tr>
        ${resListe().filter(r => r.grp === g).map(zeile).join("")}
      </tbody>`).join("")}
    </table></div>
    <div class="row" style="align-items:center;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--dim)">Planning for</span>
      <input type="number" id="pool-n" min="1" max="99" value="1"
        style="width:62px;background:var(--panel2);border:1px solid var(--line);
          border-radius:2px;padding:4px 6px;outline:0;text-align:right">
      <span style="font-size:12px;color:var(--dim)">of a type — the last column says when the
        pool covers that many.</span>
    </div>
    <div class="tw"><table>
      <thead><tr><th colspan="2">Assault team</th><th>Price out of the pool</th>
        <th>Pool allows</th><th>Runs out of</th>
        <th>Enough for <span data-zn>1</span> in</th></tr></thead>
      <tbody>${teams.map(({a, v}) => `<tr${v.stueck ? "" : ' style="opacity:.7"'}>
        <td class="sy">${symbolSVG(a.k, c, 24, 17)}</td><td>${esc(a.name)}</td>
        <td style="text-align:left">${Object.entries(v.cost).map(([rk, n]) =>
          `${n}× ${esc(resName(rk))}`).join(" · ")}</td>
        <td style="color:${v.stueck ? "var(--accent)" : "var(--su)"}"><b>${nz(v.stueck)}</b></td>
        <td style="text-align:left;color:var(--dim)">${v.engpass ? esc(resName(v.engpass)) : "—"}</td>
        <td data-zeit="${esc(a.k)}">${v.stueck ? "covered" : esc(dauerText(v.wartenS))}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="note">“Enough for n in” assumes nobody else spends a thing — the earliest possible moment,
      not a forecast. Read it again before a big decision.</div>`;
}
function poolPanelWiring(){
  document.getElementById("pool-set")?.addEventListener("click", poolDialog);
  const feld = document.getElementById("pool-n");
  feld?.addEventListener("input", ()=>{
    const n = Math.max(1, Math.min(99, parseInt(feld.value, 10) || 1));
    const stand = poolStand();
    document.querySelectorAll("#dlg [data-zn]").forEach(el => el.textContent = n);
    document.querySelectorAll("#dlg [data-zeit]").forEach(td => {
      const z = zeitFuer(td.dataset.zeit, stand, n);
      td.textContent = !z ? "—" : z.sek <= 0 ? "covered" : dauerText(z.sek);
      td.style.color = !z || z.sek <= 0 ? "" : "var(--accent)";
      td.title = z && z.engpass ? `waiting on ${resName(z.engpass)}` : "";
    });
  });
}
/* Eighteen figures, in the order the game lists them — that order is not
   guessed: every production figure matches a row, and where two are equal the
   starting stock in the files decides. Pasting the column works too. */
function poolDialog(){
  const stand = poolStand();
  const gruppen = ["army", "armor", "air", "other"].filter(g => resListe().some(r => r.grp === g));
  openDlg(`
    <div class="dlg-h"><h2>Faction resource pool</h2>
      <p>In the game: <b>War</b>, then the resource button top right. Type the <b>stock</b>
         column in, top to bottom — production is already known.</p></div>
    <div class="dlg-b">
      <div class="row" style="align-items:center">
        <span style="font-size:12px;color:var(--dim);width:80px">Faction</span>
        <div class="own4" style="flex:1">
          ${FACTIONS.map(q => `<button data-pf="${q.id}" style="--f:${q.color}"
            aria-pressed="${(stand && stand.f != null ? stand.f : faction) === q.id}">${q.tag}</button>`).join("")}
        </div>
      </div>
      ${gruppen.map(g => `
        <div style="border-top:1px solid var(--line);padding-top:8px">
          <h3 style="font-size:9.5px;letter-spacing:.09em;color:var(--dim2);
            text-transform:uppercase;margin-bottom:6px">${esc(RES_GRP[g] || g)}</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:5px">
            ${resListe().filter(r => r.grp === g).map(r => `
              <label style="display:flex;align-items:center;gap:6px;font-size:11.5px">
                <span style="flex:1;color:var(--dim)">${esc(resName(r.k))}
                  <small style="color:var(--dim2)">+${r.pro}</small></span>
                <input type="number" min="0" step="1" data-res="${esc(r.k)}"
                  value="${stand ? stand.jetzt[r.k] : ""}" placeholder="0"
                  style="width:96px;background:var(--panel2);border:1px solid var(--line);
                    border-radius:2px;padding:4px 6px;outline:0;text-align:right">
              </label>`).join("")}
          </div>
        </div>`).join("")}
      
    </div>
    <div class="dlg-f">
      <button class="btn" id="d-close">Cancel</button>
      <button class="btn primary" id="pool-save">Save</button>
    </div>`, "xwide");
  let gewaehlt = stand && stand.f != null ? stand.f : faction;
  document.querySelectorAll("#dlg [data-pf]").forEach(b => b.addEventListener("click", () => {
    gewaehlt = +b.dataset.pf;
    document.querySelectorAll("#dlg [data-pf]").forEach(x =>
      x.setAttribute("aria-pressed", String(+x.dataset.pf === gewaehlt)));
  }));
  document.getElementById("d-close").addEventListener("click", () => { closeDlg(); clanDialog("pool"); });
  document.getElementById("pool-save").addEventListener("click", () => {
    const werte = {};
    document.querySelectorAll("#dlg [data-res]").forEach(f => {
      werte[f.dataset.res] = Math.max(0, parseInt(f.value, 10) || 0);
    });
    setPool(werte, gewaehlt);
    closeDlg(); clanDialog("pool"); toast("Faction pool saved");
  });
}

/* ---------------- arsenal: the soldiers themselves ----------------------
   One level below the war map. Who can kill a tank, who can put up flak, who
   can cross a river — none of that shows in an assault team, and all of it
   decides battles. Nobody has to lay their whole loadout open: entering only
   the one weapon that matters is already useful to the clan. */
document.getElementById("b-arms").addEventListener("click", () => arsenalDialog());
function arsenalDialog(tab){
  const nz = n => n.toLocaleString("en");
  const meine = meineSoldaten();
  /* Everybody's soldiers, so the clan view works even for members who never
     open this window themselves. */
  const alle = [];
  for (const [who, d] of depotIdx)
    for (const s of (d.arms || []))
      alle.push({...s, who, wer: d.name || who, mine: who === S.me});
  /* Anonym veroeffentlichte Soldaten zaehlen voll mit, aber alle unter einem
     einzigen Eintrag. Getrennte Zeilen waeren in einem kleinen Clan durch
     Abzaehlen aufzuloesen - und auch die eigenen bleiben unmarkiert, sonst
     verriete sie das erste Bildschirmfoto. */
  let anonLeute = 0;
  for (const k of Object.keys(S.anon || {})){
    const l = anonSoldaten(k);
    if (!l.length) continue;
    anonLeute++;
    for (const s of l)
      alle.push({...s, who: "\u0000anon", wer: "anonymous", mine: false, anon: true});
  }
  const mitglieder = () => [...proMann.keys()].filter(w => w !== "\u0000anon").length + anonLeute;
  
  const proMann = new Map();
  for (const s of alle){
    const f = faehigkeiten(s);
    const p = proMann.get(s.who) || {wer: s.wer, mine: s.mine, n: 0, koennen: new Map(), fuehrt: 0};
    p.n++; p.fuehrt += rangCP(s.rank);
    for (const k of f) p.koennen.set(k, (p.koennen.get(k) || 0) + 1);
    proMann.set(s.who, p);
  }
  const leute = [...proMann.values()].sort((a, b) => b.koennen.size - a.koennen.size || b.n - a.n);
  const zeigeFaehig = FAEHIG.filter(f => leute.some(p => p.koennen.has(f.k)));

  const chip = (name, weg, titel, attr) => `<span class="kchip" title="${esc(titel || name)}">${esc(name)}${
    weg ? `<button data-weg="${esc(weg)}" title="Remove">×</button>`
        : attr ? `<button ${attr} title="Remove">×</button>` : ""}</span>`;

  /* Eine Soldatenkarte. Klasse und Stufe entscheiden, was ueberhaupt zur
     Auswahl steht - ein Panzerfahrer bekommt gar keine Autos angeboten, weil
     das Spiel ihm keine verkauft. */
  const soldatKarte = (s, i) => {
    const f = faehigkeiten(s);
    const frak = clanFaktion();
    const fzZeile = (fz, vi) => {
      const v = VEH[fz.k];
      const moeglich = v && Array.isArray(v.upg) ? v.upg : [];
      const munition = v && Array.isArray(v.ammo) ? v.ammo : [];
      return `<div class="fzblock">
        <div class="fzkopf"><b>${esc(v ? v.name : fz.k)}</b>
          <small>${esc(v ? resName(v.res) : "")}</small>
          <button class="x" data-vweg="${vi}" title="Remove">×</button></div>
        ${moeglich.length ? `<div class="sold-z"><span class="sold-l">Fitted</span>
          <div class="kchips">${fz.u.map(k => chip(UPG[k] ? UPG[k].name : k, "", "",
              `data-uweg="${vi}:${esc(k)}"`)).join("")}
            <button class="btn" data-addu="${vi}" style="padding:1px 7px;font-size:10.5px">+</button>
          </div></div>` : ""}
        ${munition.length ? `<div class="sold-z"><span class="sold-l">Ammo</span>
          <div class="kchips">${fz.a.map(n => chip(n, "", "",
              `data-aweg="${vi}:${esc(n)}"`)).join("")}
            <button class="btn" data-adda="${vi}" style="padding:1px 7px;font-size:10.5px">+</button>
          </div></div>` : ""}
      </div>`;
    };
    return `<div class="sold" data-i="${i}">
      <div class="sold-h">
        <select data-feld="cls" style="width:126px">
          ${MAP.cls.map(c => `<option value="${esc(c.k)}"${c.k === s.cls ? " selected" : ""}>${esc(c.name)}</option>`).join("")}
        </select>
        <select data-feld="rank" style="width:86px" title="Rank">
          ${Array.from({length: RANG_MAX+1}, (_, n) => `<option value="${n}"${n === (s.rank||0) ? " selected" : ""}>rank ${n}${
            rangCP(n) ? ` · ${rangCP(n)} CP` : ""}</option>`).join("")}
        </select>
        <input type="text" data-feld="name" value="${esc(s.name || "")}"
          placeholder="name (optional)" style="flex:1;min-width:90px">
        <span style="font-size:10.5px;color:${rangCP(s.rank) ? "var(--accent)" : "var(--dim2)"};
          width:190px">${esc(rangText(s.rank))}</span>
        <button class="btn danger" data-loesch="${i}" style="padding:3px 8px">Remove</button>
      </div>
      <div class="sold-z"><span class="sold-l">Weapons</span>
        <div class="kchips">${(s.w || []).map(k => chip(ARM[k] ? ARM[k].name : k, "w:" + k,
            ARM[k] ? `${rolleName(ARM[k].role)}${ARM[k].fam ? " · " + ARM[k].fam : ""}` : "")).join("")}
          <button class="btn" data-add="w" style="padding:2px 8px;font-size:11px">+ weapon</button></div></div>
      <div class="sold-z"><span class="sold-l">Vehicles</span>
        <div class="kchips" style="flex-direction:column;align-items:stretch">
          ${(s.v || []).map(fzZeile).join("")}
          <div><button class="btn" data-add="v" style="padding:2px 8px;font-size:11px">+ vehicle</button></div>
        </div></div>
      ${f.size ? `<div class="sold-z"><span class="sold-l">Can</span>
        <div class="kchips">${[...f].map(k => {
          const d = FAEHIG.find(x => x.k === k) || {name: k, warum: ""};
          return `<span class="kchip an" title="${esc(d.warum)}">${esc(d.name)}</span>`;
        }).join("")}</div></div>` : ""}
      ${frak != null ? "" : `<div class="hint" style="font-size:10.5px">No side set for the clan —
        everything is on offer. Set it under <b>Load / Merge</b>.</div>`}
    </div>`;
  };

  openDlg(`
    <div class="dlg-h"><h2>Arsenal</h2>
      <p>${alle.length ? `<b>${alle.length}</b> soldier${alle.length === 1 ? "" : "s"} on record
         across ${mitglieder()} member${mitglieder() === 1 ? "" : "s"}${
         anonLeute ? `, ${anonLeute} of them anonymous` : ""}.`
         : "Nothing recorded yet. Enter your own soldiers and what they carry — as much or as little as you want to show."}</p></div>
    <div class="tabs">
      <button data-tab="mine" aria-pressed="true">Your soldiers</button>
      <button data-tab="clan" aria-pressed="false">What the clan can do</button>
      <button data-tab="who"  aria-pressed="false">Who has what</button>
    </div>
    <div class="dlg-b">
      <div class="tabp on" data-tab="mine">
        <div id="sold-liste" style="display:flex;flex-direction:column;gap:7px">
          ${meine.length ? meine.map(soldatKarte).join("")
            : `<div class="empty">No soldiers yet.</div>`}
        </div>
        <div class="row" style="align-items:center;gap:11px">
          <button class="btn primary" id="sold-neu">Add a soldier</button>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px">
            <input type="checkbox" id="sold-anon"${anonAn() ? " checked" : ""}>
            <span>Publish anonymously</span>
          </label>
        </div>
        <div class="note">Only you can change your own soldiers. Leave out whatever you do not
          want to show — even a single entry is worth having in here.</div>
        <div class="note" style="font-size:11px"><b>Publish anonymously</b> stores your soldiers
          without your name and without your player id, so nobody in the clan can see whose they
          are — not in the window and not in the stored data either. What it cannot hide: that
          somebody is publishing anonymously, and in a small clan that can be narrowed down by
          who else is listed. Whoever administers the database can still see it. Your assault
          teams in the depot stay under your name.</div>
      </div>

      <div class="tabp" data-tab="clan">
        ${(() => {
          /* Die eigentliche Deckenfrage: Command Points der Offiziere gegen
             das, was die Teams im Depot kosten. Mehr Teams als Punkte heisst,
             ein Teil bleibt zu Hause, egal wie viel Warfunds da sind. */
          const habenCP = leute.reduce((s, p) => s + p.fuehrt, 0);
          let brauchtCP = 0, teams = 0;
          for (const [, d] of depotIdx)
            for (const t of d.list){ teams++; brauchtCP += (AT[t.k] && AT[t.k].cp) || 1; }
          const knapp = brauchtCP > habenCP;
          return `<div class="sums">
            <div><span>Soldiers on record</span><b>${alle.length}</b></div>
            <div style="border-left-color:var(--accent)"><span>Command points</span><b>${habenCP}</b></div>
            <div style="border-left-color:${knapp ? "var(--su)" : "var(--dim2)"}">
              <span>Teams need</span><b>${brauchtCP}</b>
              <span style="text-transform:none;letter-spacing:0">${teams} team${teams===1?"":"s"} in the clan depot</span></div>
            <div><span>Below rank ${RANG_OFFIZIER}</span><b>${
              alle.filter(s => !rangCP(s.rank)).length}</b></div>
          </div>
          ${knapp ? `<div class="note" style="border-left:3px solid var(--su);padding-left:9px">
            <b>${brauchtCP - habenCP} command points short</b> for everything in the depot.</div>`
            : ""}`;
        })()}
        ${zeigeFaehig.length ? `
        <div class="lead">${zeigeFaehig.map(f => {
          const wer = leute.filter(p => p.koennen.has(f.k))
                           .sort((a, b) => b.koennen.get(f.k) - a.koennen.get(f.k));
          const ges = wer.reduce((s, p) => s + p.koennen.get(f.k), 0);
          return `<div class="card"${wer.some(p => p.mine) ? ' style="border-left-color:var(--accent)"' : ""}>
            <h4>${esc(f.name)}<span style="margin-left:auto;color:var(--accent)">${ges}</span></h4>
            <div style="font-size:9.5px;color:var(--dim2);margin:-3px 0 4px">${esc(f.warum)}</div>
            <ol>${wer.slice(0, 6).map(p => `<li><span>${esc(p.wer)}${p.mine ? " (you)" : ""}</span>
              <b>${p.koennen.get(f.k)}</b></li>`).join("")}
              ${wer.length > 6 ? `<li style="color:var(--dim2)"><span>… ${wer.length - 6} more</span><b></b></li>` : ""}</ol>
          </div>`;
        }).join("")}</div>
        <div class="tw"><table>
          <thead><tr><th>Member</th><th>Soldiers</th>
            <th title="Command points">CP</th>
            ${zeigeFaehig.map(f => `<th title="${esc(f.warum)}">${esc(f.name)}</th>`).join("")}</tr></thead>
          <tbody>${leute.map(p => `<tr${p.mine ? ' class="me"' : ""}>
            <td>${esc(p.wer)}${p.mine ? " <em>you</em>" : ""}</td><td>${p.n}</td>
            <td style="color:${p.fuehrt ? "var(--accent)" : "var(--dim2)"}"><b>${p.fuehrt || "—"}</b></td>
            ${zeigeFaehig.map(f => `<td style="color:${p.koennen.has(f.k) ? "var(--accent)" : "var(--dim2)"}">${
              p.koennen.get(f.k) || "—"}</td>`).join("")}
          </tr>`).join("")}</tbody>
        </table></div>
        <div class="note">Capabilities are read off the kit, never typed in — enter what a soldier carries and
          the labels follow.</div>
        ` : `<div class="${alle.length ? "note" : "empty"}">${alle.length
          ? "Nobody has entered a weapon or a vehicle yet — the capability overview fills up as soon as somebody does."
          : "Nobody has recorded a soldier yet."}</div>`}
      </div>

      <div class="tabp" data-tab="who">
        ${alle.length ? `<div class="tw"><table>
          <thead><tr><th>Member</th><th>Class</th><th>Rank</th><th>Soldier</th>
            <th title="Command points this soldier brings">CP</th>
            <th>Weapons</th><th>Vehicles</th></tr></thead>
          <tbody>${alle.slice().sort((a, b) => (a.wer || "").localeCompare(b.wer || "")).map(s => `
            <tr${s.mine ? ' class="me"' : ""}>
              <td>${esc(s.wer)}${s.mine ? " <em>you</em>" : ""}</td>
              <td>${esc((CLS[s.cls] || {name: s.cls || "—"}).name)}</td>
              <td>${s.rank || 0}</td>
              <td>${esc(s.name || "—")}</td>
              <td style="color:${rangCP(s.rank) ? "var(--accent)" : "var(--dim2)"}">${
                rangCP(s.rank) || "—"}</td>
              <td style="text-align:left;max-width:280px;white-space:normal">${
                (s.w || []).map(k => esc(ARM[k] ? ARM[k].name : k)).join(", ") || "—"}</td>
              <td style="text-align:left;max-width:280px;white-space:normal">${
                (s.v || []).map(f => {
                  const v = VEH[f.k];
                  const zusatz = [...f.u.map(k => UPG[k] ? UPG[k].name : k), ...f.a];
                  return esc(v ? v.name : f.k)
                    + (zusatz.length ? ` <small style="color:var(--dim2)">(${esc(zusatz.join(", "))})</small>` : "");
                }).join(", ") || "—"}</td>
            </tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty">Nothing recorded yet.</div>`}
      </div>
    </div>
    <div class="dlg-f"><button class="btn primary" id="d-close">Close</button></div>`, "xwide");
  tabsAktiv(document.getElementById("dlg"), tab);
  document.getElementById("d-close").addEventListener("click", closeDlg);

  const neuZeichnen = () => arsenalDialog(document.querySelector("#dlg .tabs button[aria-pressed=true]")?.dataset.tab);
  document.getElementById("sold-anon")?.addEventListener("change", ev => {
    anonUmschalten(ev.target.checked);
    toast(ev.target.checked ? "Published anonymously from now on"
                            : "Published under your name again");
    neuZeichnen();
  });
  document.getElementById("sold-neu")?.addEventListener("click", () => {
    setMyArms(meineSoldaten().concat([{id: Math.random().toString(36).slice(2, 9),
      cls: MAP.cls[0] ? MAP.cls[0].k : "rifleman", name: "", rank: "", w: [], v: []}]));
    arsenalDialog("mine");
  });
  document.querySelectorAll("#dlg .sold").forEach(karte => {
    const i = +karte.dataset.i;
    const aendere = (feld, wert) => {
      const l = meineSoldaten().slice();
      if (!l[i]) return;
      l[i] = {...l[i], [feld]: wert};
      setMyArms(l);
    };
    karte.querySelectorAll("[data-feld]").forEach(el => {
      el.addEventListener("change", () => {
        const feld = el.dataset.feld;
        aendere(feld, feld === "rank" ? +el.value
                    : el.tagName === "SELECT" ? el.value : el.value.trim());
        if (feld === "cls" || feld === "rank") arsenalDialog("mine");
      });
    });
    karte.querySelector("[data-loesch]")?.addEventListener("click", () => {
      const l = meineSoldaten().slice();
      l.splice(i, 1); setMyArms(l); arsenalDialog("mine");
    });
    karte.querySelectorAll("[data-weg]").forEach(b => b.addEventListener("click", () => {
      const [art, k] = b.dataset.weg.split(":");
      const l = meineSoldaten().slice();
      if (!l[i]) return;
      l[i] = {...l[i], [art]: (l[i][art] || []).filter(x => x !== k)};
      setMyArms(l); arsenalDialog("mine");
    }));
    const s = meineSoldaten()[i] || {cls:"", rank:0};
    const schreibe = fn => {
      const l = meineSoldaten().slice();
      if (!l[i]) return;
      const kopie = {...l[i], v: (l[i].v || []).map(x => ({...x, u: [...x.u], a: [...x.a]}))};
      fn(kopie);
      l[i] = kopie; setMyArms(l); arsenalDialog("mine");
    };
    karte.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      const art = b.dataset.add;
      kitWahl(b, art, {cls: s.cls}, k => schreibe(x => {
        if (art === "w"){
          if ((x.w || []).includes(k)) return toast("Already on that soldier.");
          x.w = (x.w || []).concat([k]);
        } else {
          if ((x.v || []).some(f => f.k === k)) return toast("Already on that soldier.");
          x.v = (x.v || []).concat([{k, u: [], a: []}]);
        }
      }));
    }));
    karte.querySelectorAll("[data-addu],[data-adda]").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      const istAusbau = b.hasAttribute("data-addu");
      const vi = +(istAusbau ? b.dataset.addu : b.dataset.adda);
      const fz = (s.v || [])[vi];
      if (!fz) return;
      kitWahl(b, istAusbau ? "u" : "a", {cls: s.cls, veh: fz.k}, k => schreibe(x => {
        const ziel = istAusbau ? "u" : "a";
        if (!x.v[vi] || x.v[vi][ziel].includes(k)) return toast("Already fitted.");
        x.v[vi][ziel] = x.v[vi][ziel].concat([k]);
      }));
    }));
    karte.querySelectorAll("[data-vweg]").forEach(b => b.addEventListener("click", ()=>
      schreibe(x => x.v.splice(+b.dataset.vweg, 1))));
    karte.querySelectorAll("[data-uweg],[data-aweg]").forEach(b => b.addEventListener("click", ()=>{
      const istAusbau = b.hasAttribute("data-uweg");
      const roh = istAusbau ? b.dataset.uweg : b.dataset.aweg;
      const p = roh.indexOf(":");
      const vi = +roh.slice(0, p), k = roh.slice(p+1), ziel = istAusbau ? "u" : "a";
      schreibe(x => { if (x.v[vi]) x.v[vi][ziel] = x.v[vi][ziel].filter(y => y !== k); });
    }));
  });
}
/* Auswahlfeld fuer Ausruestung. Was hier steht, ist gefiltert: Fraktion des
   Clans, Klasse und Stufe des Soldaten - dieselben drei Bedingungen, nach
   denen das Spiel selbst verkauft. Vier Betriebsarten: Waffe, Fahrzeug,
   Fahrzeugausbau, Munition. */
function kitWahl(host, art, ctx, beiWahl){
  if (pickerOffen){ pickerOffen.remove(); pickerOffen = null; }
  const p = document.createElement("div");
  p.className = "sw-liste";
  p.style.width = "360px";
  const FT = ["any", "US", "GE", "SU"];
  const frak = clanFaktion(), cls = ctx.cls;
  const bau = (q) => {
    const passt = x => !q || (x.name || x.n || "").toLowerCase().includes(q)
      || String(x.role || x.res || x.t || "").toLowerCase().includes(q)
      || String(x.fam || "").toLowerCase().includes(q);
    const zeile = (k, name, rechts, titel) =>
      `<button data-k="${esc(k)}"${titel ? ` title="${esc(titel)}"` : ""}>
        <span style="flex:1">${esc(name)}</span>
        <small style="color:var(--dim2)">${esc(rechts || "")}</small></button>`;
    let html = `<div style="padding:4px"><input id="kit-such" placeholder="search …"
      style="width:100%;background:var(--panel2);border:1px solid var(--line);
        border-radius:2px;padding:4px 6px;outline:0;font-size:11.5px"></div>`;
    let leer = true;
    if (art === "w"){
      for (const r of ROLLEN){
        const liste = MAP.arms.filter(w => w.role === r.k && passt(w)
                                        && verfuegbar(w, frak, cls));
        if (!liste.length) continue;
        leer = false;
        html += `<div class="sw-h">${esc(r.name)}</div>` + liste.map(w =>
          zeile(w.k, w.name, `${FT[w.f] || ""}${w.at ? " · AT" : ""}`,
                w.fam ? `${rolleName(w.role)} · ${w.fam}` : rolleName(w.role))).join("");
      }
    } else if (art === "v"){
      const grp = {};
      for (const v of MAP.veh)

function load(){
  try { const s = localStorage.getItem(STORE); if (s) S = Object.assign(neu(), JSON.parse(s)); } catch(e){}
  namenLaden();
}
function b64url(b){
  let s = "";
  for (let i=0;i<b.length;i+=8192) s += String.fromCharCode.apply(null, b.subarray(i, i+8192));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0));
async function pack(o){
  const st = new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream("gzip"));
  return b64url(new Uint8Array(await new Response(st).arrayBuffer()));
}
async function unpack(s){
  const st = new Blob([unb64(s)]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(st).text());
}
/* ---- Sicherheitskopie -------------------------------------------------
   Der Schluessel hng-warmap-v3 darf sich NIE aendern - er ist der Grund,
   warum ein Update der Karte keine Daten kostet. Wer ihn anfasst, faengt fuer
   alle bei null an.
   Bevor trotzdem etwas weggeworfen wird, kommt der bisherige Stand hierher.
   Er ueberlebt genau einen solchen Schritt; das reicht gegen den Fehlklick. */
const SICHER_STORE = "hng-warmap-sicherung";
function sicherungAnlegen(grund){
  try {
    localStorage.setItem(SICHER_STORE, JSON.stringify(
      {t: jetzt(), grund, s: S, namen: eigenNamen}));
  } catch(e){}
}
function sicherungStand(){
  try { const o = JSON.parse(localStorage.getItem(SICHER_STORE) || "null");
        return (o && o.s) ? o : null; } catch(e){ return null; }
}
function sicherungZurueck(){
  const o = sicherungStand();
  if (!o) return false;
  S = Object.assign(neu(), o.s, {me: S.me});
  if (o.namen){ eigenNamen = o.namen; namenSichern(); }
  return true;
}

async function saveFile(){
  /* Die Namen der eigenen Kampfeinheiten liegen nur in diesem Browser. Ohne
     sie waere die Sicherung unvollstaendig, also fahren sie mit. */
  const text = JSON.stringify({...S, _namen: eigenNamen}, null, 1);
  const host = (typeof claude !== "undefined" && claude.use) ? await claude.use("downloads") : null;
  if (host){
    try { await host.save({filename:"warmap.json", data:text}); closeDlg(); toast("Saved"); }
    catch(e){ if (!(e && e.code === "declined")) toast("Saving was not possible here."); }
    return;
  }
  const b = new Blob([text], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "warmap.json"; a.click();
  URL.revokeObjectURL(a.href); closeDlg();
}

function merge(mine, theirs){
  const out = Object.assign({me:mine.me, name:mine.name, arrows:[], gone:{}},
                            ...BUCKETS.map(b => ({[b]:{}})));
  let neuer = 0;
  for (const id of new Set([...Object.keys(mine.gone||{}), ...Object.keys(theirs.gone||{})])){
    const a = (mine.gone||{})[id], b = (theirs.gone||{})[id];
    out.gone[id] = (!a || (b && (b.t||0) > (a.t||0))) ? b : a;
  }
  for (const bucket of BUCKETS){
    const keys = new Set([...Object.keys(mine[bucket]||{}), ...Object.keys(theirs[bucket]||{})]);
    for (const k of keys){
      const a = (mine[bucket]||{})[k], b = (theirs[bucket]||{})[k];
      if (a && b){ if ((b.t||0) > (a.t||0)){ out[bucket][k] = b; neuer++; } else out[bucket][k] = a; }
      else if (b){ out[bucket][k] = b; neuer++; }
      else out[bucket][k] = a;
    }
  }
  const byId = new Map();
  for (const a of (mine.arrows||[]).concat(theirs.arrows||[])){
    const id = a.id || `${a.from}-${a.to}-${a.f}`;
    const da = byId.get(id);
    if (!da || (a.t||0) > (da.t||0)) byId.set(id, a);
  }
  out.arrows = [...byId.values()];
  return {state: out, neuer};
}

const BUILTIN = {url: "https://fomxhfmsocfzpojbxjbe.supabase.co", key: "sb_publishable_GgJLQ_S3OFlgGpKsksM9mw_2HlqfCCN"};

function syncMark(text, kind){

function applyRemote(key, val){
  const p = key.indexOf(":");
  const bucket = key.slice(0, p), id = key.slice(p+1);
  if (bucket === "gone"){
    if (!S.gone[id] || (val.t||0) > (S.gone[id].t||0)){ S.gone[id] = val; return true; }
    return false;
  }
  if (bucket === "arrow"){
    const k = S.arrows.findIndex(a => a.id === id);
    if (val.v === null){ if (k >= 0) S.arrows.splice(k,1); return k >= 0; }
    if (k < 0){ S.arrows.push(val.v); return true; }
    if ((val.v.t||0) > (S.arrows[k].t||0)){ S.arrows[k] = val.v; return true; }
    return false;
  }
  /* Every bucket, taken from the one list — a hand-kept copy here silently
     dropped areas, para-blocks, the enemy register and strength notes. */
  if (!BUCKETS.includes(bucket)) return false;
  const da = S[bucket][id];
  if (!da || (val.t||0) > (da.t||0)){ S[bucket][id] = val; return true; }
  return false;
}
async function syncPull(){
  if (!CFG || pulling) return;
  pulling = true;
  try {
    const url = api(`warmap?room=eq.${encodeURIComponent(CFG.room)}`
      + `&updated_at=gt.${encodeURIComponent(lastSeen)}`
      + `&select=key,value,updated_at&order=updated_at.asc&limit=4000`);
    const r = await fetch(url, {headers: heads()});
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const rows = await r.json();
    let n = 0;
    for (const row of rows){
      if (applyRemote(row.key, row.value)) n++;
      if (row.updated_at > lastSeen) lastSeen = row.updated_at;
    }
    if (n){ rebuildUnits(); save(); side(); tally(); draw(); kopfzeile(); boardZahl();
            kraftLeiste(); if (showDepot) depotZeichnen(); }
    syncMark(n ? `+${n}` : "Live", "ok");
  } catch(e){ syncMark("Offline", "err"); }
  finally { pulling = false; }
}
/* Was gerade unter einem Schluessel steht - zum Vergleich nach dem Senden. */
function wertVon(bucket, id){
  if (bucket === "gone") return S.gone[id];
  if (bucket === "arrow"){
    const a = S.arrows.find(x => x.id === id);
    return a ? {v: a, t: a.t, by: a.by} : null;
  }
  return S[bucket] && S[bucket][id];
}
async function syncPush(){
  if (!CFG || !dirty.size) return;
  const rows = [], merk = [];
  for (const k of [...dirty]){
    const p = k.indexOf(":");
    const bucket = k.slice(0, p), id = k.slice(p+1);
    const val = wertVon(bucket, id);
    if (!val){ dirty.delete(k); continue; }
    /* Fremde Zeilen kommen bei jedem Abgleich herein und liegen danach im
       eigenen Speicher. Zurueckschicken darf man sie nicht: die Datenbank
       weist sie ab, und eine abgewiesene Zeile riss vorher den ganzen Stapel
       mit - die Synchronisation stand dann dauerhaft. */
    const autor = autorVon(bucket, id);
    if (autor && autor !== S.me){ dirty.delete(k); continue; }
    /* Die Datenbank begrenzt eine Zeile auf 20 KB, gemessen in Bytes - nicht
       in JavaScript-Zeichen, wo ein Umlaut fuer eins zaehlt und zwei belegt. */
    if (byteLaenge(JSON.stringify(val)) > 18000){
      dirty.delete(k);
      toast(`"${bucket}" is too large to sync and was left out.`);
      continue;
    }
    rows.push({room: CFG.room, key: k, value: val});
    merk.push([k, bucket, id, val.t || 0]);
  }
  if (!rows.length) return;
  /* Nur abhaken, was seit dem Absenden unveraendert ist - sonst faellt eine
     Aenderung aus der Warteschlange, die waehrend des Sendens entstanden ist. */
  const abhaken = i => {
    const [k, bucket, id, t] = merk[i];
    const jetztWert = wertVon(bucket, id);
    if (!jetztWert || (jetztWert.t || 0) === t) dirty.delete(k);
  };
  const senden = async teil => {
    const r = await fetch(api("warmap"), {
      method: "POST",
      headers: heads({"Prefer": "resolution=merge-duplicates,return=minimal"}),
      body: JSON.stringify(teil)
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  };
  try {
    await senden(rows);
    rows.forEach((_, i) => abhaken(i));
    syncMark("Live", "ok");
  } catch(e){
    /* Der Stapel ist gescheitert. Das kann die Leitung sein - dann bleibt
       alles in der Warteschlange und der naechste Versuch holt es nach - oder
       eine einzelne Zeile, die die Datenbank nicht will. Um die eine nicht
       alles andere blockieren zu lassen: einzeln nachfassen. */
    let weg = 0, durch = 0;
    for (let i = 0; i < rows.length; i++){
      try { await senden([rows[i]]); abhaken(i); durch++; }
      catch(e2){ dirty.delete(merk[i][0]); weg++; }
    }
    if (weg){
      syncMark(`${weg} refused`, "err");
      toast(`${weg} entr${weg === 1 ? "y was" : "ies were"} refused by the database and dropped.`);
    } else syncMark(durch ? "Live" : "Offline", durch ? "ok" : "err");
  }
}
async function syncStart(){
  if (syncTimer) clearInterval(syncTimer);
  if (!CFG){ syncMark("Sync off", "off"); return; }
  syncMark("Connecting", "wait");
  let ich;
  try {
    const r = await fetch(api("rpc/warmap_whoami"), {method:"POST", headers: heads(), body:"{}"});
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    ich = (await r.json())[0];
  } catch(e){
    syncMark("Failed", "err");
    dialogFehler("Could not reach the server", String(e.message || e));
    CFG = null; localStorage.removeItem(CFG_KEY); return;
  }
  if (!ich){
    syncMark("Rejected", "err");
    dialogFehler("That code was not accepted",
      "Either it is mistyped or it has not been approved. Ask whoever runs the map.");
    CFG = null; localStorage.removeItem(CFG_KEY); return;
  }
  CFG.room = ich.room; CFG.admin = !!ich.is_admin; CFG.name = ich.name;
  CFG.player = ich.player;
  mitgliederKnopf();
  localStorage.setItem(CFG_KEY, JSON.stringify(CFG));

  /* Die anonyme Kennung wechselt beim Verbinden von der Zufallskennung
     dieses Browsers auf die aus dem Code abgeleitete - sonst stuende der
     Eintrag nach dem Anmelden verwaist im Raum. */
  S.anon ||= {};
  const anonAlt = anonLokal(), anonNeu = anonAusCode(CFG.code);
  if (anonAlt !== anonNeu && S.anon[anonAlt] && S.anon[anonAlt].v){
    S.anon[anonNeu] = {v: S.anon[anonAlt].v, t: jetzt()};
    S.anon[anonAlt] = {v: null, t: jetzt()};
    dirty.add(`anon:${anonNeu}`); dirty.add(`anon:${anonAlt}`);
  }

  /* Die Kennung bestimmt der Server. Was vorher ohne Anmeldung entstanden
     ist, muss umgeschluesselt werden - und zwar in JEDEM Topf, der seinen
     Verfasser im Schluessel traegt. Vorher waren nur units, depot und join
     dabei: eine Verteidigungslinie, eine Flaeche, ein Brettbeitrag oder eine
     Sichtung behielt die alte Kennung, verlor damit ihre Griffe und wurde von
     der Datenbank abgewiesen. */
  if (S.me !== ich.player){
    const alt = S.me, neuId = ich.player;
    for (const b of BUCKETS){
      const n = AUTOR_TEIL[b];
      if (!n) continue;
      for (const id of Object.keys(S[b])){
        const t = String(id).split(":");
        if (t[n-1] !== alt) continue;
        t[n-1] = neuId;
        S[b][t.join(":")] = S[b][id];
        delete S[b][id];
      }
    }
    for (const b of BUCKETS)                     // Verfasservermerk mitziehen
      for (const e of Object.values(S[b])) if (e && e.by === alt) e.by = neuId;
    for (const a of S.arrows) if (a.by === alt) a.by = neuId;
    for (const id of Object.keys(S.gone))
      if (S.gone[id] && S.gone[id].by === alt) S.gone[id].by = neuId;
    S.me = neuId;
  }
  S.name = ich.name || S.name;
  rebuildUnits(); save();

  /* Beim Verbinden alles Eigene einmal hochschieben - aber nur das Eigene.
     Fremde Zeilen liegen nach jedem Abgleich mit im Speicher; sie mitzusenden
     hiess, dass die Datenbank sie abweist und der Stapel nie durchgeht. */
  for (const b of BUCKETS)
    for (const id of Object.keys(S[b])){
      const autor = autorVon(b, id);
      if (autor && autor !== S.me) continue;
      dirty.add(`${b}:${id}`);
    }
  for (const a of S.arrows) dirty.add(`arrow:${a.id}`);
  for (const id of Object.keys(S.gone)) dirty.add(`gone:${id}`);
  syncTimer = setInterval(async ()=>{ await syncPush(); await syncPull(); }, 3500);
  await syncPull(); await syncPush();
  toast(`Connected as ${ich.name || ich.player}`);
}
function syncStop(){
  if (syncTimer) clearInterval(syncTimer);
  syncTimer = null; CFG = null;
  localStorage.removeItem(CFG_KEY);
  syncMark("Sync off", "off"); mitgliederKnopf();
}

/* Ein Aufruf einer Datenbankfunktion. PostgREST verpackt Fehler als JSON mit
   "message" - das ist die Meldung, die der Verwalter sehen soll. */
async function rpc(name, args){
  if (!CFG) throw new Error("Not connected");
  const r = await fetch(api("rpc/" + name), {
    method: "POST", headers: heads(), body: JSON.stringify(args || {})
  });
  const text = await r.text();
  if (!r.ok){
    let m = text;
    try { m = JSON.parse(text).message || text; } catch(e){}
    throw new Error(m || `${r.status}`);
  }
  return text ? JSON.parse(text) : null;
}

/* ---------------- start ---------------- */
(async function(){
  /* Zuerst der eigene Stand - allein wegen der Kennung. Ein geteilter Link
     bringt den Stand des Absenders mit, aber niemals dessen Identitaet: sonst
     wuerden beim naechsten Verbinden dessen Teams auf den Leser umgebucht. */
  load();
  const meineKennung = S.me;
  const m = location.hash.match(/#m=([A-Za-z0-9_-]+)/);
  if (m){
    try { S = Object.assign(neu(), await unpack(m[1]), {me: meineKennung || ""}); }
    catch(e){ load(); }
  }
  for (const b of BUCKETS) S[b] ||= {};
  S.arrows ||= []; S.gone ||= {};
  if (!S.me) S.me = Math.random().toString(36).slice(2,8);
  for (const a of S.arrows){
    if (!a.id) a.id = Math.random().toString(36).slice(2,10);
    delete a._pfad;         // Altlast aus fruehen Staenden, siehe pfadVon
  }
  /* Der Vorschlag aus der Fenstergroesse wurde bisher berechnet und dann
     nie angewandt - auf einem 4K-Schirm blieb alles auf 100 Prozent stehen,
     obwohl 175 herausgekommen waren. */
  uiSetzen(uiScale); textSetzen(textScale);
  /* Einmaliger Umzug der Kampfeinheiten-Namen aus der geteilten Zeile in
     diesen Browser. Muss vor der ersten Anzeige laufen. */
