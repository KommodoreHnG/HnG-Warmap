<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>War Map — Heroes &amp; Generals</title>
<style>
:root{
  --ground:#100d0a; --panel:#1c1712; --panel2:#262019; --line:#3a3227;
  --text:#e9e2d5; --dim:#a2957f; --dim2:#6f6555;
  --accent:#e2ac48; --accent-dk:#8a6820;
  --us:#3fbf5a; --ge:#7f74dd; --su:#e03b32; --none:#7a705f;
  --r:2px;
  --schrift:"Bahnschrift SemiCondensed","Bahnschrift","Segoe UI Variable Text",
            "Arial Narrow","Segoe UI",system-ui,sans-serif;
  --schmal:"Bahnschrift Condensed","Bahnschrift","Arial Narrow","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --ground:#ded7c9; --panel:#f0ebe0; --panel2:#e5ded0; --line:#c2b8a4;
  --text:#221c14; --dim:#5f5647; --dim2:#8a806e;
  --accent:#8a6314; --accent-dk:#d9a441;
  --us:#1f8c38; --ge:#4a3fae; --su:#b8241c; --none:#7b7565;
}
/* Zwei Regler. Der erste vergroessert die ganze Oberfläche - die Karte selbst
   bleibt aussen vor, sie skaliert ueber devicePixelRatio und wuerde nur
   unscharf. Der zweite legt sich nur auf die Textflaechen und multipliziert
   sich mit dem ersten: wer eine grosse Leiste, aber noch groessere Schrift
   will, bekommt beides.
   Wichtig: #rechts, nicht #side - die Depotliste haengt in der Spalte, nicht
   im Stadtfenster, und blieb sonst klein, egal was eingestellt war. */
#top,#bar,#rechts,.float,#hits,.dlg,#ghost,#toast{zoom:var(--ui,1)}
#depot h4,#depot-filter,#depot-list,#depot-foot,#side,.dlg-h,.dlg-b,#hover,#tip{
  zoom:var(--ui-text,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--ground);color:var(--text);font-family:var(--schrift);
  font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
/* The game titles everything in spaced capitals — so does this. */
.bar-h,.tile .k,.chip,.sec h3,.dlg-h h2,#brand b,.tw th,.sums span,#legend h4,#depot h4{
  font-family:var(--schmal);text-transform:uppercase;letter-spacing:.09em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-rows:auto 1fr;height:100%}
#top{display:flex;align-items:center;gap:14px;padding:7px 14px;flex-wrap:wrap;
  background:linear-gradient(180deg,#241d16 0%,#181310 100%);
  border-bottom:2px solid var(--accent-dk);box-shadow:0 2px 10px rgba(0,0,0,.5)}
#brand{display:flex;flex-direction:column;gap:1px;min-width:0}
#brand b{font-size:19px;font-weight:600;white-space:nowrap;color:var(--accent)}
#brand span{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:1px}
#tally{display:flex;gap:6px}
.tile{display:flex;flex-direction:column;gap:0;padding:3px 11px 3px 9px;border-left:3px solid var(--f);
  background:rgba(0,0,0,.28);min-width:78px}
.tile .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.85px;color:var(--dim)}
.tile .v{font-size:20px;font-weight:600;line-height:1.05;color:var(--f);
  font-variant-numeric:tabular-nums;font-family:var(--schmal)}
.tile .u{font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
#me-tile{display:none;flex-direction:column;gap:0;padding:3px 11px 3px 9px;
  border-left:3px solid var(--accent);background:rgba(226,172,72,.10);min-width:96px;cursor:pointer}
#me-tile .k{font-family:var(--schmal);text-transform:uppercase;letter-spacing:.85px;
  font-size:9.5px;color:var(--dim)}
#me-tile .v{font-size:15px;font-weight:600;line-height:1.15;color:var(--accent);
  font-family:var(--schmal);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me-tile .u{font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
#forces{display:none;grid-template-columns:repeat(3,auto);gap:0 12px;padding:2px 10px;
  max-height:56px;overflow-y:auto;cursor:pointer;
  background:rgba(0,0,0,.28);border-left:3px solid var(--accent-dk)}
#forces:hover,#me-tile:hover{background:rgba(226,172,72,.16)}
#forces .fz{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.25}
#forces .fz .fn{color:var(--dim);font-size:10px;max-width:96px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#forces .fz b{font-family:var(--schmal);font-variant-numeric:tabular-nums;font-weight:600;
  min-width:32px;text-align:right}
#forces .fz i{font-style:normal;font-size:9px;color:var(--accent);
  font-variant-numeric:tabular-nums}
#forces .fz i::before{content:"+"}
@media (max-width:1500px){#forces{grid-template-columns:repeat(2,auto)}}
/* Die Navigation im Spiel ist gross und gesperrt gesetzt - hier genauso,
   damit die Leiste nicht wie eine Werkzeugzeile wirkt. */
#top-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#top-right .btn{font-family:var(--schmal);text-transform:uppercase;letter-spacing:.07em;
  font-size:13px;padding:7px 13px}
#top-right .btn.primary{letter-spacing:.09em}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 11px;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--accent-dk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#e8b856,#c8912f);color:#1a1204;
  border-color:#f0c470;font-weight:600;text-shadow:0 1px 0 rgba(255,235,190,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--su);border-color:var(--su)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#b-sync{display:flex;align-items:center;gap:6px}
#b-sync .dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex:0 0 auto}
#b-sync[data-state="ok"] .dot{background:var(--us)}
#b-sync[data-state="err"] .dot{background:var(--su)}
#b-sync[data-state="wait"] .dot{background:var(--accent)}
.btn:focus-visible,.tool:focus-visible,.fac:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#main{display:grid;grid-template-columns:auto 1fr auto;min-height:0}
#bar{background:linear-gradient(180deg,#1e1913 0%,#151109 100%);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:8px 6px;width:96px;overflow-y:auto}
.bar-h{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2);padding:8px 3px 3px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;
  border:1px solid transparent;border-radius:var(--r);padding:7px 3px 6px;cursor:pointer;text-align:center}
.tool:hover{background:var(--panel2)}
.tool[aria-pressed="true"]{background:linear-gradient(180deg,#3a2f1c,#2a2114);
  border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 12px rgba(226,172,72,.14)}
.tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tool .lbl{font-size:9.5px;line-height:1.15}
.tool .kb{font-size:8.5px;color:var(--dim2);font-family:ui-monospace,Consolas,monospace}
.tool.row{flex-direction:row;gap:6px;justify-content:flex-start;padding-left:7px}
.tool.row svg{width:15px;height:15px}
.fac{display:flex;align-items:center;gap:7px;padding:5px 7px;cursor:pointer;background:transparent;
  border:1px solid transparent;border-radius:var(--r);width:100%}
.fac:hover{background:var(--panel2)}
.fac[aria-pressed="true"]{background:var(--panel2);border-color:var(--f)}
.fac .dot{width:11px;height:11px;border-radius:50%;background:var(--f);flex:0 0 auto}
.fac .lbl{font-size:10.5px}

#mapwrap{position:relative;min-width:0;background:#0b0805;overflow:hidden}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
#cv.grabbing{cursor:grabbing}
#cv.dropping{cursor:copy}
#cv.griff{cursor:move}
.float{position:absolute;background:rgba(22,18,13,.94);border:1px solid var(--line);
  border-radius:var(--r);backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(0,0,0,.5)}
:root[data-theme="light"] .float{background:rgba(240,235,224,.95)}
#searchbox{top:10px;left:10px;display:flex;gap:5px;align-items:center;padding:4px 6px}
#search{background:transparent;border:0;outline:0;width:170px;font-size:12px}
#search::placeholder{color:var(--dim2)}
#hits{position:absolute;top:38px;left:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);max-height:250px;overflow-y:auto;min-width:214px;display:none;z-index:6;
  box-shadow:0 8px 22px rgba(0,0,0,.45)}
#hits div{padding:5px 9px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:10px}
#hits div:hover{background:var(--panel2)}
#hits .t{color:var(--dim2);font-size:10px}
#zoombox{bottom:10px;left:10px;display:flex;gap:3px;padding:3px}
#zoombox button{background:transparent;border:0;width:26px;height:24px;cursor:pointer;color:var(--text);
  border-radius:3px;font-size:14px;line-height:1}
#zoombox button:hover{background:var(--panel2)}
#tip{bottom:10px;right:10px;padding:5px 9px;font-size:10.5px;color:var(--dim);max-width:340px}
#tip b{color:var(--text);font-weight:600}
#legend{top:10px;right:10px;padding:8px 10px;font-size:10.5px;color:var(--dim);display:none;max-width:196px}
#legend.on{display:block}
#legend h4{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2);margin-bottom:5px}
#legend div{display:flex;align-items:center;gap:7px;padding:1.5px 0}
#legend svg{width:22px;height:15px;flex:0 0 auto}

/* ---------- depot ---------- */
#rechts{display:flex;flex-direction:column;width:308px;min-height:0;
  background:linear-gradient(180deg,#1e1913,#171208);border-left:1px solid var(--line)}
#rechts.schmal{width:0;overflow:hidden;border-left:0}
#side{width:100%;border-left:0;flex:0 1 auto;max-height:58%}
#depot{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;
  border-top:1px solid var(--accent-dk)}
#depot.zu{display:none}
#depot-filter{display:flex;gap:3px;padding:0 8px 6px}
#depot-filter button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:2px;
  padding:4px 2px;font-size:11px;cursor:pointer;color:var(--dim);font-family:var(--schmal);
  text-transform:uppercase;letter-spacing:.06em}
#depot-filter button[aria-pressed="true"]{background:var(--accent);color:#1a1204;border-color:var(--accent)}
#depot h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2);
  padding:8px 10px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#depot h4 em{font-style:normal;color:var(--dim);text-transform:none;letter-spacing:0;font-size:10px}
#depot-list{overflow-y:auto;padding:0 7px 7px;display:flex;flex-direction:column;gap:3px}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:4px 6px;
  background:var(--panel2);border-radius:var(--r);border-left:3px solid var(--f);cursor:grab;
  user-select:none;touch-action:none}
.dep:active{cursor:grabbing}
.dep.leer{opacity:.4;cursor:default;border-left-color:var(--dim2)}
.dep .n{font-size:12px;overflow:hidden;min-width:0}
.dep .n em{display:block;font-style:normal;font-size:10px;color:var(--dim2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep .zeile2{display:flex;gap:4px;align-items:baseline}
.dep .ttag{width:52px;flex:0 0 auto;background:transparent;border:0;border-bottom:1px dotted transparent;
  padding:0;outline:0;font-size:9.5px;color:var(--accent);font-family:var(--schmal);
  text-transform:uppercase;letter-spacing:.06em;text-align:right}
.dep .ttag:hover{border-bottom-color:var(--dim2)}
.dep .ttag:focus{border-bottom-color:var(--accent)}
.dep .ttag::placeholder{color:var(--dim2)}
.dep .tname{width:100%;background:transparent;border:0;border-bottom:1px dotted transparent;
  padding:0;outline:0;font-size:11.5px;color:var(--text);font-family:var(--schrift)}
.dep .tname:hover{border-bottom-color:var(--dim2)}
.dep .tname:focus{border-bottom-color:var(--accent)}
.dep .tname::placeholder{color:var(--dim2);font-style:italic}
.dep .c{font-size:9.5px;font-family:var(--schmal);text-transform:uppercase;letter-spacing:.08em;color:var(--dim2)}
.dep.raus{border-left-color:var(--accent);background:rgba(226,172,72,.09)}
.dep .pull{background:transparent;border:0;cursor:pointer;color:var(--dim2);font-size:15px;padding:0 3px}
.dep .pull:hover{color:var(--su)}
.sympick{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:1;min-width:0;
  background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:3px 6px;cursor:pointer}
.sympick:hover{border-color:var(--accent-dk)}
.sympick .sw-cur{display:flex;align-items:center;gap:6px;min-width:0;font-size:11.5px}
.sympick .sw-cur span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sympick .sw-pfeil{color:var(--dim2);font-size:10px}
.sw-liste{position:absolute;z-index:80;background:var(--panel);border:1px solid var(--accent-dk);
  border-radius:2px;max-height:320px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.6);
  padding:3px;zoom:var(--ui,1)}
.sw-liste .sw-h{font-family:var(--schmal);font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--dim2);padding:5px 6px 2px}
.sw-liste button{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:0;
  padding:3px 6px;cursor:pointer;color:var(--text);font-size:11.5px;text-align:left;border-radius:2px}
.sw-liste button:hover{background:var(--panel2)}
.sw-liste button.an{background:rgba(226,172,72,.16);color:var(--accent)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:5px}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel2);
  border:1px solid var(--line);border-radius:2px;padding:7px 4px;cursor:pointer;color:var(--text)}
.pick:hover{border-color:var(--accent);background:rgba(226,172,72,.1)}
.pick span{font-size:10.5px;text-align:center;line-height:1.15}
.pick em{font-style:normal;font-size:9px;color:var(--dim2)}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:1px 3px;
  font-size:10.5px;outline:0;color:var(--text)}
.para-row{display:flex;align-items:center;gap:8px}
.para-lbl{font-size:9.5px;font-family:var(--schmal);text-transform:uppercase;letter-spacing:.09em;
  color:var(--dim2);width:66px;flex:0 0 auto}
.wer{font-size:9.5px;color:var(--dim2);margin-top:4px;font-family:var(--schmal);letter-spacing:.04em}
#depot-foot{padding:6px 8px;border-top:1px solid var(--line);display:flex;gap:5px;align-items:center}
#depot-foot select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:4px 5px;outline:0;font-size:11px;min-width:0}
#depot-foot input{width:44px;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r);padding:4px 5px;outline:0;font-size:11px}
/* Beim Ziehen haengt die Einheit am Zeiger, wie im Spiel - mittig, nicht
   daneben, und leicht durchscheinend, damit die Stadt darunter sichtbar
   bleibt. */
#ghost{position:fixed;pointer-events:none;z-index:70;display:none;background:var(--panel);
  border:1px solid var(--accent);border-radius:var(--r);padding:4px 9px;font-size:11px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);transform:translate(-50%,-50%);opacity:.92;
  display:none;align-items:center;gap:7px;white-space:nowrap}
#ghost.an{display:flex}
#ghost svg{display:block}
#hover{position:fixed;pointer-events:none;z-index:68;display:none;max-width:290px;
  background:rgba(20,16,11,.96);border:1px solid var(--accent-dk);border-radius:2px;
  padding:7px 10px;box-shadow:0 8px 24px rgba(0,0,0,.6);zoom:var(--ui,1)}
#hover .h-name{font-family:var(--schmal);font-size:14px;font-weight:600;color:var(--accent);
  letter-spacing:.04em}
#hover .h-sub{font-size:10.5px;color:var(--dim);margin-bottom:3px}
#hover .h-tags{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
#hover .h-row{font-size:11.5px;margin-top:3px;border-top:1px solid rgba(160,140,110,.16);padding-top:3px}
#hover .h-row em{font-style:normal;color:var(--dim2);font-size:10px;display:block}
#hover .h-warn{color:#ffc9a0}
#hover .h-note{color:var(--dim);font-style:italic}
#hover .h-hint{font-size:9px;color:var(--dim2);margin-top:5px;text-transform:uppercase;letter-spacing:.1em}

/* ---------- side ---------- */
#side{width:304px;background:linear-gradient(180deg,#1e1913,#171208);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto}
#side.hidden{display:none}
.s-head{padding:11px 13px 9px;border-bottom:1px solid var(--line)}
.s-head h2{font-size:15px;font-weight:600;text-wrap:balance}
.s-head .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.chip{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;padding:2px 7px;
  border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.own{border-color:var(--f);color:var(--f)}
.chip.fight{border-color:var(--accent);color:var(--accent)}
.sec{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2);font-weight:600;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h3 .sub{text-transform:none;letter-spacing:0;color:var(--dim2);font-weight:400;font-size:10px}
.own4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.own4 button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 2px;cursor:pointer;font-size:10px;color:var(--dim)}
.own4 button[aria-pressed="true"]{background:var(--f);border-color:var(--f);color:#0d1116;font-weight:600}
:root[data-theme="light"] .own4 button[aria-pressed="true"]{color:#fff}
.unit{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;
  background:var(--panel2);border-radius:var(--r);padding:5px 7px;border-left:3px solid var(--f)}
.unit .sym{width:26px;height:18px;flex:0 0 auto}
.unit .n{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .n em{display:block;font-style:normal;font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.unit .x{background:transparent;border:0;cursor:pointer;color:var(--dim2);padding:0 2px;font-size:14px}
.unit .x:hover{color:var(--su)}
.unit .lock{font-size:9px;opacity:.5}
.grp{display:flex;flex-direction:column;gap:4px}
.grp+.grp{margin-top:7px}
.grp-h{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--dim2);
  padding-bottom:1px;border-bottom:1px solid rgba(128,140,160,.14)}
.grp-h span{font-variant-numeric:tabular-nums}
.grp-h .stale{opacity:.55;font-style:italic}
.tw tbody tr[data-go]:hover{background:rgba(217,164,65,.1)}
.row{display:flex;gap:5px}
.row select,.row input{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:5px 6px;outline:0;min-width:0}
.row select{flex:1}
.row input[type=number]{width:56px}
textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 7px;outline:0;resize:vertical;min-height:52px;width:100%;font-size:12px}
.empty{color:var(--dim2);font-size:11.5px;font-style:italic}
.hint{font-size:10.5px;color:var(--dim2);line-height:1.5;font-variant-numeric:tabular-nums}
.hint b{color:var(--accent);font-weight:600}
.nb{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:11.5px;
  cursor:pointer;border-bottom:1px solid rgba(128,140,160,.09)}
.nb:hover{color:var(--accent)}
.nb .l{display:flex;align-items:center;gap:6px;min-width:0}
.nb .b{width:8px;height:8px;border-radius:50%;background:var(--f);flex:0 0 auto}
.nb .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:11.5px}
.toggle input{width:15px;height:15px;accent-color:var(--accent)}

/* ---------- dialogs ---------- */
#veil{position:fixed;inset:0;background:rgba(4,7,11,.72);display:none;align-items:center;
  justify-content:center;z-index:50;padding:20px}
#veil.on{display:flex}
.dlg{background:linear-gradient(180deg,#211b14,#181309);border:1px solid var(--accent-dk);
  border-radius:3px;max-width:620px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dlg.wide{max-width:860px}
.dlg.xwide{max-width:1120px}
.dlg.dropbereit{outline:2px dashed var(--accent);outline-offset:-6px}
.dlg.dropbereit .dlg-b{background:rgba(226,172,72,.06)}
/* Tabs — the two big windows carry several views each, and a row of tabs
   keeps them apart without hiding anything behind a menu. */
.tabs{display:flex;gap:3px;padding:0 16px;border-bottom:1px solid var(--accent-dk);
  background:linear-gradient(180deg,#231c15,transparent);flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;border-bottom:0;
  border-radius:2px 2px 0 0;padding:6px 12px 5px;cursor:pointer;color:var(--dim);
  font-family:var(--schmal);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;
  margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-dk);
  background:var(--panel);border-bottom:1px solid var(--panel)}
.tabp{display:none}
.tabp.on{display:flex;flex-direction:column;gap:11px}
/* Faction badge — the insignia the game itself uses, so a clan row is
   readable at a glance instead of by tag alone. */
.fbadge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px 1px 3px;border-radius:999px;
  border:1px solid var(--f);background:color-mix(in srgb,var(--f) 16%,transparent);color:var(--f);
  font-family:var(--schmal);text-transform:uppercase;letter-spacing:.08em;font-size:9.5px}
.fbadge svg{width:15px;height:15px;flex:0 0 auto}
/* Die Clanzeile bekommt die Farbe ihrer Seite — kraeftig am Rand, nur
   angedeutet in der Flaeche, damit die Tabelle lesbar bleibt. */
tr.fac-row td{background:color-mix(in srgb,var(--f) 7%,transparent)}
tr.fac-row td:first-child{border-left:3px solid var(--f)}
tr.fac-row:hover td{background:color-mix(in srgb,var(--f) 14%,transparent)}
/* Stacked share bar — who contributed how much of one unit type */
.share{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--panel2);min-width:110px}
.share i{display:block;height:100%}
.lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:7px}
.lead .card{background:var(--panel2);border-radius:var(--r);padding:8px 10px;border-left:3px solid var(--accent-dk)}
.lead .card h4{font-family:var(--schmal);text-transform:uppercase;letter-spacing:.09em;
  font-size:9.5px;color:var(--dim2);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.lead .card ol{list-style:none;display:flex;flex-direction:column;gap:2px}
.lead .card li{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;
  font-variant-numeric:tabular-nums}
.lead .card li:first-child{color:var(--accent);font-weight:600}
.lead .card li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Soldatenkarte im Arsenal */
.sold{background:var(--panel2);border-radius:var(--r);padding:7px 9px;
  border-left:3px solid var(--accent-dk);display:flex;flex-direction:column;gap:5px}
.sold-h{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sold-h select,.sold-h input{background:var(--panel);border:1px solid var(--line);
  border-radius:2px;padding:4px 6px;outline:0;font-size:11.5px;min-width:0}
.sold-z{display:flex;gap:7px;align-items:flex-start}
.sold-l{font-family:var(--schmal);text-transform:uppercase;letter-spacing:.09em;
  font-size:9px;color:var(--dim2);width:60px;flex:0 0 auto;padding-top:4px}
.kchips{display:flex;gap:4px;flex-wrap:wrap;flex:1;align-items:center}
.kchip{display:inline-flex;align-items:center;gap:3px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 8px;font-size:11px}
.kchip button{background:transparent;border:0;cursor:pointer;color:var(--dim2);
  font-size:13px;line-height:1;padding:0 3px}
.kchip button:hover{color:var(--su)}
.kchip.an{border-color:var(--accent);color:var(--accent);padding-right:8px}
.fzblock{background:var(--panel);border:1px solid var(--line);border-radius:2px;
  padding:4px 7px;display:flex;flex-direction:column;gap:3px}
.fzkopf{display:flex;align-items:baseline;gap:7px;font-size:11.5px}
.fzkopf small{color:var(--dim2);font-size:9.5px;flex:1}
.fzkopf .x{background:transparent;border:0;cursor:pointer;color:var(--dim2);font-size:14px;padding:0 3px}
.fzkopf .x:hover{color:var(--su)}
.fzblock .sold-l{width:48px;padding-top:2px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--dim)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dlg-h{padding:13px 16px 10px;border-bottom:1px solid var(--accent-dk);
  background:linear-gradient(180deg,#2a221a,transparent)}
.dlg-h h2{font-size:16px;font-weight:600;color:var(--accent)}
.dlg-h p{font-size:12px;color:var(--dim);margin-top:3px}
.dlg-b{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.dlg-f{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
#linkout{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:8px;font-size:11px;word-break:break-all;max-height:110px;overflow-y:auto;
  font-family:ui-monospace,Consolas,monospace;color:var(--dim)}
.keys{display:flex;flex-direction:column;gap:7px;font-size:12px}
.keys div{display:grid;grid-template-columns:104px 1fr;gap:10px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;
  padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--text)}
.note{font-size:12px;color:var(--dim);line-height:1.55}.note>div+div{margin-top:7px}
.note b{color:var(--text)}
.symgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 12px;font-size:11px}
.symgrid div{display:flex;align-items:center;gap:7px}
.symgrid svg{width:26px;height:18px;flex:0 0 auto}
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.sums div{background:var(--panel2);border-radius:var(--r);padding:6px 9px;display:flex;
  flex-direction:column;gap:1px;border-left:3px solid var(--accent)}
.sums span{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim2)}
.sums b{font-size:15px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tw table{border-collapse:collapse;width:100%;font-size:11.5px}
.tw th{background:var(--panel2);text-align:right;padding:5px 8px;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.7px;color:var(--dim2);font-weight:600;white-space:nowrap;position:sticky;top:0}
.tw th:first-child,.tw th[colspan]{text-align:left}
.tw td{padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums;
  border-top:1px solid var(--line);white-space:nowrap}
.tw td:first-child{text-align:left}
.tw td.sy{padding:2px 0 2px 6px;width:30px}
.tw td.sy+td{text-align:left}
.tw tr.me{background:rgba(217,164,65,.09)}
.tw tr.me em{font-style:normal;color:var(--accent);font-size:9.5px}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;background:var(--accent)}
#shot-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:#0a0d12;max-height:46vh;display:flex;align-items:center;justify-content:center}
#shot-wrap canvas{max-width:100%;max-height:46vh;display:block}
#shot-status{font-size:12px;color:var(--dim)}
#shot-status b{color:var(--text)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--accent);color:#14100a;padding:8px 16px;border-radius:var(--r);font-weight:600;
  font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Auf einem 4K-Schirm soll die Navigation gross sein wie im Spiel. Auf einem
   schmalen Fenster wuerden neun gesperrt gesetzte Knoepfe dreifach umbrechen
   und ein Drittel der Hoehe fressen - dort also enger setzen. */
@media (max-width:1700px){
  #top-right .btn{font-size:11.5px;padding:5px 9px;letter-spacing:.04em}
}
@media (max-width:1250px){
  #top-right .btn{font-size:11px;padding:4px 7px;letter-spacing:.02em}
  #brand b{font-size:16px}
}
@media (max-width:980px){
  #side{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.4)}
  #bar{width:76px} #tally{display:none}
}
</style></head><body>

<div id="app">
  <header id="top">
    <div id="brand"><b id="clan-name">War Map</b><span id="war-label">Heroes &amp; Generals</span></div>

      <button class="btn" id="b-arms">Arsenal</button>
      <button class="btn" id="b-board">Board</button>

      <button class="btn" id="b-help">Help</button>
      <button class="btn" id="b-load">Load / Merge</button>
      <button class="btn primary" id="b-share">Share</button>
    </div>
  </header>

  <div id="main">
    <nav id="bar" aria-label="Tools">

      <button class="tool" data-t="inspect" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M6 3.6v13.1l3.3-3.2 2.1 4.7 2.3-1-2.1-4.6h4.5z"/></svg>
        <span class="lbl">Inspect</span><span class="kb">1</span></button>
      <button class="tool" data-t="owner" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M6 20.5V3.5"/><path d="M6 4.5h11.6l-3.5 3.6 3.5 3.6H6z"/></svg>

      <button class="tool row" id="b-text" title="Text size — on top of the interface size">
        <svg viewBox="0 0 24 24"><path d="M3.4 16.4l3.1-7.8 3.1 7.8M4.5 13.6h4"/><path d="M12.6 19.4l4.4-12.8 4.4 12.8M14.3 14.9h6.2"/></svg>
        <span class="lbl" id="text-lbl">100 %</span></button>
    </nav>

    <div id="mapwrap">

    <div id="rechts">

    </div>
  </div>
</div>

/* Taktikzeichen der Assault Teams.

   Nachgemessen an den grossen Zeichen aus dem Kaufbildschirm (174 x 112 px
   Innenraum, hier auf das Raster 100 x 69 umgerechnet - Rahmen 6,
   Innenzeichnung 4,4). Jede Zahl unten ist abgelesen:

     Stadion        x 15,4..84,4  y 15,4..53,3  -  IMMER gleich gross
     Gewichtsbalken Mitten 15,25 und 27,8, Breite 6, ueber die volle Hoehe,
                    und sie liegen UEBER dem Stadion, nicht daneben
     Jagdpanzer     Dreieck von den unteren Innenecken zur Spitze (50,6),
                    Spitze massiv ausgefuellt
     Flugzeugkeule  Tropfen: Spitze in der Mitte (50,34,5), runder Abschluss
                    aussen mit Radius 15,4 - keine Ellipse, und die Striche
                    beider Keulen kreuzen sich in der Mitte
     Pfeil          massiv, Kopf 42,7..57,3 bis y 17, Schaft 6,2 bis y 37,8
     Schirm         Kuppel x 36..64, Sehne y 36, Last bis (50,56)
     Fluegel        von den Aussenkanten zur Kuppelschulter geschwungen

   Bausteine: X Infanterie | \ Aufklaerung | Stadion Panzer | Keulen + Pfeil
   Flugzeug | Raeder motorisiert | Balken Gewicht | Dreieck Jagdpanzer |
   Schirm mit Fluegeln Luftlande.                                          */
const SYM = {
  infantry:"X", guard:"G", motorized_guard:"G M", motorized_infantry:"X M",
  mechanized_infantry:"X A", recon:"R", motorized_recon:"R M", mechanized_recon:"R A",
  light_armor:"A", medium_armor:"A w1", heavy_armor:"A w2",
  medium_tank_destroyer:"A T w1", heavy_tank_destroyer:"A T w2",
  paratroopers:"X P", paratroopers_on_ground:"X P", pathfinders:"R P", pathfinders_on_ground:"R P",
  fighter_squadron:"F", heavy_fighter_squadron:"F H", fighter_recon:"F R2",
};
function symbolSVG(key, farbe, w=26, h=18){
  const teile = (SYM[key] || "X").split(" "), hat = t => teile.includes(t);
  const W = 100, H = 69, R = 6, I = 4.4;
  const L = R, Re = W - R, O = R, U = H - R;
  const p = [], g = [], voll = [];        // Rahmen, Strich, Flaeche

  p.push(`<rect x="${R/2}" y="${R/2}" width="${W-R}" height="${H-R}" fill="none"
    stroke="${farbe}" stroke-width="${R}" stroke-linejoin="miter"/>`);

  if (hat("X")) g.push(`<path d="M${L} ${O}L${Re} ${U}M${Re} ${O}L${L} ${U}"/>`);
  if (hat("R")) g.push(`<path d="M${L} ${U}L${Re} ${O}"/>`);
  if (hat("G")){                          // Wache: X nur als Eckstumpf
    const dx = (Re-L)*0.20, dy = (U-O)*0.20;
    g.push(`<path d="M${L} ${O}l${dx} ${dy}M${Re} ${O}l${-dx} ${dy}`
         + `M${L} ${U}l${dx} ${-dy}M${Re} ${U}l${-dx} ${-dy}"/>`);
  }
  /* Das Stadion behaelt immer dieselbe Groesse - die Gewichtsbalken werden
     spaeter darueber gelegt und verdecken sein linkes Ende. */
  if (hat("A")) g.push(`<rect x="15.4" y="15.4" width="69" height="37.9"
    rx="18.95" ry="18.95"/>`);
  if (hat("T")){                          // Jagdpanzer
    g.push(`<path d="M${L} ${U}L50 ${O}L${Re} ${U}"/>`);
    voll.push(`<path d="M50 ${O-1}L57.4 19H42.6Z"/>`);   // massive Spitze
  }
  if (hat("F")){
    /* Zwei Tropfen, deren Spitzen sich in der Mitte treffen und deren Striche
       sich dort kreuzen - deshalb ein geschlossener Pfad je Keule und keine
       Ellipse. Der runde Abschluss ist ein Kreisbogen um (23,2 | 76,8). */
    g.push(`<path d="M50 34.5L29.6 21.9A15.4 15.4 0 1 0 29.6 47.1Z"/>`
         + `<path d="M50 34.5L70.4 21.9A15.4 15.4 0 1 1 70.4 47.1Z"/>`);
    voll.push(`<path d="M50 ${O-1}L57.3 17H53.1V37.8H46.9V17H42.7Z"/>`);
    if (hat("H"))                         // schwerer Jaeger: massive Sprossen
      for (let k = 0; k < 4; k++)
        voll.push(`<rect x="42" y="${16 + k*3.4}" width="16" height="1.8"/>`);
    if (hat("R2"))                        // Aufklaerer: Strich quer zum Schaft
      g.push(`<path d="M36 54L54 38"/>`);
  }
  if (hat("P")){
    /* Fallschirm mit Fluegeln: schmale Kuppel in der Mitte, Sehne, Last als
       Spitze, dazu die beiden geschwungenen Fluegel bis an die Innenkanten. */
    g.push(`<path d="M36 36A14 22 0 0 1 64 36"/>`
         + `<path d="M36 36H64"/>`
         + `<path d="M40 36L50 56L60 36"/>`
         + `<path d="M${L} 34Q24 17 36 25"/>`
         + `<path d="M${Re} 34Q76 17 64 25"/>`);

  if (g.length) p.push(`<g stroke="${farbe}" stroke-width="${I}" fill="none"
    stroke-linecap="butt" stroke-linejoin="miter">${g.join("")}</g>`);

  /* Die Gewichtsbalken zuletzt und ueber allem - so verdecken sie das Stadion
     wie im Spiel. */
  const gew = (teile.find(t => t[0] === "w") || "w0")[1] | 0;
  for (let k = 0; k < gew; k++)
    p.push(`<path d="M${15.25 + k*12.55} ${O}V${U}" stroke="${farbe}" stroke-width="6"/>`);

  if (voll.length) p.push(`<g fill="${farbe}" stroke="none">${voll.join("")}</g>`);
  if (hat("G"))
    p.push(`<text x="48" y="52" font-size="47" font-weight="700" fill="${farbe}"
      text-anchor="middle" stroke="none"
      font-family="Georgia,'Times New Roman',serif">G</text>`);
  if (hat("M"))

         + `<circle cx="78" cy="56" r="6.5" fill="${farbe}"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" width="${w}" height="${h}" aria-hidden="true"

/* Die drei Abzeichen, die das Spiel selbst benutzt: Stern im Ring fuer die

const AT = {};

const ZWEIGE = [

const atRadius = k => (AT[k] && AT[k].attack_r) || 0;

const atStufe = k => (AT[k] && AT[k].vision) || 0;

const SICHT_STD = {basis: 0, schritt: 10, mass: 11};
let sichtCal = (() => {

  catch(e){ return {...SICHT_STD}; }
})();
const sichtSpiel = k => sichtCal.basis + atStufe(k) * sichtCal.schritt;   // wie im Spiel angezeigt

/* Which towns a unit standing here would reveal */
function siehtStaedte(town, radius){

/* ---------------- faction resource pool ----------------

const RES = {};

function poolStand(){
  const e = S.meta.pool;
  if (!e || !e.v) return null;
  const seit = Math.max(0, jetzt() - (e.t || 0));
  const raus = {f: e.v._f, t: e.t, by: e.n || e.by, jetzt: {}, gelesen: {}, takte: {}};
  for (const r of resListe()){
    const gelesen = Math.max(0, +e.v[r.k] || 0);
    const takte = r.sek ? Math.floor(seit / (r.sek * 1000)) : 0;
    raus.gelesen[r.k] = gelesen;
    raus.takte[r.k] = takte;

function setPool(werte, f){

/* How many teams of this type the pool allows right now, what runs out first,
   and how long until the next one is covered. */
function teamAusVorrat(k, stand){
  const cost = (AT[k] && AT[k].cost) || {};
  const posten = Object.entries(cost);
  if (!posten.length || !stand) return null;
  let stueck = Infinity, engpass = null, wartenS = 0;
  for (const [rk, n] of posten){
    const r = RES[rk];
    if (!r || !n) continue;
    const da = stand.jetzt[rk] || 0;
    const moeglich = Math.floor(da / n);
    if (moeglich < stueck){ stueck = moeglich; engpass = rk; }
    if (da < n) wartenS = Math.max(wartenS,
      r.pro > 0 ? Math.ceil((n - da) / r.pro) * r.sek : Infinity);
  }
  return {stueck: isFinite(stueck) ? stueck : 0, engpass, wartenS, cost};
}
const dauerText = s => !isFinite(s) ? "not at this rate"
  : s <= 0 ? "now"
  : s < 60 ? "under a minute"
  : s < 5400 ? `${Math.round(s/60)} min`
  : s < 172800 ? `${(s/3600).toFixed(1)} h`
  : `${Math.round(s/86400)} d`;
/* Die eigentliche Planungsfrage: der Clan will n davon — wann traegt der
   Vorrat das? Rechnet damit, dass sonst niemand etwas ausgibt, was niemand
   versprechen kann. Also der fruehestmoegliche Zeitpunkt, keine Vorhersage. */
function zeitFuer(k, stand, n){
  const cost = (AT[k] && AT[k].cost) || {};
  if (!stand || !Object.keys(cost).length) return null;
  let sek = 0, engpass = null;
  for (const [rk, menge] of Object.entries(cost)){
    const r = RES[rk];
    if (!r || !menge) continue;
    const brauche = menge * n, da = stand.jetzt[rk] || 0;
    if (da >= brauche) continue;
    const s = r.pro > 0 ? Math.ceil((brauche - da) / r.pro) * r.sek : Infinity;
    if (s > sek){ sek = s; engpass = rk; }
  }
  return {sek, engpass};
}

/* ---------------- soldiers and their kit ----------------

const CLS = {};
for (const c of (MAP.cls || [])) CLS[c.k] = c;

function faehigkeiten(s){

/* Ein Soldateneintrag aus fremder Hand kann alles enthalten - eine Zahl statt

function soldatNorm(s){
  if (!s || typeof s !== "object") return null;
  const nurText = x => (Array.isArray(x) ? x : []).filter(y => typeof y === "string");
  const text = x => typeof x === "string" ? x : "";

  const roh = s.rank !== undefined && s.rank !== "" ? s.rank : s.lvl;
  const rang = Number.isFinite(+roh) ? Math.max(0, Math.min(RANG_MAX, Math.round(+roh))) : 0;

const UPG = {};
for (const u of MAP.upg) UPG[u.k] = u;

const KLASSE_NR = {};
for (const [nr, k] of Object.entries(MAP.klnr)) KLASSE_NR[k] = +nr;

const RANG_MAX = 22;

/* Welche Seite der Clan gerade spielt. Zentral gesetzt, weil sich das

function setClanFaktion(f){ stamp("meta", "clanf", f, {n: S.name || ""}); save(); }
/* Kann diese Klasse auf dieser Stufe das ueberhaupt kaufen? Die av-Zeilen sind

function verfuegbar(d, frak, cls, lvl){
  if (!d) return false;

const soldatenVon = who => soldatenListe(S.depot[who] && S.depot[who].arms);

/* ---- anonym veroeffentlichen -----------------------------------------

function anonAusCode(code){

  let a = 0x811c9dc5, b = 0x01000193;
