function anonAn(){
  if (anonSoldaten(anonKennung()).length) return true;
  if (soldatenListe(S.depot[S.me] && S.depot[S.me].arms).length) return false;
  return lies(ANON_KEY + "-on", "0") === "1";
}
const meineSoldaten = () => anonAn() ? anonSoldaten(anonKennung())
                                     : soldatenListe(S.depot[S.me] && S.depot[S.me].arms);
function anonSchreiben(liste){
  S.anon ||= {};
  const k = anonKennung(), l = soldatenListe(liste);
  /* Kein by, kein n: was hier steht, traegt keinen Verfasser. Deshalb zieht
     auch der Kennungswechsel beim Verbinden nichts daran nach. */
  S.anon[k] = {v: l.length ? l : null, t: jetzt()};
  dirty.add(`anon:${k}`); save();
}
function anonUmschalten(an){
  S.anon ||= {};
  const vorher = meineSoldaten();          // vor dem Umlegen des Schalters lesen
  schreib(ANON_KEY + "-on", an ? "1" : "0");
  const k = anonKennung();
  if (an){
    S.anon[k] = {v: vorher.length ? vorher : null, t: jetzt()};
    dirty.add(`anon:${k}`);
    depotSchreiben({arms: []});
  } else {
    S.anon[k] = {v: null, t: jetzt()};      // Grabstein, sonst kaeme die Zeile zurueck
    dirty.add(`anon:${k}`);
    depotSchreiben({arms: vorher});
  }
  save();
}

/* ---------------- state ----------------
   Timestamped entries so two people's maps can be merged; v===null is a
   tombstone so deletions survive a sync.                                */
const STORE = "hng-warmap-v3";
/* Every kind of timestamped entry. Arrows are a list, everything else a map. */
const BUCKETS = ["owner","units","depot","notes","fight","join","meta","star","spot",
                 "line","post","area","para","roster","est","edep","anon","akt","btl"];
const neu = () => Object.assign({me:"", name:"", arrows:[], gone:{}},
                                ...BUCKETS.map(b => ({[b]:{}})));
let S = neu();
let tool = "inspect", faction = 1, sel = null, arrowFrom = null, lineDraft = null;
let objOnly = false, showNames = true, showKey = false, showDepot = true, paraGeplant = false;
let showRadius = true;
/* Arrows and defence lines stay editable after they are drawn: the object
   under the pointer shows grab handles, and one of them is being dragged
   while `editing` is set. Declared up here because draw() reads both. */
let hoverObj = null, editing = null;
/* Die Trefferflaeche eines Pfeils ist ein Path2D. Am Pfeilobjekt gespeichert
   landete er ueber JSON.stringify als leeres {} in localStorage und in der
   Datenbank - und ctx.isPointInPath wirft darauf. Also getrennt halten, je
   Bild neu, mit der Pfeilkennung als Schluessel. */
const pfadVon = new Map();
/* Dazu die Mittellinie als Streckenzug: die Trefferflaeche eines Pfeils ist an
   der Spitze nur wenige Pixel breit, und niemand will mit der Maus auf einer
   Nadel balancieren. Fuer Griffe und Klick zaehlt daher der Abstand zur
   Mittellinie, nicht der Treffer im gefuellten Koerper. */
const mitteVon = new Map();
/* Wie weit daneben noch als "am Pfeil" gilt - mit der Oberflaechengroesse
   mitwachsend, weil auf 4K alles groesser gezeigt wird. */
const griffTol = () => 11*uiScale + 5;
function abstandZuSegment(px, py, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1], len2 = dx*dx + dy*dy || 1;
  let t = ((px-a[0])*dx + (py-a[1])*dy) / len2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (a[0]+dx*t), py - (a[1]+dy*t));
}
const jetzt = () => Date.now();

/* How long a sighting counts as fresh. Older ones fade out — on a map that is
   updated by hand, an unmarked stale report is worse than none.            */
const FRISCH = 6*3600e3, ALT = 24*3600e3;
const alter = t => jetzt() - (t||0);
/* ---- enemy register ----------------------------------------------------
   Player names in this game are full of decoration ("/!(§Peter"). Matching on
   the stripped-down form means typing "peter" finds him, and two spellings of
   the same person collapse into one register entry.                        */
/* Stripped-down form of a name, used for SEARCHING only. "Peter", "/!(§Peter"
   and "Peter123" are three different people and stay three entries — but
   typing "peter" has to surface all of them, so the key keeps the stripped
   form as a prefix and a short hash of the exact name behind it. */
/* Buchstaben und Ziffern JEDER Schrift, nicht nur a-z. Ein arabischer oder
   chinesischer Name wurde sonst zur leeren Kette, und die Spielersuche
   verglich lauter leere Ketten miteinander. Fuer lateinische Namen bleibt
   das Ergebnis dasselbe - Umlaute werden vorher zerlegt und die Beistriche
   entfernt, "Muenchen" ergibt weiterhin "munchen". */
const namKey = s => String(s).toLowerCase().normalize("NFKD")
  .replace(/[\u0300-\u036f]/g, "").replace(/[^\p{L}\p{N}]/gu, "");
function namHash(s){
  let h = 5381;
  for (let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36).slice(0,5);
}
const spielerKey = name => `${namKey(name).slice(0,28) || "x"}-${namHash(name)}`;
function merkeSpieler(name, f, clan){
  name = String(name).trim();
  if (name.length < 2) return null;
  const k = spielerKey(name), alt = S.roster[k], av = alt && alt.v;
  /* undefined heisst "so lassen", null heisst ausdruecklich loeschen - sonst
     waere das "—" in der Fraktionsauswahl ein stiller Blindgaenger. */
  const neuF = f === undefined ? (av ? av.f : null) : f;
  const neuC = clan === undefined ? (av ? av.clan : "") : String(clan || "").trim();
  if (av && av.name === name && av.f === neuF && (av.clan||"") === (neuC||"")) return k;
  /* Die vermutete Zeitzone bleibt erhalten - sie wird woanders gesetzt und
     darf durch eine Fraktions- oder Clanaenderung nicht verlorengehen. */
  S.roster[k] = {v:{name, f: neuF, clan: neuC, tz: av ? av.tz : undefined},
                 t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`roster:${k}`); save();
  return k;
}
/* Clans are not a separate table — they are whatever players are tagged with.
   Grouping them is how you see that a sighting is an organised operation
   rather than a handful of randoms. */
function clanListe(){
  const m = new Map();
  for (const p of spielerListe()){
    const c = (p.clan || "").trim();
    if (!c) continue;
    const d = m.get(c.toLowerCase()) || {name:c, spieler:[], teams:0, f:new Map()};
    d.spieler.push(p);
    d.teams += feindDepot(p.key).length;
    if (p.f != null) d.f.set(p.f, (d.f.get(p.f)||0) + 1);
    m.set(c.toLowerCase(), d);
  }
  return [...m.values()].sort((a,b)=> b.spieler.length - a.spieler.length);
}
/* A tag people put in their own name — "[SRB]CrazySerb", "ROS | Peter".
   The full string stays the name; this is only the derived grouping. */
function tagAus(name){
  const s = String(name).trim();
  let m = s.match(/^[\[\(\{<]([^\]\)\}>]{1,12})[\]\)\}>]/);
  if (m) return m[1].trim();
  m = s.match(/^([A-Za-z0-9]{2,8})\s*[|\/]\s*\S/) || s.match(/\S\s*[|\/]\s*([A-Za-z0-9]{2,8})$/);
  return m ? m[1].trim() : "";
}
const clanVon = name => {
  const e = S.roster[spielerKey(name)];
  return e && e.v && e.v.clan ? e.v.clan : "";
};
/* Which clans are behind the sightings at a town */
function clansAt(i){
  const raus = new Map();
  for (const g of spotsAt(i))
    for (const u of g.list){
      if (!u.owner) continue;
      const c = clanVon(u.owner);
      if (c) raus.set(c, (raus.get(c)||0) + u.n);
    }
  return [...raus.entries()].map(([name,n])=>({name, n}));
}
const spielerListe = () => Object.entries(S.roster)
  .filter(([,e]) => e && e.v && e.v.name)
  .map(([k,e]) => ({key:k, name:e.v.name, f:e.v.f, clan:e.v.clan||"", t:e.t, by:e.n || e.by}))
  .sort((a,b) => a.name.localeCompare(b.name));
/* Loose search: "peter" finds Peter, Peter123 and the decorated spelling. */
function spielerSuche(q){
  const k = namKey(q);
  if (!k) return spielerListe().slice(0, 12);
  return spielerListe()
    .map(p => ({p, roh: namKey(p.name)}))
    .filter(x => x.roh.includes(k) || k.includes(x.roh))
    .sort((a,b) => a.roh.indexOf(k) - b.roh.indexOf(k) || a.roh.length - b.roh.length)
    .slice(0, 12).map(x => x.p);
}
/* Enemy depot: what we believe a given enemy player owns. Shared, everyone
   may add to it — with name and tag so nobody enters the same team twice. */
const feindDepot = key => (S.edep[key] && Array.isArray(S.edep[key].v) && S.edep[key].v) || [];
function setFeindDepot(key, list){
  S.edep[key] = {v: list.length ? list : null, t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`edep:${key}`); save();
}

/* Welche Toepfe ihren Verfasser im Schluessel tragen, und als wievieltes
   Teil. Genau diese Zeilen darf nur ihr Verfasser schreiben - die Datenbank
   sieht das ebenso, deshalb muss die Seite es an einer Stelle wissen. */
const AUTOR_TEIL = {depot: 1, units: 2, join: 2, post: 2, line: 2, spot: 2,
                    area: 2, est: 2};
function autorVon(bucket, id){
  const n = AUTOR_TEIL[bucket];
  if (!n) return null;
  const t = String(id).split(":");
  return t.length >= n ? t[n-1] : null;
}
const byteLaenge = s => {
  try { return new TextEncoder().encode(s).length; } catch(e){ return s.length * 3; }
};

/* Who made an edit. Every entry carries its author's name; fall back to the id. */
function werWar(e){
  if (!e) return "?";
  if (e.by === S.me) return (S.name || "you") + " (you)";
  return e.n || e.by || "?";
}
function alterText(t){
  const m = Math.round(alter(t)/60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m/60);
  return h < 36 ? h + " h ago" : Math.round(h/24) + " d ago";
}

/* Ein neuer Krieg zieht einen Strich. Alles, was davor geschrieben wurde,
   gehoert zum alten Krieg und wird nicht mehr gezeigt. Fremde Eintraege
   lassen sich nicht loeschen - die Schreibregel der Datenbank laesst jeden
   nur an seine eigenen -, also legt dieser eine gemeinsame Zeitstempel sie
   still. Depot, Arsenal, Spielerliste und Feinddepot haengen nicht daran:
   die werden ueber Kriege hinweg aufgebaut. */
const epoche  = () => (S.meta.epoch && +S.meta.epoch.v) || 0;
const imKrieg = e => !!e && (e.t || 0) >= epoche();

const ownerOf   = i => (imKrieg(S.owner[i]) && S.owner[i].v != null) ? S.owner[i].v : -1;
const factionOf = i => { const o = ownerOf(i); return o >= 0 ? FACTIONS[o] : NEUTRAL; };
const noteOf    = i => (imKrieg(S.notes[i]) && S.notes[i].v) || "";
const fightAt   = i => !!(imKrieg(S.fight[i]) && S.fight[i].v);
const starAt    = i => !!(imKrieg(S.star[i]) && S.star[i].v);
const lebt      = (id, e) => imKrieg(e) && e.v && !(S.gone[id] && S.gone[id].t >= (e.t||0));
const liveArrows= () => S.arrows.filter(a => a && MAP.n[a.from] && MAP.n[a.to]
  && (a.t||0) >= epoche() && !(S.gone[a.id] && S.gone[a.id].t >= (a.t||0)));
const liveLines = () => Object.entries(S.line)
  .filter(([id,e]) => lebt(id,e) && Array.isArray(e.v.pts) && e.v.pts.length >= 2);
const liveAreas = () => Object.entries(S.area)
  .filter(([id,e]) => lebt(id,e) && Array.isArray(e.v.pts) && e.v.pts.length >= 3);
const livePosts = () => Object.entries(S.post).filter(([id,e]) => lebt(id,e) && e.v.text != null)
                        .sort((a,b) => (b[1].t||0) - (a[1].t||0));
/* Sightings are keyed "<town>:<player>" so several people can report the same town */
function spotsAt(i){
  const raus = [];
  for (const k of Object.keys(S.spot)){
    const p = k.indexOf(":");
    if (+k.slice(0,p) !== i) continue;
    const e = S.spot[k];
    if (imKrieg(e) && Array.isArray(e.v) && e.v.length)
      raus.push({who:k.slice(p+1), name:e.n||"", t:e.t, list:e.v, mine:k.endsWith(":"+S.me)});
  }
  return raus;
}
const allSpots = () => {
  const m = new Map();
  for (const k of Object.keys(S.spot)){
    const e = S.spot[k];
    if (!e || !Array.isArray(e.v) || !e.v.length) continue;
    const town = +k.slice(0, k.indexOf(":"));
    if (!MAP.n[town]) continue;          // Stadt aus einem anderen Bau
    const d = m.get(town) || {town, n:0, t:0, f:null, arten:new Set()};
    for (const s of e.v){ d.n += s.n; d.arten.add(s.k); d.f = s.f; }
    d.t = Math.max(d.t, e.t||0);
    m.set(town, d);
  }
  return [...m.values()].sort((a,b)=> b.t - a.t);
};
const clanName  = () => (S.meta.clan && S.meta.clan.v) || "War Map";
/* Was zentral gilt. Eine Zeile fuer alle, mit Verfasser und Zeitpunkt -
   sonst weiss niemand, ob der Befehl von gestern noch steht. */
const clanBefehl = () => {
  const e = S.meta.befehl;
  return (e && e.v) ? {text: String(e.v), von: e.n || e.by || "", t: e.t || 0} : null;
};
function setClanBefehl(txt){
  /* Mit Verfassernamen - sonst steht beim Befehl die interne Kennung, und
     niemand weiss, von wem er stammt. */
  stamp("meta", "befehl", String(txt || "").trim() || null, {n: S.name || ""});
  save(); kopfzeile();
}
/* Wer die Karte allein benutzt, darf alles - sonst koennte niemand anfangen.
   Mit Anschluss entscheidet der Zugangscode. */
const istLeiter = () => !CFG || !!CFG.admin;
const warName   = () => (S.meta.war && S.meta.war.v) || "";

let unitIdx = new Map(), depotIdx = new Map();
function rebuildUnits(){
  unitIdx = new Map();
  for (const key of Object.keys(S.units)){
    const e = S.units[key];
    if (!imKrieg(e) || !Array.isArray(e.v) || !e.v.length) continue;
    const p = key.indexOf(":");
    if (p < 0) continue;
    const town = +key.slice(0, p), who = key.slice(p+1);
    if (!unitIdx.has(town)) unitIdx.set(town, []);
    unitIdx.get(town).push({who, name: e.n || who, mine: who === S.me, list: e.v});
  }
  depotIdx = new Map();
  for (const who of Object.keys(S.depot)){
    const e = S.depot[who];
    /* Nur das Depot der eingestellten Seite - wer eine andere spielt, hat
       hier nichts zu suchen. */
    if (e && Array.isArray(e.v))
      depotIdx.set(who, {name: e.n || who, list: aufSeite(depotListe(e.v), aktiveSeite()),
                         h: verlaufVon(who), t: e.t,
                         arms: soldatenListe(e.arms)});
  }
}
const unitsAt = i => unitIdx.get(i) || [];
const myUnits = i => (S.units[`${i}:${S.me}`] && S.units[`${i}:${S.me}`].v) || [];
const teamsAt = i => unitsAt(i).reduce((s,g)=>s + g.list.reduce((t,u)=>t+u.s,0), 0);
const menAt   = i => unitsAt(i).reduce((s,g)=>s + g.list.reduce((t,u)=>t+u.s*atMen(u.k),0), 0);

/* Depot: one entry per assault team, each with its own name — the game names
   them too ("Bodenmänner-1"), and without names nobody can tell their own
   three Guards apart. Older depots stored {k,n} counts; those are converted. */
/* Aeltere Depots hielten {k,n} als Anzahl statt einer Zeile je Team. Alles
   dahinter erwartet die ausgeschriebene Form, deshalb genau eine Stelle, die
   umrechnet - ein Stapel von acht als ein Team gezaehlt hat vorher jede
   Summe und jeden Verlaufspunkt verfaelscht. */
function depotListe(roh){
  if (!Array.isArray(roh) || !roh.length) return [];
  if (roh[0].id !== undefined || roh[0].n === undefined) return roh;
  const raus = [];
  for (const d of roh)
    for (let i=0;i<(d.n||0);i++) raus.push({id: `${d.k}-${i}`, k: d.k, name: ""});
  return raus;
}
/* Zu welcher Seite gehoert ein Eintrag? Ohne Angabe ist es Altbestand - der
   zaehlt zur eingestellten Seite und bekommt sie beim naechsten Schreiben. */
const seiteVon = d => (d && (d.f === 0 || d.f === 1 || d.f === 2)) ? d.f : null;
const aufSeite = (liste, f) => (liste || []).filter(d => {
  const s = seiteVon(d);
  return s === null || s === f;
});
/* Alle drei Depots zusammen - nur zum Schreiben, nie zum Anzeigen. */
function myDepotAlle(){
  return depotListe(S.depot[S.me] && S.depot[S.me].v).map(namenAn);
}
/* ---- Namen der eigenen Kampfeinheiten --------------------------------
   Sie gehen niemanden sonst etwas an, also werden sie nicht uebertragen.
   Sie liegen unter einem eigenen Schluessel in diesem Browser - ausserhalb
   des synchronisierten Zustands und damit auch ausserhalb jedes
   Teilen-Verweises. Die Sicherungsdatei nimmt sie mit. */
const NAMEN_STORE = "hng-warmap-namen";
let eigenNamen = {};
function namenLaden(){
  try { eigenNamen = JSON.parse(localStorage.getItem(NAMEN_STORE) || "{}") || {}; }
  catch(e){ eigenNamen = {}; }
}
function namenSichern(){
  try { localStorage.setItem(NAMEN_STORE, JSON.stringify(eigenNamen)); } catch(e){}
}
function namenAn(d){
  const n = eigenNamen[d.id];
  if (!n) return d;
  const raus = {...d};
  if (n.name) raus.name = n.name;
  if (n.tag)  raus.tag  = n.tag;
  return raus;
}
/* Name und Kuerzel heraustrennen: hierher merken, aus der geteilten Zeile
   entfernen. */
function namenTrennen(liste){
  return (liste || []).map(d => {
    const name = (d.name || "").trim(), tag = (d.tag || "").trim();
    if (name || tag) eigenNamen[d.id] = {name, tag};
    else delete eigenNamen[d.id];
    const raus = {...d};
    delete raus.name; delete raus.tag;
    return raus;
  });
}
/* Einmaliger Umzug: was noch Namen in der geteilten Zeile stehen hat, kommt
   hierher. Laeuft still, sobald die Karte geoeffnet wird. */
function namenUmziehen(){
  const e = S.depot[S.me];
  if (!e || !Array.isArray(e.v)) return;
  if (!e.v.some(d => d && (d.name || d.tag))) return;
  const ohne = namenTrennen(depotListe(e.v));
  namenSichern();
  S.depot[S.me] = {...e, v: ohne, t: jetzt()};
  dirty.add(`depot:${S.me}`); save();
}

function myDepot(){
  return aufSeite(myDepotAlle(), aktiveSeite());
}
const teamById = id => myDepot().find(d => d.id === id);

/* ---- how a depot grew over time ----
   Sync keeps exactly one row per player and only the newest wins, so a
   history cannot live in its own bucket without a second write rule in the
   database. It rides inside the depot entry instead — same key, same owner,
   no schema change. One snapshot a day, and only when the composition really
   changed, because that row has a 20 KB ceiling. */
const TAG_MS = 86400e3;
const tagNr = t => Math.floor((t || jetzt()) / TAG_MS);
const tagDatum = d => new Date(d*TAG_MS).toISOString().slice(0,10);
function zusammensetzung(list){
  const c = {};
  for (const d of (list||[])) c[d.k] = (c[d.k] || 0) + 1;
  return c;
}
const gleicheMischung = (a, b) => {
  const ka = Object.keys(a||{}), kb = Object.keys(b||{});
  return ka.length === kb.length && ka.every(k => a[k] === b[k]);
};
function verlaufFort(alt, list, f){
  /* Je Seite ein eigener Verlauf. Ohne das spraenge die Kurve beim Wechsel,
     und sie zeigte nebenbei Bestaende der anderen Seite. */
  const bisher = (alt && alt.hf && Array.isArray(alt.hf[f])) ? alt.hf[f]
               : ((alt && Array.isArray(alt.h)) ? alt.h : []);
  let h = bisher.slice();
  const altListe = aufSeite(depotListe(alt && alt.v), f);
  if (!h.length && altListe.length)                   // Altbestand als Startpunkt
    h = [{d: tagNr(alt.t), c: zusammensetzung(altListe)}];
  const c = zusammensetzung(list), d = tagNr();
  const letzt = h[h.length-1];
  if (letzt && letzt.d === d) h[h.length-1] = {d, c};
  else if (!letzt || !gleicheMischung(letzt.c, c)) h.push({d, c});
  return verlaufKuerzen(h);
}
/* The database caps one row at 20 KB, and this history shares its row with
   the team list. Recent weeks stay day by day because that is what people
   look at; further back one entry a week is plenty for a curve. The byte
   budget on top is the hard stop — a depot full of long team names must
   never be the thing that makes a write bounce. */
function verlaufKuerzen(h){
  const heute = tagNr();
  const raus = [];
  let letzteWoche = null;
  for (const x of h){
    if (heute - x.d <= 30){ raus.push(x); continue; }
    const w = Math.floor(x.d/7);
    if (w !== letzteWoche){ raus.push(x); letzteWoche = w; }
    else raus[raus.length-1] = x;          // der spaetere Stand der Woche gilt
  }
  while (raus.length > 2 && JSON.stringify(raus).length > 6000) raus.shift();
  return raus;
}
/* For players whose depot predates this, one point is synthesised from the
   entry's own timestamp — otherwise their line would start at nothing. */
function verlaufVon(who){
  const e = S.depot[who];
  if (!e || !Array.isArray(e.v)) return [];
  const f = aktiveSeite();
  if (e.hf && Array.isArray(e.hf[f]) && e.hf[f].length) return e.hf[f];
  const liste = aufSeite(depotListe(e.v), f);
  /* Ein Verlauf ohne Seitenangabe gehoert zum Altbestand, also nur dann, wenn
     dieser Spieler ueberhaupt noch Eintraege ohne Seitenangabe hat. */
  if (Array.isArray(e.h) && e.h.length
      && depotListe(e.v).some(d => seiteVon(d) === null)) return e.h;
  return liste.length ? [{d: tagNr(e.t), c: zusammensetzung(liste)}] : [];
}
function deployedIds(who){
  const raus = new Set();
  for (const [, gruppen] of unitIdx)
    for (const g of gruppen)
      if (g.who === who) for (const u of g.list) if (u.id) raus.add(u.id);
  return raus;
}
function deployedBy(who){
  const zaehl = {};
  for (const [, gruppen] of unitIdx)
    for (const g of gruppen)
      if (g.who === who) for (const u of g.list) zaehl[u.k] = (zaehl[u.k]||0) + (u.s || 1);
  return zaehl;
}
const townOfTeam = id => {
  for (const [town, gruppen] of unitIdx)
    for (const g of gruppen)
      if (g.mine) for (const u of g.list) if (u.id === id) return town;
  return null;
};

/* ---------------- interface scale ----------------
   On a 4K panel at 100 % Windows scaling everything is half the size it should
   be, so start from the window width and let the user override it.       */
const UI_STUFEN = [1, 1.15, 1.3, 1.5, 1.8, 2.1, 2.5];
function uiVorschlag(){
  const b = window.innerWidth;
  return b > 3200 ? 1.8 : b > 2500 ? 1.5 : b > 1900 ? 1.25 : 1;
}
let uiScale = parseFloat(localStorage.getItem("hng-warmap-ui") || "0") || uiVorschlag();
function uiSetzen(v){
  uiScale = v;
  document.documentElement.style.setProperty("--ui", v);
  document.getElementById("ui-lbl").textContent = Math.round(v*100) + " %";
  localStorage.setItem("hng-warmap-ui", String(v));
  requestAnimationFrame(resize);
}
document.getElementById("b-ui").addEventListener("click", ()=>{
  const i = UI_STUFEN.findIndex(s => Math.abs(s-uiScale) < .01);
  uiSetzen(UI_STUFEN[(i+1) % UI_STUFEN.length]);
});
/* Schriftgroesse getrennt regelbar: auf einem 4K-Schirm will man die Leisten
   gross, die Depotliste aber oft noch groesser. Legt sich auf den ersten
   Regler drauf. */
const TEXT_STUFEN = [1, 1.1, 1.25, 1.4, 1.6];
let textScale = parseFloat(localStorage.getItem("hng-warmap-text") || "0") || 1;
function textSetzen(v){
  textScale = v;
  document.documentElement.style.setProperty("--ui-text", v);
  document.getElementById("text-lbl").textContent = Math.round(v*100) + " %";
  localStorage.setItem("hng-warmap-text", String(v));
  requestAnimationFrame(resize);
}
document.getElementById("b-text").addEventListener("click", ()=>{
  const i = TEXT_STUFEN.findIndex(s => Math.abs(s-textScale) < .01);
  textSetzen(TEXT_STUFEN[(i+1) % TEXT_STUFEN.length]);
});

/* ---------------- canvas ---------------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let img = new Image(), imgOk = false, view = {x:0,y:0,z:1}, dpr = 1, lastMouse = null;
img.onload = () => { imgOk = true; fit(); };
img.src = BG;

function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  draw();
}
function fit(){
  const r = cv.parentElement.getBoundingClientRect();
  if (r.width < 20 || r.height < 20){ requestAnimationFrame(fit); return; }
  const z = Math.min(r.width/MAP.w, r.height/MAP.h)*0.98;
  view = {z, x:(r.width-MAP.w*z)/2, y:(r.height-MAP.h*z)/2};
  draw();
}
const toScr = (x,y) => [x*view.z+view.x, y*view.z+view.y];
const toMap = (x,y) => [(x-view.x)/view.z, (y-view.y)/view.z];
const light = () => document.documentElement.getAttribute("data-theme") === "light";
const col = f => light() ? f.light : f.color;

function draw(){
  const w = cv.width, h = cv.height;
  pfadVon.clear(); mitteVon.clear();   // was nicht gezeichnet wird, ist nicht treffbar
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = light() ? "#d5d9de" : "#080b0f";
  ctx.fillRect(0,0,w,h);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const z = view.z, WW = w/dpr, HH = h/dpr;

  if (imgOk){
    ctx.globalAlpha = light() ? .85 : 1;
    ctx.drawImage(img, view.x, view.y, MAP.w*z, MAP.h*z);
    ctx.globalAlpha = 1;
    if (!light()){ ctx.fillStyle = "rgba(8,11,15,.30)"; ctx.fillRect(view.x, view.y, MAP.w*z, MAP.h*z); }
  }

  /* --- supply lines, coloured by who holds both ends (game style) --- */
  const front = [];
  ctx.lineCap = "round";
  for (const [a,b] of MAP.e){
    const oa = ownerOf(a), ob = ownerOf(b);
    const [x1,y1] = toScr(MAP.n[a][1], MAP.n[a][2]);
    const [x2,y2] = toScr(MAP.n[b][1], MAP.n[b][2]);
    if (x1 < -40 && x2 < -40 || y1 < -40 && y2 < -40) continue;
    if (oa >= 0 && ob >= 0 && oa !== ob){ front.push([x1,y1,x2,y2]); continue; }
    if (oa >= 0 && oa === ob){ ctx.strokeStyle = col(FACTIONS[oa]); ctx.lineWidth = Math.max(1, 1.5*z); }
    else { ctx.strokeStyle = light() ? "rgba(70,82,98,.45)" : "rgba(150,168,190,.28)"; ctx.lineWidth = Math.max(.6,.9*z); }
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  if (front.length){                       // the front, drawn last so it reads on top
    ctx.strokeStyle = "#8b95a5"; ctx.lineWidth = Math.max(1.4, 1.9*z);
    ctx.beginPath();
    for (const [x1,y1,x2,y2] of front){ ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); }
    ctx.stroke();
  }

  /* --- free-hand areas: enemy concentrations, zones, anything you circle --- */
  for (const [id,e] of liveAreas()) drawArea(e.v, e);
  if (zieh && zieh.art === "area" && zieh.pts.length > 2)
    drawArea({pts: zieh.pts, f: faction, label: ""}, null, true);

  for (const [id,e] of liveLines()) drawLine(e.v);
  if (lineDraft && lineDraft.pts.length) drawLine({pts: lineDraft.pts, f: lineDraft.f}, lastMouse);
  if (zieh && zieh.art === "line" && zieh.pts.length) drawLine({pts: zieh.pts, f: faction}, lastMouse);
  if (zieh && zieh.art === "para") for (const p of zieh.pts){
    const [px,py] = toScr(MAP.n[p][1], MAP.n[p][2]);
    ctx.strokeStyle = col(FACTIONS[faction]); ctx.lineWidth = 2*uiScale;
    ctx.beginPath(); ctx.arc(px, py, 12*uiScale, 0, 6.284); ctx.stroke();
  }
  if (zieh && zieh.art === "arrow" && lastMouse){
    const [ax,ay] = toScr(MAP.n[zieh.von][1], MAP.n[zieh.von][2]);
    ctx.strokeStyle = col(FACTIONS[faction]); ctx.lineWidth = 2.5*uiScale;
    ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(lastMouse[0], lastMouse[1]); ctx.stroke();
    ctx.setLineDash([]);
  }
  for (const a of liveArrows()) drawArrow(a);
  if (arrowFrom !== null && lastMouse){
    const [x1,y1] = toScr(MAP.n[arrowFrom][1], MAP.n[arrowFrom][2]);
    ctx.strokeStyle = col(FACTIONS[faction]); ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lastMouse[0], lastMouse[1]); ctx.stroke();
    ctx.setLineDash([]);
  }

  /* --- reach of what stands on a town ---
     Drawn before the towns so the discs never sit on top of a symbol, and
     worked out here because the town loop needs to know which towns are
     watched. Two different figures:
       strike  — how far an air unit can hit. Straight from the game data;
                 ground units carry no such figure, so none is invented.
       vision  — how far anything sees. Every unit has it, recon far more. */
  const gesehen = new Set();
  if (showRadius){
    for (const [town, gruppen] of unitIdx){
      let schlag = 0, sicht = 0, besteStufe = 0;
      for (const g of gruppen)
        for (const u of g.list){
          schlag = Math.max(schlag, atRadius(u.k));
          sicht  = Math.max(sicht,  atVision(u.k));
          besteStufe = Math.max(besteStufe, atStufe(u.k));
        }
      if (!schlag && !sicht) continue;
      const n = MAP.n[town];
      if (!n) continue;
      const [cx2,cy2] = toScr(n[1], n[2]);
      ctx.save();
      if (schlag){                                   // Angriffsreichweite: Messing
        const rp = (schlag/8)*z;
        if (rp > 6){
          ctx.strokeStyle = "#e2ac48"; ctx.globalAlpha = .42;
          ctx.lineWidth = 1.5*uiScale; ctx.setLineDash([3,5]);
          ctx.beginPath(); ctx.arc(cx2, cy2, rp, 0, 6.284); ctx.stroke();
        }
      }
      if (sicht){
        /* Every unit sees something, so a single faint disc per town is
           right: where they overlap the blue deepens on its own and the
           map turns into an honest picture of what the clan can watch. */
        const rp = (sicht/8)*z;
        if (rp > 5){
          const gross = besteStufe >= 2;             // Aufklaerer heben sich ab
          ctx.setLineDash([]);
          ctx.globalAlpha = gross ? .10 : .055; ctx.fillStyle = "#7fd8ff";
          ctx.beginPath(); ctx.arc(cx2, cy2, rp, 0, 6.284); ctx.fill();
          ctx.globalAlpha = gross ? .55 : .2;
          ctx.strokeStyle = "#7fd8ff"; ctx.lineWidth = (gross ? 1.8 : 1)*uiScale;
          ctx.stroke();
        }
        for (const s of siehtStaedte(town, sicht)) gesehen.add(s);
      }
      ctx.restore();
    }
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  /* --- towns as filled discs with the game's pictogram inside --- */
  const r0 = Math.max(2.6, 3.1*Math.sqrt(z)) * uiScale;
  for (let i=0;i<MAP.n.length;i++){
    const n = MAP.n[i], cap = isCap(i), obj = isObj(i);
    if (objOnly && !obj && !S.owner[i] && !unitsAt(i).length) continue;
    const [x,y] = toScr(n[1], n[2]);
    if (x < -30 || y < -30 || x > WW+30 || y > HH+30) continue;
    const f = col(factionOf(i));
    const r = cap ? r0*1.9 : (obj ? r0*1.35 : r0);

    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.284);
    ctx.fillStyle = f; ctx.fill();
    ctx.lineWidth = Math.max(.8, .9*Math.sqrt(z));
    ctx.strokeStyle = light() ? "rgba(255,255,255,.9)" : "rgba(5,8,12,.95)";
    ctx.stroke();
    if (r > 5) pictogram(x, y, r, n[3], cap, light() ? "#ffffff" : "rgba(6,10,14,.88)");

    if (fightAt(i)){                        // contested: brass ring
      ctx.strokeStyle = "#f0b845"; ctx.lineWidth = Math.max(1.6, 1.8*Math.sqrt(z));
      ctx.beginPath(); ctx.arc(x, y, r+3.4, 0, 6.284); ctx.stroke();
    }
    const pb = paraAt(i);
    if (pb){                                // para-block: parachute glyph beside the disc
      const g = Math.max(6, 5*Math.sqrt(z))*uiScale, px = x - r - g*0.9, py = y - r*0.2;
      ctx.globalAlpha = pb.plan ? .62 : 1;
      ctx.fillStyle = col(FACTIONS[pb.f]);
      ctx.strokeStyle = "rgba(5,8,12,.9)"; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(px, py, g, Math.PI, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px-g*.62, py); ctx.lineTo(px, py+g*.85);
      ctx.lineTo(px+g*.62, py); ctx.stroke();
      if (pb.plan){ ctx.setLineDash([2,2]); ctx.beginPath();
        ctx.arc(px, py+g*.2, g*1.35, 0, 6.284); ctx.stroke(); ctx.setLineDash([]); }
      ctx.globalAlpha = 1;
    }
    if (gesehen.has(i)){                    // within someone's vision
      ctx.strokeStyle = "#7fd8ff"; ctx.globalAlpha = .8;
      ctx.lineWidth = Math.max(1, 1.1*Math.sqrt(z));
      ctx.beginPath(); ctx.arc(x, y, r+2.2, 0, 6.284); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (starAt(i)){                         // key objective: double white ring
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(1.2, 1.3*Math.sqrt(z));
      ctx.beginPath(); ctx.arc(x, y, r+(fightAt(i)?6.4:3.6), 0, 6.284); ctx.stroke();
    }
    if (i === sel){
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r+6, 0, 6.284); ctx.stroke();
    }
    const st = teamsAt(i);
    if (st && z > .8){
      ctx.fillStyle = myUnits(i).length ? "#ffdf9a" : "#e8b04a";
      ctx.font = `600 ${Math.max(9, 8*Math.sqrt(z))*uiScale}px ui-monospace,Consolas,monospace`;
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.strokeStyle = "rgba(5,8,12,.9)"; ctx.lineWidth = 2.5;
      ctx.strokeText(st, x, y-r-2); ctx.fillText(st, x, y-r-2);
    }
  }

  /* --- enemy sightings, drawn above everything so they cannot be missed --- */
  for (const d of allSpots()){
    const n = MAP.n[d.town];
    if (!n) continue;
    const [x,y] = toScr(n[1], n[2]);
    if (x < -30 || y < -30 || x > WW+30 || y > HH+30) continue;
    const a = alter(d.t);
    const frisch = a < FRISCH;
    ctx.globalAlpha = a > ALT ? .42 : (frisch ? 1 : .72);
    const gr = Math.max(9, 7.5*Math.sqrt(z))*uiScale, oy = -(isCap(d.town)?r0*1.9:r0*1.35) - gr - 4;
    const farbe = d.f != null ? col(FACTIONS[d.f]) : "#e8b04a";
    ctx.beginPath();                                   // warning triangle
    ctx.moveTo(x, y+oy-gr); ctx.lineTo(x+gr*.95, y+oy+gr*.72); ctx.lineTo(x-gr*.95, y+oy+gr*.72);
    ctx.closePath();
    ctx.fillStyle = farbe; ctx.fill();
    ctx.strokeStyle = "rgba(5,8,12,.9)"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = "rgba(8,11,16,.92)";
    ctx.font = `700 ${gr*0.95}px "Segoe UI",system-ui,sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(d.n > 99 ? "!" : d.n, x, y+oy+gr*0.18);
    if (frisch && z > 1){                              // fresh: halo
      ctx.strokeStyle = farbe; ctx.globalAlpha = .5; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x, y+oy, gr*1.5, 0, 6.284); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* A clan tag turns "some enemies" into "an organised operation" — worth
       its own banner next to the warning. */
    const cl = clansAt(d.town);
    if (cl.length && z > 0.9){
      const txt = cl.map(c=>c.name).join(" / ");
      const fh = gr*1.15;
      ctx.font = `600 ${fh*0.86}px ${SCHMAL}`;
      const bw = ctx.measureText(txt).width + fh*0.9;
      const bx = x + gr*1.1, by2 = y + oy - fh*0.5;
      ctx.fillStyle = farbe;
      ctx.beginPath();
      ctx.moveTo(bx, by2); ctx.lineTo(bx+bw, by2);
      ctx.lineTo(bx+bw-fh*0.34, by2+fh*0.5); ctx.lineTo(bx+bw, by2+fh);
      ctx.lineTo(bx, by2+fh); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(5,8,12,.85)"; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = "#14100a"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(txt, bx + fh*0.42, by2 + fh*0.54);
      ctx.textAlign = "center";
    }
  }

  /* --- board notes pinned to a town --- */
  const angeheftet = new Map();
  for (const [,e] of livePosts()) if (e.v.town != null && !angeheftet.has(e.v.town))
    angeheftet.set(e.v.town, e.v.prio || 0);
  for (const [town, prio] of angeheftet){
    const n = MAP.n[town];
    if (!n) continue;
    const [x,y] = toScr(n[1], n[2]);
    if (x < -30 || y < -30 || x > WW+30 || y > HH+30) continue;
    const s = Math.max(7, 5.5*Math.sqrt(z))*uiScale, ox = (isCap(town)?r0*1.9:r0*1.35) + s + 2;
    ctx.fillStyle = prio >= 2 ? "#e03b32" : prio === 1 ? "#d9a441" : "#8493a5";
    ctx.strokeStyle = "rgba(5,8,12,.9)"; ctx.lineWidth = 1.4;
    ctx.beginPath();                                   // speech mark
    ctx.roundRect ? ctx.roundRect(x+ox-s, y-s-s*.5, s*2, s*1.5, s*.35)
                  : ctx.rect(x+ox-s, y-s-s*.5, s*2, s*1.5);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x+ox-s*.35, y+s*.95); ctx.lineTo(x+ox+s*.2, y+s*.05); ctx.lineTo(x+ox-s*.6, y+s*.05);
    ctx.closePath(); ctx.fill();
  }

  griffeZeichnen();

  if (showNames){
    ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.lineWidth = 3;
    for (let i=0;i<MAP.n.length;i++){
      const n = MAP.n[i], cap = isCap(i), obj = isObj(i);
      const min = cap ? 0 : (obj ? 1.7 : 3.4);
      if (z < min && i !== sel) continue;
      if (objOnly && !obj && !S.owner[i]) continue;
      const [x,y] = toScr(n[1], n[2]);
      if (x < -70 || y < -20 || x > WW+10 || y > HH+20) continue;
      const gr = (cap ? Math.min(15, 9.6*Math.sqrt(z)) : Math.min(13, 8.4*Math.sqrt(z))) * uiScale;
      ctx.font = `${cap?"600 ":""}${gr}px "Segoe UI",system-ui,sans-serif`;
      ctx.strokeStyle = light() ? "rgba(255,255,255,.92)" : "rgba(5,8,12,.92)";
      ctx.fillStyle = cap ? "#f0c169" : (light() ? "#1a2029" : "#e6ecf4");
      const dx = (cap ? r0*1.9 : (obj ? r0*1.35 : r0)) + 5;
      ctx.strokeText(n[0], x+dx, y); ctx.fillText(n[0], x+dx, y);
    }
  }
}

/* Pictogram inside the disc: town, factory, airfield — like the game's map */
function pictogram(x,y,r,typ,cap,farbe){
  const s = r*0.62;
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle = farbe; ctx.fillStyle = farbe;
  ctx.lineWidth = Math.max(.9, r*0.17); ctx.lineJoin = "round";
  if (cap){                                    // star
    ctx.beginPath();
    for (let k=0;k<10;k++){
      const rr = k%2 ? s*0.45 : s, w = -Math.PI/2 + k*Math.PI/5;
      const px = Math.cos(w)*rr, py = Math.sin(w)*rr;
      k ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  } else if (typ === 2){                       // factory: roof teeth + chimney
    ctx.beginPath();
    ctx.moveTo(-s, s*.7); ctx.lineTo(-s, -s*.1); ctx.lineTo(-s*.2, s*.35);
    ctx.lineTo(-s*.2, -s*.1); ctx.lineTo(s*.6, s*.35); ctx.lineTo(s*.6, s*.7);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(s*.45, -s*.95, s*.3, s*.9);
  } else if (typ === 3 || typ === 4){          // airfield: plane
    ctx.beginPath();
    ctx.moveTo(0,-s); ctx.lineTo(s*.22,-s*.1); ctx.lineTo(s,-s*.1) ;ctx.lineTo(s,s*.16);
    ctx.lineTo(s*.22,s*.3); ctx.lineTo(s*.14,s*.72); ctx.lineTo(s*.42,s*.9);
    ctx.lineTo(-s*.42,s*.9); ctx.lineTo(-s*.14,s*.72); ctx.lineTo(-s*.22,s*.3);
    ctx.lineTo(-s,s*.16); ctx.lineTo(-s,-s*.1); ctx.lineTo(-s*.22,-s*.1);
    ctx.closePath(); ctx.fill();
  } else if (typ === 1){                       // mountain town
    ctx.beginPath();
    ctx.moveTo(-s, s*.6); ctx.lineTo(-s*.2, -s*.5); ctx.lineTo(s*.25, s*.15);
    ctx.lineTo(s*.55, -s*.25); ctx.lineTo(s, s*.6);
    ctx.closePath(); ctx.fill();
  } else {                                     // town: little houses
    ctx.beginPath();
    ctx.moveTo(-s, s*.65); ctx.lineTo(-s, -s*.1); ctx.lineTo(-s*.45, -s*.6);
    ctx.lineTo(s*.1, -s*.1); ctx.lineTo(s*.1, s*.65);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(s*.22, s*.05, s*.66, s*.6);
  }
  ctx.restore();
}

/* Free-hand area — circle a region and say what is in it. */
function drawArea(a, eintrag, entwurf){
  if (!a || !Array.isArray(a.pts) || a.pts.length < 3) return;
  const f = col(FACTIONS[a.f]);
  const p = a.pts.map(q => toScr(q[0], q[1]));
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]);
  for (let i=1;i<p.length;i++) ctx.lineTo(p[i][0], p[i][1]);
  ctx.closePath();
  ctx.globalAlpha = entwurf ? .18 : .14; ctx.fillStyle = f; ctx.fill();
  ctx.globalAlpha = entwurf ? .95 : .8;
  ctx.strokeStyle = f; ctx.lineWidth = 2*uiScale;
  ctx.setLineDash(entwurf ? [5,4] : [9,5]); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  if (a.label && !entwurf){
    let cx = 0, cy = 0;
    for (const q of p){ cx += q[0]; cy += q[1]; }
    cx /= p.length; cy /= p.length;
    const gr = Math.min(16, 9*Math.sqrt(view.z))*uiScale;
    ctx.font = `600 ${gr}px ${SCHMAL}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const bw = ctx.measureText(a.label).width + 14*uiScale, bh = gr*1.7;
    ctx.fillStyle = "rgba(14,10,6,.85)"; ctx.fillRect(cx-bw/2, cy-bh/2, bw, bh);
    ctx.strokeStyle = f; ctx.lineWidth = 1.2; ctx.strokeRect(cx-bw/2, cy-bh/2, bw, bh);
    ctx.fillStyle = "#f4ead9"; ctx.fillText(a.label, cx, cy);
    if (eintrag && view.z > 1.6){
      ctx.font = `${gr*0.72}px ${SCHMAL}`; ctx.fillStyle = "rgba(240,232,216,.6)";
      ctx.fillText(`${eintrag.n || eintrag.by} · ${alterText(eintrag.t)}`, cx, cy + bh*0.9);
    }
  }
}

/* Defence line: thick line through towns with tick marks on one side,
   the way a held position is drawn on a military map. */
function drawLine(l, bisMaus){
  if (!l || !Array.isArray(l.pts)) return;
  const pts = l.pts.map(i => MAP.n[i] ? toScr(MAP.n[i][1], MAP.n[i][2]) : null).filter(Boolean);
  if (bisMaus) pts.push(bisMaus);
  if (pts.length < 2) return;
  const f = col(FACTIONS[l.f]);
  const br = Math.max(2.6, 3*Math.sqrt(view.z))*uiScale;
  ctx.strokeStyle = f; ctx.lineWidth = br; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  const zacke = br*1.9;
  ctx.lineWidth = Math.max(1.6, br*0.6);
  for (let i=0;i<pts.length-1;i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1;
    const nx = -dy/len, ny = dx/len;
    const schritte = Math.max(1, Math.floor(len/(zacke*2.6)));
    for (let s=0;s<schritte;s++){
      const t = (s+0.5)/schritte, mx = x1+dx*t, my = y1+dy*t;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx+nx*zacke, my+ny*zacke); ctx.stroke();
    }
  }
  if (l.label && view.z > 1.2){
    const [mx,my] = pts[Math.floor(pts.length/2)];
    ctx.font = `600 ${Math.min(13, 8*Math.sqrt(view.z))*uiScale}px "Segoe UI",system-ui,sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(5,8,12,.85)";
    ctx.strokeText(l.label, mx, my - 14); ctx.fillStyle = f; ctx.fillText(l.label, mx, my - 14);
  }
}

/* A movement arrow is one filled body that tapers into a broad head — the
   shape used on operational maps — not a stroked line with a triangle stuck
   on the end. It widens with what the clan has committed to it. */
const SCHMAL = '"Bahnschrift Condensed","Bahnschrift","Arial Narrow","Segoe UI",system-ui,sans-serif';
function pfeilForm(x1,y1,cx,cy,x2,y2,breite){
  const B  = t => [ (1-t)*(1-t)*x1 + 2*(1-t)*t*cx + t*t*x2,
                    (1-t)*(1-t)*y1 + 2*(1-t)*t*cy + t*t*y2 ];
  const Bs = t => { const dx = 2*(1-t)*(cx-x1) + 2*t*(x2-cx),
                          dy = 2*(1-t)*(cy-y1) + 2*t*(y2-cy);
                    const l = Math.hypot(dx,dy)||1; return [dx/l, dy/l]; };
  const kopf = 0.80, N = 20, links = [], rechts = [];
  for (let i=0;i<=N;i++){
    const t = kopf*i/N, [px,py] = B(t), [ux,uy] = Bs(t), w = breite*(1 - 0.28*t);
    links.push([px - uy*w, py + ux*w]);
    rechts.push([px + uy*w, py - ux*w]);
  }
  const [hx,hy] = B(kopf), [hux,huy] = Bs(kopf), kb = breite*2.5;
  const p = new Path2D();
  p.moveTo(links[0][0], links[0][1]);
  for (const q of links) p.lineTo(q[0], q[1]);
  p.lineTo(hx - huy*kb, hy + hux*kb);          // linke Schulter
  p.lineTo(x2, y2);                             // Spitze
  p.lineTo(hx + huy*kb, hy - hux*kb);          // rechte Schulter
  for (let i=rechts.length-1;i>=0;i--) p.lineTo(rechts[i][0], rechts[i][1]);
  p.closePath();
  return p;
}
function drawArrow(a){
  const A = MAP.n[a.from], B = MAP.n[a.to];
  if (!A || !B) return;
  let [x1,y1] = toScr(A[1],A[2]);
  let [x2,y2] = toScr(B[1],B[2]);
  const f = col(FACTIONS[a.f]);
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy) || 1;
  if (len < 8) return;
  const ux = dx/len, uy = dy/len;
  const rand = Math.max(4, 3.4*Math.sqrt(view.z))*uiScale;   // nicht im Stadtsymbol ansetzen
  x1 += ux*rand; y1 += uy*rand; x2 -= ux*rand*1.25; y2 -= uy*rand*1.25;
  const cx = (x1+x2)/2 - dy/len*len*.16, cy = (y1+y2)/2 + dx/len*len*.16;

  const mit = joinOf(a.id), staerke = mit.reduce((s,j)=>s+j.n, 0);
  const breite = Math.max(2.2, (2.2 + Math.min(staerke,24)*0.42)*Math.sqrt(view.z))*uiScale;
  const pfad = pfeilForm(x1,y1,cx,cy,x2,y2,breite);
  pfadVon.set(a.id, pfad);
  const mitte = [];                       // fuer die Trefferpruefung, siehe griffTol
  for (let i=0;i<=12;i++){
    const t = i/12, u = 1-t;
    mitte.push([u*u*x1 + 2*u*t*cx + t*t*x2, u*u*y1 + 2*u*t*cy + t*t*y2]);
  }
  mitteVon.set(a.id, mitte);

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 1.5;
  ctx.globalAlpha = .9; ctx.fillStyle = f; ctx.fill(pfad);
  ctx.restore();
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1.1; ctx.stroke(pfad);

  if (view.z > 1.1 && (staerke || a.label)){
    const txt = (a.label ? a.label + "   " : "") + (staerke ? `${mit.length}× ${staerke}` : "");
    ctx.font = `600 ${Math.min(14, 8.4*Math.sqrt(view.z))*uiScale}px ${SCHMAL}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const bw = ctx.measureText(txt).width + 12*uiScale;
    const bh = Math.min(20, 13*Math.sqrt(view.z))*uiScale;
    const mx = (x1+x2)/2*.35 + cx*.65, my = (y1+y2)/2*.35 + cy*.65;
    ctx.fillStyle = "rgba(14,10,6,.9)";
    ctx.fillRect(mx-bw/2, my-bh/2, bw, bh);
    ctx.strokeStyle = f; ctx.lineWidth = 1.2;
    ctx.strokeRect(mx-bw/2, my-bh/2, bw, bh);
    ctx.fillStyle = "#f4ead9"; ctx.fillText(txt, mx, my);
  }
}
const joinOf = id => Object.keys(S.join)
  .filter(k => k.startsWith(id + ":") && imKrieg(S.join[k]) && S.join[k].v)
  .map(k => ({who: k.slice(id.length+1), n: S.join[k].v, name: S.join[k].n || "", mine: k.endsWith(":"+S.me)}));

function hitTest(sx, sy, alle){
  const [kx,ky] = toMap(sx,sy), lim = 14/view.z;
  let best = null, bd = Infinity;
  for (let i=0;i<MAP.n.length;i++){
    if (!alle && objOnly && !isObj(i) && !S.owner[i] && !unitsAt(i).length) continue;
    const d = Math.hypot(MAP.n[i][1]-kx, MAP.n[i][2]-ky);
    if (d < lim && d < bd){ bd = d; best = i; }
  }
  return best;
}
function arrowHit(sx, sy){
  for (const a of liveArrows()){
    const p = pfadVon.get(a.id);
    if (p instanceof Path2D && ctx.isPointInPath(p, sx*dpr, sy*dpr)) return a;
  }
  return null;
}
/* Pfeil in der Naehe, nicht nur genau im Koerper. */
function arrowNah(sx, sy, tol){
  let best = null, bd = Infinity;
  for (const a of liveArrows()){
    const p = mitteVon.get(a.id);
    if (!p) continue;
    for (let i=0;i<p.length-1;i++){
      const d = abstandZuSegment(sx, sy, p[i], p[i+1]);
      if (d < tol && d < bd){ bd = d; best = a; }
    }
  }
  return best;
}
function areaHit(sx, sy){
  const [kx,ky] = toMap(sx,sy);
  for (const [id,e] of liveAreas()){
    const p = e.v.pts;
    let drin = false;
    for (let i=0,j=p.length-1;i<p.length;j=i++){
      if ((p[i][1] > ky) !== (p[j][1] > ky) &&
          kx < (p[j][0]-p[i][0])*(ky-p[i][1])/(p[j][1]-p[i][1]) + p[i][0]) drin = !drin;
    }
    if (drin) return {id, e};
  }
  return null;
}

/* ---------------- editing arrows and defence lines ----------------
   Neither has to be deleted and drawn again when a plan shifts by one town.
   The object under the pointer grows grab handles: an arrow gets one at each
   end, a defence line one per town plus a small + between two towns to hang
   another town in. Only what you drew yourself — the database enforces the
   same rule, so handles on someone else's line would only mislead. */
function bearbeitbar(sx, sy){
  const tol = griffTol();
  const a = arrowHit(sx, sy) || arrowNah(sx, sy, tol);
  if (a && a.by === S.me) return {art:"arrow", id:a.id};
  const l = lineHit(sx, sy);
  if (l && l.e.by === S.me) return {art:"line", id:l.id};
  return null;
}
/* Wer einen Griff sucht, soll ihn aus der Umgebung greifen koennen und nicht
   erst den Pfeil selbst treffen muessen. Also zuerst nach Griffen aller
   eigenen Pfeile und Linien in Reichweite sehen. */
function griffNah(sx, sy){
  const R = 6.4*uiScale + 9;
  let best = null, bd = Infinity;
  const pruefe = ziel => {
    for (const g of griffeListe(ziel)){
      const d = Math.hypot(g.x-sx, g.y-sy);
      if (d < R && d < bd){ bd = d; best = ziel; }
    }
  };
  for (const a of liveArrows()) if (a.by === S.me) pruefe({art:"arrow", id:a.id});
  for (const [id,e] of liveLines()) if (e.by === S.me) pruefe({art:"line", id});
  return best;
}
function griffeListe(ziel){
  if (!ziel) return [];
  const raus = [];
  if (ziel.art === "arrow"){
    const a = liveArrows().find(q => q.id === ziel.id);
    if (!a || !MAP.n[a.from] || !MAP.n[a.to]) return [];
    const [x1,y1] = toScr(MAP.n[a.from][1], MAP.n[a.from][2]);
    const [x2,y2] = toScr(MAP.n[a.to][1],   MAP.n[a.to][2]);
    raus.push({x:x1, y:y1, kind:"from", idx:0}, {x:x2, y:y2, kind:"to", idx:1});
  } else {
    const e = S.line[ziel.id];
    if (!e || !e.v) return [];
    const p = e.v.pts.map(i => MAP.n[i] ? toScr(MAP.n[i][1], MAP.n[i][2]) : null);
    p.forEach((q,i)=>{ if (q) raus.push({x:q[0], y:q[1], kind:"pt", idx:i}); });
    for (let i=0;i<p.length-1;i++)
      if (p[i] && p[i+1])
        raus.push({x:(p[i][0]+p[i+1][0])/2, y:(p[i][1]+p[i+1][1])/2, kind:"mid", idx:i});
  }
  return raus;
}
function griffTreffer(sx, sy, ziel){
  const R = 6.4*uiScale + 9;
  let best = null, bd = Infinity;
  for (const g of griffeListe(ziel || hoverObj)){
    const d = Math.hypot(g.x-sx, g.y-sy);
    if (d < R && d < bd){ bd = d; best = g; }
  }
  return best;
}
/* Which object should show handles: whatever lies under the pointer — but
   once its handles are out, staying near one of them keeps them there,
   otherwise they would vanish the moment you reach for one. */
function hoverZiel(sx, sy){
  if (tool !== "inspect") return null;
  if (hoverObj && griffTreffer(sx, sy, hoverObj)) return hoverObj;
  return griffNah(sx, sy) || bearbeitbar(sx, sy);
}
function griffeZeichnen(){
  const ziel = editing || hoverObj;
  const li = griffeListe(ziel);
  if (!li.length) return;
  const R = 6.4*uiScale;
  ctx.save();
  for (const g of li){
    const aktiv = editing && editing.kind === g.kind && editing.idx === g.idx;
    if (g.kind === "mid"){
      ctx.beginPath(); ctx.arc(g.x, g.y, R*0.74, 0, 6.284);
      ctx.fillStyle = "rgba(14,10,6,.72)"; ctx.fill();
      ctx.strokeStyle = "#e2ac48"; ctx.lineWidth = 1.1*uiScale;
      ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
      ctx.lineWidth = 1.4*uiScale;
      ctx.beginPath();
      ctx.moveTo(g.x-R*0.36, g.y); ctx.lineTo(g.x+R*0.36, g.y);
      ctx.moveTo(g.x, g.y-R*0.36); ctx.lineTo(g.x, g.y+R*0.36);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(g.x, g.y, aktiv ? R*1.25 : R, 0, 6.284);
      ctx.fillStyle = aktiv ? "#ffe6ad" : "#f4ead9"; ctx.fill();
      ctx.strokeStyle = "rgba(5,8,12,.9)"; ctx.lineWidth = 1.6*uiScale; ctx.stroke();
      ctx.strokeStyle = "#8a6820"; ctx.lineWidth = 1.3*uiScale;
      ctx.beginPath(); ctx.arc(g.x, g.y, R*0.52, 0, 6.284); ctx.stroke();
    }
  }
  if (editing && lastMouse){
    const start = li.find(g => g.kind === editing.kind && g.idx === editing.idx);
    if (start){
      ctx.strokeStyle = "#e2ac48"; ctx.lineWidth = 1.6*uiScale; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.lineTo(lastMouse[0], lastMouse[1]);
      ctx.stroke(); ctx.setLineDash([]);
    }
    const t = hitTest(lastMouse[0], lastMouse[1], true);
    if (t !== null){
      const [tx,ty] = toScr(MAP.n[t][1], MAP.n[t][2]);
      ctx.strokeStyle = "#ffe6ad"; ctx.lineWidth = 2.2*uiScale;
      ctx.beginPath(); ctx.arc(tx, ty, 9*uiScale, 0, 6.284); ctx.stroke();
    }
  }
  ctx.restore();
}
/* Dropped on a town it moves there; dropped on empty ground a line point is
   taken out — that is the one gesture people reach for anyway. */
function griffLoslassen(x, y){
  const ed = editing; editing = null;
  if (!ed) return;
  /* Beim Ziehen eines Griffs zaehlt jede Stadt, auch eine vom Objektfilter
     ausgeblendete - sonst wuerde ein Verschieben stillschweigend zum
     Entfernen. */
  const ziel = hitTest(x, y, true);
  if (ed.art === "arrow"){
    const a = liveArrows().find(q => q.id === ed.id);
    if (!a) return;
    if (ziel === null){ toast("Drop the end of an arrow on a town."); return; }
    const von = ed.kind === "from" ? ziel : a.from;
    const bis = ed.kind === "to"   ? ziel : a.to;
    if (von === bis){ toast("An arrow needs two different towns."); return; }
    if (von === a.from && bis === a.to) return;
    a.from = von; a.to = bis; a.t = jetzt();
    dirty.add(`arrow:${a.id}`); save();
    toast(`${MAP.n[von][0]} → ${MAP.n[bis][0]}`);
    return;
  }
  const e = S.line[ed.id];
  if (!e || !e.v) return;
  const pts = e.v.pts.slice();
  if (ed.kind === "mid"){
    if (ziel === null) return;
    if (pts.includes(ziel)){ toast("That town is already on this line."); return; }
    pts.splice(ed.idx+1, 0, ziel);
    toast(`${MAP.n[ziel][0]} hung into the line`);
  } else if (ziel === null){
    if (pts.length <= 2){ toast("A defence line needs at least two towns."); return; }
    pts.splice(ed.idx, 1);
    toast("Town taken out of the line");
  } else {
    if (pts[ed.idx] === ziel) return;
    if (pts.includes(ziel)){ toast("That town is already on this line."); return; }
    pts[ed.idx] = ziel;
  }
  S.line[ed.id] = {v:{...e.v, pts}, t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`line:${ed.id}`); save();
}

/* ---------------- state writes ---------------- */
const dirty = new Set();
function stamp(bucket, i, val, extra){
  S[bucket][i] = Object.assign({v:val, t:jetzt(), by:S.me}, extra||{});
  dirty.add(`${bucket}:${i}`);
}
/* Gebuendeltes Speichern. save() lief frueher bei jedem einzelnen Eintrag
   und schrieb jedes Mal den ganzen Zustand - gemessen 302 ms fuer 200
   Spieler, gegenueber 1 ms ohne. Bei Tausenden von Spielern stand die Karte.
   Jetzt sammelt sich das und geht hoechstens alle 250 Tausendstel raus;
   beim Verlassen der Seite sofort, damit nichts verlorengeht. */
let sparUhr = null, sparOffen = false, sparWarnung = false;
function saveSofort(){
  sparOffen = false;
  if (sparUhr){ clearTimeout(sparUhr); sparUhr = null; }
  try {
    const roh = JSON.stringify(S);
    localStorage.setItem(STORE, roh);
    /* Fuenf Megabyte sind die uebliche Grenze des Browserspeichers. Einmal
       warnen, bevor sie erreicht ist - danach kaeme nur noch ein stiller
       Fehlschlag. */
    if (!sparWarnung && roh.length > 4.2e6){
      sparWarnung = true;
      toast("Local storage is nearly full — save a backup file.");
    }
  } catch(e){
    if (!sparWarnung){
      sparWarnung = true;
      toast("This browser will not store any more. Save a backup file now.");
    }
  }
}
function save(){
  sparOffen = true;
  if (sparUhr) return;
  sparUhr = setTimeout(()=>{ sparUhr = null; if (sparOffen) saveSofort(); }, 250);
}
addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "hidden" && sparOffen) saveSofort(); });
addEventListener("pagehide", ()=>{ if (sparOffen) saveSofort(); });
function setOwner(i, f){ stamp("owner", i, f); save(); }
function setFight(i, an){ stamp("fight", i, an ? 1 : null); save(); }
function dropArrow(id){ S.gone[id] = {t:jetzt(), by:S.me}; dirty.add(`gone:${id}`); }
function setMyUnits(i, list){
  S.units[`${i}:${S.me}`] = {v: list.length ? list : null, t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`units:${i}:${S.me}`); rebuildUnits(); save(); kraftLeiste();
}
/* Teams, Verlauf und Soldaten liegen in derselben Zeile - dieselbe
   Schreibregel der Datenbank gilt dann fuer alles, was einem gehoert. Wer nur
   das eine aendert, darf das andere nicht mitloeschen. */
function depotSchreiben(felder){
  const alt = S.depot[S.me] || {};
  const liste = felder.list !== undefined ? felder.list
                                          : (Array.isArray(alt.v) ? alt.v : []);
  const arms  = soldatenListe(felder.arms !== undefined ? felder.arms : alt.arms);
  const f = aktiveSeite();
  const hf = Object.assign({}, alt.hf);
  hf[f] = verlaufFort(alt, aufSeite(depotListe(liste), f), f);
  /* Namen heraustrennen - geteilt wird nur, WAS jemand hat. */
  const ohneNamen = namenTrennen(depotListe(liste));
  namenSichern();
  S.depot[S.me] = {v: ohneNamen, t: jetzt(), by: S.me, n: S.name || "", hf, arms};
  dirty.add(`depot:${S.me}`); rebuildUnits(); save(); kraftLeiste();
}
/* Beim Schreiben bleiben die anderen beiden Depots unangetastet, und was neu
   dazukommt, bekommt die eingestellte Seite eingetragen. */
function setMyDepot(list){
  const f = aktiveSeite();
  const fremd = myDepotAlle().filter(d => { const s = seiteVon(d); return s !== null && s !== f; });
  const eigen = (list || []).map(d => seiteVon(d) === null ? {...d, f} : d);
  depotSchreiben({list: fremd.concat(eigen)});
}
function setMyArms(arms){
  if (anonAn()) anonSchreiben(arms); else depotSchreiben({arms});
}
function setJoin(arrowId, n){

function setSpot(town, list){

/* Free-form strength notes — "~1000 infantry". A sighting of assault teams is

function estAt(i){

  }

}
const myEst = i => (imKrieg(S.est[`${i}:${S.me}`]) && S.est[`${i}:${S.me}`].v) || [];
function setEst(town, list){

/* Para-blocking: denying an airfield's drop zone. Strategically decisive, so
   it gets its own mark — either already in place or planned. */
function setPara(town, f, plan){

const paraAt = i => (imKrieg(S.para[i]) && S.para[i].v) || null;
const allPara = () => Object.keys(S.para).filter(i => imKrieg(S.para[i]) && S.para[i].v)
  .map(i => ({town:+i, ...S.para[i].v, t:S.para[i].t, by:S.para[i].n || S.para[i].by}));
function addPost(text, town, prio, req){

function dropEntry(bucket, id){

function lineSpeichern(pts){
  const id = Math.random().toString(36).slice(2,10), k = `${id}:${S.me}`;
  S.line[k] = {v:{pts, f: faction, label: ""}, t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`line:${k}`); save(); draw();
  toast(`Defence line over ${pts.length} towns — click it to label it`);
}
function areaSpeichern(pts){
  const id = Math.random().toString(36).slice(2,10), k = `${id}:${S.me}`;
  const rund = pts.map(p => [Math.round(p[0]*10)/10, Math.round(p[1]*10)/10]);
  S.area[k] = {v:{pts: rund, f: faction, label: ""}, t: jetzt(), by: S.me, n: S.name || ""};
  dirty.add(`area:${k}`); save(); draw();
  areaDialog(k, S.area[k], true);
}
function lineFertig(){
  if (!lineDraft) return;
  if (lineDraft.pts.length >= 2) lineSpeichern(lineDraft.pts);
  else toast("A defence line needs at least two towns");
  lineDraft = null; draw();
}
function lineHit(sx, sy){
  for (const [id,e] of liveLines()){
    const pts = e.v.pts.map(i => MAP.n[i] ? toScr(MAP.n[i][1], MAP.n[i][2]) : null).filter(Boolean);
    for (let i=0;i<pts.length-1;i++)
      if (abstandZuSegment(sx, sy, pts[i], pts[i+1]) < griffTol()) return {id, e};
  }
  return null;
}
function setMeta(k, v){ stamp("meta", k, v); save(); kopfzeile(); }

/* Einen neuen Krieg beginnen. Fort muss alles, was zu diesem Krieg gehoert -
   Besitz, Schlachten, aufgestellte Einheiten, Pfeile, Linien, Brett und
   Sichtungen. Bleiben muss alles, was ueber Kriege hinweg waechst: das Depot
   mit dem Verlauf, das Arsenal, die Spielerliste und das Feinddepot. Es gibt
   in der Anwendung keinen Knopf, der diese vier loescht. */
/* ---- Startstaedte ----------------------------------------------------
   Womit eine Seite in den Krieg geht. Die Vorgabe kommt aus den Spieldateien:
   Feld 5 einer Stadtzeile traegt 1/2/3 fuer US/GE/UdSSR - London City,
   Copenhagen, Budapest. Mehrere je Seite sind moeglich, deshalb je Fraktion
   eine Liste. */
function startVorgabe(){
  const r = {0:null, 1:null, 2:null};
  MAP.n.forEach((n,i) => { if (n[4] > 0 && n[4] <= 3) r[n[4]-1] = i; });
  return r;
}
function startStaedte(){
  const vor = startVorgabe();
  const e = S.meta.start;
  if (!e || !e.v) return vor;
  const r = {0:null, 1:null, 2:null};
  for (const f of [0,1,2]){
    /* Die fruehere Fassung speicherte eine Liste je Seite - der erste Eintrag
       daraus gilt weiter, damit ein gespeicherter Stand nicht leer dasteht. */
    let w = e.v[f] !== undefined ? e.v[f] : e.v[String(f)];
    if (Array.isArray(w)) w = w.length ? w[0] : null;
    w = (w === null || w === undefined) ? null : Number(w);
    r[f] = (w !== null && MAP.n[w]) ? w : vor[f];
  }
  return r;
}
const setStartStaedte = o => setMeta("start", o);

const KRIEG_BLEIBT = ["depot", "roster", "edep", "meta"];
function neuerKrieg(){
  const linien = liveLines().map(([id]) => id);
  const briefe = livePosts().map(([id]) => id);
  const zonen  = liveAreas().map(([id]) => id);
  const pfeile = liveArrows().map(a => a.id);
  /* Der Strich wird an den neuesten vorhandenen Eintrag gelegt und nicht
     blind an die eigene Uhr. Geht die naemlich vor, waeren sonst auch alle
     Eintraege unsichtbar, die danach von anderen kommen - und niemand
     saehe, woran es liegt. */
  let neuester = 0;
  for (const b of BUCKETS){
    if (KRIEG_BLEIBT.includes(b)) continue;
    for (const k of Object.keys(S[b])) neuester = Math.max(neuester, (S[b][k]||{}).t || 0);
  }
  for (const a of S.arrows) neuester = Math.max(neuester, (a||{}).t || 0);
  setMeta("epoch", Math.min(jetzt(), neuester + 1));
  /* Die Startstaedte gehoeren von Anfang an ihrer Seite. Sie werden NICHT
     erst geleert und dann neu gesetzt: beides traegt denselben Zeitstempel,
     und bei Gleichstand entschiede der Zufall, ob bei den anderen im Clan die
     Loeschung oder der Besitz ankommt. Also genau ein Eintrag je Stadt. */
  const startBei = new Map();
  const stst = startStaedte();
  for (const f of [0,1,2]) if (stst[f] != null) startBei.set(String(stst[f]), f);
  for (const b of ["owner", "fight", "star", "notes", "para"])
    for (const id of Object.keys(S[b])){
      if (b === "owner" && startBei.has(id)) continue;
      if (S[b][id] && S[b][id].v != null) stamp(b, id, null);
    }
  for (const [id, f] of startBei) stamp("owner", id, f);
  /* Fremde Reihen weist der Server ab - das ist gewollt. Ihre Eintraege sind
     ueber den Zeitstempel oben ohnehin schon aus dem Bild. */
  for (const b of ["units", "join", "spot", "est"])
    for (const k of Object.keys(S[b])) if (k.endsWith(":"+S.me) && S[b][k] && S[b][k].v != null){
      S[b][k] = {v:null, t:jetzt(), by:S.me, n:S.name||""}; dirty.add(`${b}:${k}`);
    }
  for (const id of linien) dropEntry("line", id);
  for (const id of briefe) dropEntry("post", id);
  for (const id of zonen)  dropEntry("area", id);
  for (const id of pfeile) dropArrow(id);
}

/* Deploy one named team. It can only be in one place, so it is pulled off
   wherever it stood before. */
function deployTeam(town, id){
  const team = teamById(id);
  if (!team) return false;
  const alt = townOfTeam(id);
  if (alt === town) return false;
  if (alt !== null) setMyUnits(alt, myUnits(alt).filter(u => u.id !== id));
  setMyUnits(town, myUnits(town).concat([{id, k: team.k, s: 1}]));
  return true;
}
function withdrawTeam(id){
  const alt = townOfTeam(id);
  if (alt !== null) setMyUnits(alt, myUnits(alt).filter(u => u.id !== id));
}

/* ---------------- interaction ----------------
   Everything that has a from and a to is drawn by dragging: arrows, defence
   lines and free-hand areas. Only panning shares the same gesture, so a drag
   that starts on empty ground pans and one that starts on a town draws.   */
let dragging = false, dragged = false, dragStart = null;
let carrying = null;                       // {k,id} while dragging from the depot
let zieh = null;                           // {art, von, pts}

cv.addEventListener("mousedown", e => {
  if (carrying) return;
  dragged = false;                    // jeder Weg hier setzt das zurueck
  if (tool === "inspect" && hoverObj){          // an einem Griff angefasst
    const g = griffTreffer(e.offsetX, e.offsetY);
    if (g){
      editing = {art: hoverObj.art, id: hoverObj.id, kind: g.kind, idx: g.idx,
                 x0: e.offsetX, y0: e.offsetY};
      draw(); return;
    }
  }
  const i = hitTest(e.offsetX, e.offsetY);
  if (tool === "arrow" && i !== null){ zieh = {art:"arrow", von:i}; return; }
  if (tool === "line"  && i !== null){ zieh = {art:"line", pts:[i]}; return; }
  if (tool === "para"  && i !== null){ zieh = {art:"para", pts:[i]}; return; }
  if (tool === "area"){ zieh = {art:"area", pts:[toMap(e.offsetX, e.offsetY)]}; return; }
  dragging = true; dragged = false;
  dragStart = {mx:e.offsetX, my:e.offsetY, vx:view.x, vy:view.y};
});
/* Hover card — what is at this town without having to click it */
const hover = document.getElementById("hover");
let hoverIdx = null, hoverTimer = null;
function hoverZeigen(i, mx, my){
  if (i === null){ hover.style.display = "none"; hoverIdx = null; return; }
  if (i === hoverIdx){ hover.style.left = (mx+16)+"px"; hover.style.top = (my+14)+"px"; return; }
  hoverIdx = i;
  const n = MAP.n[i], f = factionOf(i), gr = unitsAt(i), sp = spotsAt(i);
  const teams = teamsAt(i), sch = estAt(i), pb = S.para[i] && S.para[i].v;
  hover.innerHTML = `
    <div class="h-name">${esc(n[0])}</div>
    <div class="h-sub">${esc(MAP.typen[n[3]])}${isCap(i)?" · capital":""}
      · <span style="color:${col(f)}">${f.name}</span></div>
    ${starAt(i)||fightAt(i)||pb ? `<div class="h-tags">
      ${starAt(i)?'<span class="chip">key</span>':""}
      ${fightAt(i)?'<span class="chip fight">⚔ contested</span>':""}
      ${pb?`<span class="chip" style="border-color:var(--accent);color:var(--accent)">para ${pb.plan?"planned":"blocked"}</span>`:""}
    </div>`:""}
    ${teams ? `<div class="h-row"><b>${teams}</b> own teams · ${menAt(i).toLocaleString("en")} men
      <em>${gr.map(g=>esc(g.mine?"you":g.name||g.who)).join(", ")}</em></div>` : ""}
    ${sp.length ? `<div class="h-row h-warn"><b>${sp.reduce((s,g)=>s+g.list.reduce((t,u)=>t+(u.n||0),0),0)}</b>
      enemy reported <em>${alterText(Math.max(...sp.map(g=>g.t)))}</em>
      ${clansAt(i).length ? `<em style="color:var(--accent)">clan: ${clansAt(i).map(c=>esc(c.name)).join(", ")}</em>` : ""}</div>` : ""}
    ${sch.length ? `<div class="h-row">${sch.map(x=>esc(x.text)).join(" · ")}</div>` : ""}
    ${noteOf(i) ? `<div class="h-row h-note">${esc(noteOf(i).slice(0,90))}</div>` : ""}
    <div class="h-hint">click for detail</div>`;
  hover.style.display = "block";
  hover.style.left = (mx+16)+"px"; hover.style.top = (my+14)+"px";
}

cv.addEventListener("mouseleave", ()=>{
  hover.style.display = "none"; hoverIdx = null;
  if (!editing && hoverObj){ hoverObj = null; cv.classList.remove("griff"); draw(); }
});
cv.addEventListener("mousemove", e => {
  lastMouse = [e.offsetX, e.offsetY];
  if (editing){ hoverZeigen(null); draw(); return; }
  if (!dragging && !zieh && !carrying){
    clearTimeout(hoverTimer);
    const zi = hoverZiel(e.offsetX, e.offsetY);
    const anders = (zi ? zi.id : null) !== (hoverObj ? hoverObj.id : null);
    hoverObj = zi;
    cv.classList.toggle("griff", !!(zi && griffTreffer(e.offsetX, e.offsetY)));
    if (anders) draw();
    const i = hitTest(e.offsetX, e.offsetY);
    if (i === null) hoverZeigen(null);
    else {
      const r = cv.getBoundingClientRect();
      hoverTimer = setTimeout(()=>hoverZeigen(i, r.left + e.offsetX, r.top + e.offsetY), i === hoverIdx ? 0 : 90);
    }
  } else { hoverZeigen(null); if (hoverObj){ hoverObj = null; cv.classList.remove("griff"); } }
  if (zieh){
    if (zieh.art === "line" || zieh.art === "para"){
      const i = hitTest(e.offsetX, e.offsetY);
      if (i !== null && zieh.pts[zieh.pts.length-1] !== i && !zieh.pts.includes(i)) zieh.pts.push(i);
    } else if (zieh.art === "area"){
      const p = toMap(e.offsetX, e.offsetY), l = zieh.pts[zieh.pts.length-1];
      if (Math.hypot(p[0]-l[0], p[1]-l[1]) > 3/view.z) zieh.pts.push(p);
    }
    draw(); return;
  }
  if (dragging){
    const dx = e.offsetX-dragStart.mx, dy = e.offsetY-dragStart.my;
    if (Math.abs(dx)+Math.abs(dy) > 3){
      dragged = true; cv.classList.add("grabbing");
      view.x = dragStart.vx+dx; view.y = dragStart.vy+dy; draw();
    }
  } else if (arrowFrom !== null) draw();
});
window.addEventListener("mouseup", e => {
  dragging = false; cv.classList.remove("grabbing");
  if (editing){
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    /* Ein Griff auf einem Stuetzpunkt liegt genau auf der Stadt. Wer nur
       klickt, ohne zu ziehen, wollte die Stadt ansehen - dann den Klick
       durchlassen statt ihn zu verschlucken. */
    if (Math.hypot(x - editing.x0, y - editing.y0) < 4){ editing = null; draw(); return; }
    /* Loslassen ausserhalb der Karte heisst abbrechen, nicht loeschen — sonst
       kostet ein Rutsch auf die Depotleiste einen Stuetzpunkt. */
    if (x < 0 || y < 0 || x > r.width || y > r.height) editing = null;
    else griffLoslassen(x, y);
    dragged = true;                       // den folgenden Klick verschlucken
    draw(); side(); return;
  }
  if (!zieh) return;
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (zieh.art === "arrow"){
    const bis = hitTest(x, y);
    if (bis !== null && bis !== zieh.von){
      const id = Math.random().toString(36).slice(2,10);
      S.arrows.push({from:zieh.von, to:bis, f:faction, label:"", t:jetzt(), by:S.me, id});
      dirty.add(`arrow:${id}`); save();
      toast(`${MAP.n[zieh.von][0]} → ${MAP.n[bis][0]}`);
    }
  } else if (zieh.art === "para"){
    for (const p of zieh.pts) setPara(p, faction, paraGeplant);
    toast(`${zieh.pts.length} town${zieh.pts.length===1?"":"s"} marked para-blocked`);
    side();
  } else if (zieh.art === "line"){
    if (zieh.pts.length >= 2) lineSpeichern(zieh.pts);
    else toast("Drag across at least two towns");
  } else if (zieh.art === "area"){
    if (zieh.pts.length >= 6) areaSpeichern(zieh.pts);
    setTool("inspect");          // one report, then back to the normal pointer
  }
  zieh = null; draw(); tally();
});
cv.addEventListener("click", e => {
  if (dragged) return;
  if (tool === "inspect" && hitTest(e.offsetX, e.offsetY) === null){
    /* Liegt eine Stadt unter dem Zeiger, gewinnt sie - sonst verschluckt ein
       darueberliegender Pfeil den Klick. Liegt keine da, darf es grosszuegig
       zugehen: der Pfeilkoerper ist an der Spitze nur Nadelbreite. */
    const pfeil = arrowHit(e.offsetX, e.offsetY) || arrowNah(e.offsetX, e.offsetY, griffTol());
    if (pfeil){ arrowDialog(pfeil); return; }
    const lin = lineHit(e.offsetX, e.offsetY);
    if (lin){ lineDialog(lin.id, lin.e); return; }
    const ar = areaHit(e.offsetX, e.offsetY);
    if (ar){ areaDialog(ar.id, ar.e); return; }
  }
  const i = hitTest(e.offsetX, e.offsetY);
  if (i === null){
    if (tool === "arrow" && arrowFrom !== null){ arrowFrom = null; draw(); }
    else { sel = null; side(); draw(); }
    return;
  }
  if (tool === "owner"){
    setOwner(i, ownerOf(i) === faction ? -1 : faction); sel = i;
  } else if (tool === "unit"){
    sel = i; side(); setTimeout(()=>document.getElementById("u-type")?.focus(), 30);
  } else if (tool === "arrow"){
    if (arrowFrom === null) arrowFrom = i;
    else if (arrowFrom !== i){
      const id = Math.random().toString(36).slice(2,10);
      S.arrows.push({from:arrowFrom, to:i, f:faction, label:"", t:jetzt(), by:S.me, id});
      dirty.add(`arrow:${id}`); arrowFrom = null; save();
    }
  } else if (tool === "line"){
    if (!lineDraft) lineDraft = {pts:[], f:faction};
    if (lineDraft.pts[lineDraft.pts.length-1] === i) lineFertig();
    else { lineDraft.pts.push(i); toast(`${lineDraft.pts.length} towns — Enter or click the last one again to finish`); }
  } else if (tool === "spot"){
    sel = i; side(); setTimeout(()=>document.getElementById("sp-type")?.focus(), 30);
  } else if (tool === "battle"){
    setFight(i, !fightAt(i)); sel = i;
  } else if (tool === "erase"){
    stamp("owner", i, -1); stamp("notes", i, null); setFight(i, false);
    stamp("star", i, null); setSpot(i, []);
    setMyUnits(i, []);
    for (const a of liveArrows()) if ((a.from === i || a.to === i) && a.by === S.me) dropArrow(a.id);
    sel = i; save();
  } else sel = i;
  side(); draw(); tally();
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.16 : 1/1.16;
  const nz = Math.max(.35, Math.min(26, view.z*f)), t = nz/view.z;
  view.x = e.offsetX-(e.offsetX-view.x)*t; view.y = e.offsetY-(e.offsetY-view.y)*t;
  view.z = nz; draw();
}, {passive:false});

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){ if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key.toLowerCase();
  const t = {"1":"inspect","2":"owner","3":"unit","4":"arrow","5":"line","6":"para",
             "7":"area","8":"spot","9":"battle","0":"erase"}[e.key];
  if (t){ setTool(t); return; }
  if (k === "b"){ document.getElementById("b-board").click(); return; }
  if (k === "p"){ paraGeplant = !paraGeplant; tips();
    toast(paraGeplant ? "Para-block: marking as PLANNED" : "Para-block: marking as in place"); return; }
  if (k === "enter" && lineDraft){ lineFertig(); return; }
  if (k === "q"){ setFaction(0); return; }
  if (k === "w"){ setFaction(1); return; }
  if (k === "e"){ setFaction(2); return; }
  if (k === "i"){ document.getElementById("b-intel").click(); return; }
  if (k === "c"){ document.getElementById("b-clan").click(); return; }
  if (k === "a"){ document.getElementById("b-arms").click(); return; }
  if (k === "d"){ document.getElementById("b-depot").click(); return; }
  if (k === "o"){ document.getElementById("b-obj").click(); return; }
  if (k === "n"){ document.getElementById("b-names").click(); return; }
  if (k === "l"){ document.getElementById("b-key").click(); return; }
  if (k === "escape"){
    if (document.getElementById("veil").classList.contains("on")) closeDlg();
    else if (editing){ editing = null; draw(); }
    else if (arrowFrom !== null){ arrowFrom = null; draw(); }
    else { sel = null; side(); draw(); }
  }
  if (k === "/"){ e.preventDefault(); document.getElementById("search").focus(); }
});

/* ---------------- tools & factions ---------------- */
function setTool(t){
  tool = t; arrowFrom = null; hoverObj = null; editing = null;
  cv.classList.remove("griff");
  document.querySelectorAll(".tool[data-t]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  /* Beim Werkzeug "Einheit" faehrt das Depot von selbst aus - von dort zieht
     man die Teams auf die Karte, und ohne die Liste ist das Werkzeug halb
     blind. Wieder einklappen laesst es sich jederzeit. */
  if (t === "unit" && !showDepot) depotAuf(true);
  tips(); draw();
}
function depotAuf(an){
  showDepot = an;
  const b = document.getElementById("b-depot");
  if (b) b.setAttribute("aria-pressed", String(showDepot));
  document.getElementById("depot").classList.toggle("zu", !showDepot);
  if (showDepot) depotZeichnen();
  requestAnimationFrame(resize);
}
document.querySelectorAll(".tool[data-t]").forEach(b => b.addEventListener("click", () => setTool(b.dataset.t)));
function setFaction(f){
  faction = f;
  document.querySelectorAll(".fac").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.f === f)));
  tips(); if (sel !== null) side();
}
const fBox = document.getElementById("factions");
FACTIONS.forEach(f => {
  const b = document.createElement("button");
  b.className = "fac"; b.dataset.f = f.id; b.style.setProperty("--f", f.color);
  b.setAttribute("aria-pressed", String(f.id === faction));
  b.innerHTML = `<span class="dot"></span><span class="lbl">${f.tag}</span>`;
  b.title = f.name;
  b.addEventListener("click", () => setFaction(f.id));
  fBox.appendChild(b);
});
function tips(){
  const p = FACTIONS[faction].name;
  document.getElementById("tip").innerHTML = {
    inspect:"<b>Inspect</b> — click a town, arrow or line. Come <b>near</b> your own arrow or line and it grows handles: drag an end to another town, drag the <b>+</b> between two towns to hang one in, drag a point off the map to take it out.",
    owner:  `<b>Control</b> — click sets the town to <b>${p}</b>. Click again to release it.`,
    unit:   `<b>Unit</b> — click a town, then add teams on the right. Or drag them from your depot.`,
    arrow:  `<b>Move</b> — <b>drag</b> from the origin town to the target. Drawn for <b>${p}</b>.`,
    line:   `<b>Defence line</b> — <b>drag across</b> the towns it runs through. Drawn for <b>${p}</b>.`,
    para:   `<b>Para-block</b> — <b>drag across</b> the towns that are blocked for <b>${p}</b>. Hold <kbd>P</kbd> while dragging to mark them as only planned.`,
    area:   `<b>Area</b> — <b>draw a shape</b> anywhere on the map, then label it ("many planes"). Coloured for <b>${p}</b>.`,
    spot:   "<b>Sighting</b> — click the town where you saw enemy forces, then record what and how much.",
    battle: "<b>Battle</b> — click marks a town as contested (brass ring). Click again to clear it.",
    erase:  "<b>Clear</b> — removes control, your teams, sightings, marks and your arrows here."
  }[tool];
}
document.getElementById("b-obj").addEventListener("click", function(){
  objOnly = !objOnly; this.setAttribute("aria-pressed", String(objOnly)); draw();
});
document.getElementById("b-radius").addEventListener("click", function(){
  showRadius = !showRadius; this.setAttribute("aria-pressed", String(showRadius)); draw();
});
document.getElementById("b-radius").addEventListener("contextmenu", ev => {
  ev.preventDefault(); sichtDialog();
});
/* Two numbers set the whole vision scale. The game gives the step per unit
   type (viewRange), not the size in map units — so this is calibrated once
   against what the war map actually shows. */
function sichtDialog(){
  const stufen = [...new Set(MAP.at.map(a=>atStufe(a.k)))].sort((a,b)=>a-b);
  const zeile = s => {
    const typen = MAP.at.filter(a=>atStufe(a.k)===s);
    return `<tr><td>${s}</td>
      <td style="text-align:left">${typen.map(a=>esc(a.name)).join(", ")}</td>
      <td><b class="rw" data-stufe="${s}">${sichtCal.basis + s*sichtCal.schritt}</b></td></tr>`;
  };
  openDlg(`
    <div class="dlg-h"><h2>Vision scale</h2>
      <p>Set these once so the circles match what you see in game.</p></div>
    <div class="dlg-b">
      <div class="row" style="align-items:center">
        <span style="font-size:12px;color:var(--dim);width:112px">Base (step 0)</span>
        <input type="range" id="sc-basis" min="0" max="60" step="1" value="${sichtCal.basis}" style="flex:1">
        <b id="sc-basis-v" style="width:52px;text-align:right">${sichtCal.basis}</b>
      </div>
      <div class="row" style="align-items:center">
        <span style="font-size:12px;color:var(--dim);width:112px">Per step</span>

function zoom(f){
  const r = cv.parentElement.getBoundingClientRect(), cx = r.width/2, cy = r.height/2;
  const nz = Math.max(.35, Math.min(26, view.z*f)), t = nz/view.z;

      setMyDepot(myDepot().map(d => d.id === inp.dataset.id ? {...d, [feld]: wert} : d));

    b.addEventListener("pointerdown", ev => ev.stopPropagation());
