  });
  liste.querySelectorAll(".dep").forEach(el => {
    el.addEventListener("pointerdown", ev => {
      if (ev.target.classList.contains("tname") || ev.target.dataset.pull) return;
      ev.preventDefault();
      const d = teamById(el.dataset.id);
      if (!d) return;
      carrying = {id: d.id};
      /* Mit Taktikzeichen - beim Ziehen soll man sehen, WAS man traegt. */
      ghost.innerHTML = symbolSVG(d.k, col(FACTIONS[faction]), 26, 18)
        + `<span>${esc((d.tag ? d.tag + " · " : "") + (d.name || atName(d.k)))}</span>`;

      cv.classList.add("dropping");
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener("pointermove", ev => { if (carrying) bewegeGhost(ev); });
    el.addEventListener("pointerup", ev => {
      if (!carrying) return;
      ghost.classList.remove("an"); cv.classList.remove("dropping");
      const r = cv.getBoundingClientRect();
      const x = ev.clientX - r.left, y = ev.clientY - r.top;
      if (x >= 0 && y >= 0 && x <= r.width && y <= r.height){
        const i = hitTest(x, y);
        if (i !== null){
          const d = teamById(carrying.id);
          if (deployTeam(i, carrying.id)){
            sel = i; side(); draw(); tally();
            toast(`${d.name || atName(d.k)} → ${MAP.n[i][0]}`);
          }
        } else toast("Drop it right on a town");
      }
      carrying = null; depotZeichnen();
    });
  });
}
function bewegeGhost(ev){
  /* Mittig am Zeiger - die Verschiebung um die halbe eigene Groesse macht
     das CSS, damit sie nicht von der Beschriftungslaenge abhaengt. */
  ghost.style.left = ev.clientX + "px";
  ghost.style.top  = ev.clientY + "px";
}
/* ---- Die Benennung des Spiels -----------------------------------------
   Am Kaufbildschirm abgelesen: Name "AT034 - Kommodore" (hoechstens 20
   Zeichen), Kurzname "USSR-034". Die Nummer laeuft je Spieler durch. */
const atNr = n => String(n).padStart(3, "0");
function naechsteAtNr(liste){
  let hoch = 0;
  for (const d of liste){
    let m = /^AT\s*(\d{1,4})/i.exec(d.name || "");
    if (m) hoch = Math.max(hoch, +m[1]);
    m = /(\d{1,4})\s*$/.exec(d.tag || "");
    if (m) hoch = Math.max(hoch, +m[1]);
  }
  return hoch + 1;
}
function atSpielName(nr){
  const wer = (S.name || "").trim();
  const kopf = "AT" + atNr(nr);
  return (wer ? `${kopf} - ${wer}` : kopf).slice(0, 20);
}
function atSpielTag(nr){
  const f = clanFaktion();
  return `${f != null ? FACTIONS[f].tag : "AT"}-${atNr(nr)}`;
}

/* What the whole clan owns, deployed or not — grouped the way the game
   groups it, so the strip reads like the force overview in-game. */
function clanKraft(){
  const proTyp = new Map();
  let teams = 0, drin = 0;
  for (const [who, d] of depotIdx){
    const raus = deployedIds(who);
    for (const team of d.list){
      teams++;
      const weg = raus.has(team.id);
      if (weg) drin++;
      const e = proTyp.get(team.k) || {k:team.k, teams:0, frei:0, men:0, veh:0};
      e.teams++; e.men += atMen(team.k); e.veh += atVeh(team.k);
      if (!weg) e.frei++;
      proTyp.set(team.k, e);
    }
  }
  // nach Gattung sortieren, innerhalb der Gattung nach Anzahl
  const reihe = ZWEIGE.map(z=>z.k);
  const typen = [...proTyp.values()].sort((a,b)=>
    reihe.indexOf(zweigVon(a.k)) - reihe.indexOf(zweigVon(b.k)) || b.teams - a.teams);
  return {typen, teams, drin};
}
function kraftLeiste(){

  for (let i=0;i<MAP.n.length;i++){

  document.getElementById("tally").innerHTML = FACTIONS.map((f,i) =>
    `<div class="tile" style="--f:${f.color}" title="${f.name}">
      <span class="k">${f.tag}</span><span class="v">${c[i]}</span>

/* ---------------- where a picture comes from ----------------
   Drei Wege für dieselbe Sache, weil das Speichern einer Datei der lästigste
   Teil war: Datei auswählen, mit Strg+V aus der Zwischenablage einfügen, oder
   das Spielfenster direkt abgreifen.

   Zum Abgreifen: eine Webseite kann von sich aus nicht in ein anderes Programm
   sehen — das wäre auch nicht in Ordnung. Der Browser hat dafür eine eigene
   Schnittstelle, bei der DU im Dialog des Browsers auswählst, was er sehen
   darf. Wir fragen also nach dem Spielfenster, und der Browser fragt dich.
   Die Freigabe bleibt danach stehen, jedes weitere Bild geht ohne Rückfrage. */
let bildStrom = null;        // laufende Freigabe
let bildAbmelden = null;     // räumt die Zuhörer des offenen Fensters weg

const bildAufnahmeMoeglich = () =>
  !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia && window.isSecureContext);

function bildQuelleHTML(id){
  return `<div class="row" style="flex-wrap:wrap;align-items:center">
      <input type="file" id="${id}" accept="image/png,image/jpeg" style="flex:1;min-width:170px">
      ${bildAufnahmeMoeglich()
        ? `<button class="btn" data-bild="grab">Capture the game …</button>`
        : ""}
    </div>
    <div class="hint" data-bild="hint">Or press <kbd>Ctrl</kbd>+<kbd>V</kbd> to paste a screenshot
      straight from the clipboard, or drop an image anywhere in this window.${
      bildAufnahmeMoeglich()
        ? ` <b>Capture</b> asks the browser which window it may see — pick the
            Heroes &amp; Generals window once, then every further shot is one click.`
        : ` Capturing a window needs the page to run over https; on a local file the
            browser does not allow it.`}</div>`;
}

/* Ein Bild aus der laufenden Freigabe. Beim ersten Mal fragt der Browser, was
   er sehen darf; danach nicht mehr, solange die Freigabe steht. */
async function bildAufnehmen(){
  if (!bildAufnahmeMoeglich())
    throw new Error("This browser cannot capture a window here.");
  if (!bildStrom || !bildStrom.active){
    /* Ein Fenster kann die Seite nicht selbst waehlen - das laesst kein
       Browser zu, sonst koennte jede Seite ungefragt mitlesen. Was geht: die
       Auswahl gleich auf der Fensterliste oeffnen statt bei den Bildschirmen,
       den eigenen Tab ausblenden und das Umschalten erlauben. Danach bleibt
       die Freigabe stehen, und jedes weitere Bild ist ein Klick. */
    bildStrom = await navigator.mediaDevices.getDisplayMedia({
      video: {frameRate: 2, displaySurface: "window"},
      audio: false, selfBrowserSurface: "exclude",
      surfaceSwitching: "include", systemAudio: "exclude"});
    const spur = bildStrom.getVideoTracks()[0];
    if (spur) spur.addEventListener("ended", ()=>{ bildStrom = null; });
    /* Welches Fenster geteilt wurde, erfaehrt die Seite nicht - das waere die
       Luecke, die die ganze Regel verhindern soll. Ob ueberhaupt ein Fenster
       oder ein ganzer Bildschirm geteilt wird, steht aber im Datenstrom, und
       ein ganzer Bildschirm liest sich deutlich schlechter. */
    try {
      const art = spur && spur.getSettings && spur.getSettings().displaySurface;
      if (art && art !== "window")
        toast("A whole screen is being shared — picking just the game window reads better.");
    } catch(e){}
  }
  const v = document.createElement("video");
  v.srcObject = bildStrom; v.muted = true; v.playsInline = true;
  await v.play();
  /* Das allererste Bild ist oft noch schwarz - auf ein echtes warten. */
  await new Promise(fertig => {
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(()=>fertig());
    else setTimeout(fertig, 260);
  });
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  if (!c.width || !c.height){ v.pause(); throw new Error("The picture came back empty."); }
  c.getContext("2d").drawImage(v, 0, 0);
  v.pause(); v.srcObject = null;
  const blob = await new Promise(ok => c.toBlob(ok, "image/png"));
  if (!blob) throw new Error("The picture could not be built.");
  return new File([blob], "aufnahme.png", {type: "image/png"});
}
function bildFreigabeBeenden(){
  if (bildStrom){ bildStrom.getTracks().forEach(t => t.stop()); bildStrom = null; }
}

/* Verdrahtet alle drei Wege für ein geöffnetes Fenster. */
function bildQuelle(id, beiBild){
  const dlg = document.getElementById("dlg");
  const nimm = f => { if (f && /^image\//.test(f.type || "")) beiBild(f); };

  document.getElementById(id)?.addEventListener("change", ev => nimm(ev.target.files[0]));

  const einfuegen = ev => {
    const daten = ev.clipboardData || window.clipboardData;
    for (const eintrag of (daten && daten.items) || []){
      if (eintrag.kind === "file" && /^image\//.test(eintrag.type || "")){
        const f = eintrag.getAsFile();
        if (f){ ev.preventDefault(); nimm(f); return; }
      }
    }
  };
  const ueber  = ev => { ev.preventDefault(); dlg.classList.add("dropbereit"); };
  const weg    = () => dlg.classList.remove("dropbereit");
  const fallen = ev => {
    ev.preventDefault(); weg();
    nimm([...((ev.dataTransfer && ev.dataTransfer.files) || [])]
         .find(f => /^image\//.test(f.type || "")));
  };
  document.addEventListener("paste", einfuegen);
  dlg.addEventListener("dragover", ueber);
  dlg.addEventListener("dragleave", weg);
  dlg.addEventListener("drop", fallen);

  dlg.querySelectorAll('[data-bild="grab"]').forEach(b => b.addEventListener("click", async ()=>{
    const alt = b.textContent;
    b.disabled = true; b.textContent = "Grabbing …";
    try { nimm(await bildAufnehmen()); }
    catch(e){
      const m = String(e.message || e);
      toast(/denied|Permission/i.test(m) ? "Screen sharing was declined." : m);
    }
    finally { b.disabled = false; b.textContent = alt; }
  }));

  bildAbmelden = () => {
    document.removeEventListener("paste", einfuegen);
    dlg.removeEventListener("dragover", ueber);
    dlg.removeEventListener("dragleave", weg);
    dlg.removeEventListener("drop", fallen);
    dlg.classList.remove("dropbereit");
    bildAbmelden = null;
  };
}

/* ================= screenshot reader (runs here, in the browser) =========
   Every town's position on the original map is known, so no OCR is needed —
   only the transform between screenshot and map, then a colour probe at each
   known spot. The transform is found by trying scales and offsets and keeping
   the one where far more towns land on a coloured dot than chance would give. */
const SHOT_COL = [
  (r,g,b) => g > 55 && g-r > 45 && g-b > 25,     // US    green
  (r,g,b) => b > 95 && b-r > 45 && b-g > 60,     // GE    violet
  (r,g,b) => r > 70 && r-g > 55 && r-b > 55,     // USSR  red
];
function maskeBauen(imgd){
  const {data, width:W, height:H} = imgd;
  const m = new Uint8Array(W*H);
  let n = 0;
  for (let p=0, q=0; q<W*H; p+=4, q++){
    const r = data[p], g = data[p+1], b = data[p+2];
    for (let f=0; f<3; f++) if (SHOT_COL[f](r,g,b)){ m[q] = f+1; n++; break; }
  }
  return {m, W, H, n};
}
function findeTransform(mk, punkte, melde){
  const {m, W, H} = mk;
  const dichte = mk.n / (W*H);
  // Momente als Startschaetzung
  let sx=0, sy=0, sxx=0, syy=0, cnt=0;
  for (let q=0; q<W*H; q++) if (m[q]){ const x=q%W, y=(q/W)|0; sx+=x; sy+=y; sxx+=x*x; syy+=y*y; cnt++; }
  const mx=sx/cnt, my=sy/cnt;
  const streuBild = Math.sqrt(Math.max(1,(sxx/cnt-mx*mx) + (syy/cnt-my*my)));
  let px=0, py=0, pxx=0, pyy=0;
  for (const p of punkte){ px+=p[0]; py+=p[1]; pxx+=p[0]*p[0]; pyy+=p[1]*p[1]; }
  const N = punkte.length, pmx=px/N, pmy=py/N;
  const streuPkt = Math.sqrt(Math.max(1,(pxx/N-pmx*pmx) + (pyy/N-pmy*pmy)));
  const s0 = streuBild/streuPkt;

  const probe = punkte.length > 420
    ? punkte.filter((_,i)=> i % Math.ceil(punkte.length/420) === 0) : punkte;
  let best = null;
  const skalen = [];
  for (let f=0.45; f<=2.25; f*=1.035) skalen.push(s0*f);
  skalen.forEach((s, si) => {
    if (si % 12 === 0) melde && melde(si/skalen.length);
    const ox0 = mx - pmx*s, oy0 = my - pmy*s;
    let lokal = null;
    for (let schritt of [14, 4]){
      const spanne = schritt === 14 ? 8 : 5;
      const bx = lokal ? lokal[1] : ox0, by = lokal ? lokal[2] : oy0;
      for (let dx=-spanne; dx<=spanne; dx++) for (let dy=-spanne; dy<=spanne; dy++){
        const ox = bx + dx*schritt, oy = by + dy*schritt;
        let treffer = 0, drin = 0;
        for (const p of probe){
          const X = (p[0]*s + ox)|0, Y = (p[1]*s + oy)|0;
          if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
          drin++; if (m[Y*W + X]) treffer++;
        }
        if (drin < probe.length*0.25) continue;
        const wert = treffer - drin*dichte;
        if (!lokal || wert > lokal[0]) lokal = [wert, ox, oy, treffer, drin];
      }
    }
    if (lokal && (!best || lokal[0] > best[0])) best = [lokal[0], s, lokal[1], lokal[2], lokal[3], lokal[4]];
  });
  return best ? {guete:best[0], s:best[1], ox:best[2], oy:best[3]} : null;
}
function farbenLesen(mk, punkte, tr){
  const {m, W, H} = mk;
  const R = Math.max(2, Math.round(2.2*tr.s));
  const besitz = {}; let unklar = 0, aussen = 0;
  const zaehl = [0,0,0];
  punkte.forEach((p, idx) => {
    const cx = Math.round(p[0]*tr.s + tr.ox), cy = Math.round(p[1]*tr.s + tr.oy);
    if (cx < R || cy < R || cx >= W-R || cy >= H-R){ aussen++; return; }
    const st = [0,0,0];
    for (let y=cy-R; y<=cy+R; y++) for (let x=cx-R; x<=cx+R; x++){
      const v = m[y*W + x]; if (v) st[v-1]++;
    }
    const beste = st.indexOf(Math.max(...st));
    const rest = st.reduce((a,b)=>a+b,0) - st[beste];
    if (st[beste] < 3 || st[beste] < 2*rest){ unklar++; return; }
    besitz[idx] = beste; zaehl[beste]++;
  });
  return {besitz, unklar, aussen, zaehl};
}

    </div>`, true);
  document.getElementById("d-close").addEventListener("click", closeDlg);
  bildQuelle("shot-file", screenshotLesen);
  document.getElementById("shot-take").addEventListener("click", ()=>{
    if (!shotState) return;
    const t = jetzt(); let n = 0;
    for (const [idx, f] of Object.entries(shotState.besitz)){
      S.owner[idx] = {v:f, t, by:S.me}; dirty.add(`owner:${idx}`); n++;
    }
    save(); closeDlg(); tally(); draw(); side();

async function screenshotLesen(datei){
  const st = document.getElementById("shot-status");
  const setz = t => st.innerHTML = t;
  setz("Loading image …");
  const bild = await new Promise((ok, err) => {
    const im = new Image();
    im.onload = () => ok(im); im.onerror = err;
    im.src = URL.createObjectURL(datei);
  });
  // auf handliche Groesse bringen, das reicht fuer die Punkterkennung voellig
  const MAXB = 1600;
  const sk = Math.min(1, MAXB/bild.width);
  const W = Math.round(bild.width*sk), H = Math.round(bild.height*sk);
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  const tc = tmp.getContext("2d", {willReadFrequently:true});
  tc.drawImage(bild, 0, 0, W, H);
  URL.revokeObjectURL(bild.src);

  setz(`Image ${bild.width}×${bild.height}. Looking for coloured dots …`);
  await new Promise(r => setTimeout(r, 20));
  const mk = maskeBauen(tc.getImageData(0, 0, W, H));
  if (mk.n < 400){
    setz(`<b>Only ${mk.n} coloured pixels found.</b> Is this really the war map?`);
    return;
  }
  const punkte = MAP.n.map(n => [n[1] + (MAP.x0||0), n[2] + (MAP.y0||0)]);
  setz(`${mk.n.toLocaleString("en")} coloured pixels. Matching against ${punkte.length} known towns …`);
  await new Promise(r => setTimeout(r, 20));

  const t0 = performance.now();
  const tr = findeTransform(mk, punkte, p => {
    setz(`Matching … ${Math.round(p*100)} %`);
  });
  if (!tr){ setz("<b>No match found.</b> Try a shot with the map zoomed further out."); return; }
  const erg = farbenLesen(mk, punkte, tr);
  const n = Object.keys(erg.besitz).length;
  const ms = Math.round(performance.now()-t0);

  setz(`<b>${n} of ${punkte.length} towns read</b> (${Math.round(100*n/punkte.length)} %) in ${ms} ms —
     US ${erg.zaehl[0]}, GE ${erg.zaehl[1]}, USSR ${erg.zaehl[2]}.
     ${erg.aussen} outside the shot, ${erg.unklar} unclear.`);

  // Kontrollbild
  const scv = document.getElementById("shot-cv");
  scv.width = W; scv.height = H;
  const sc = scv.getContext("2d");
  sc.drawImage(tmp, 0, 0);
  const ring = ["#7dffa0", "#b79cff", "#ff8f86"];
  punkte.forEach((p, idx) => {
    const x = p[0]*tr.s + tr.ox, y = p[1]*tr.s + tr.oy;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    sc.beginPath(); sc.arc(x, y, Math.max(4, 2.4*tr.s), 0, 6.284);
    if (idx in erg.besitz){ sc.strokeStyle = ring[erg.besitz[idx]]; sc.lineWidth = 2; }
    else { sc.strokeStyle = "#ffe14d"; sc.lineWidth = 1; }
    sc.stroke();
  });
  shotState = erg;
  document.getElementById("shot-take").disabled = n === 0;
}

/* ---------------- symbol picker ----------------
   A native <select> cannot show graphics, and the tactical sign is exactly
   what makes a type recognisable. This is a small button-plus-panel that
   behaves like a select but draws the symbol. */
let pickerOffen = null;
function symbolWahl(host, gewaehlt, beiWahl){
  const c = () => light() ? "#1a2029" : "#e9e2d5";
  host.className = "sympick";
  const zeichne = () => {
    const a = AT[host.dataset.k];
    host.innerHTML = `<span class="sw-cur">${a ? symbolSVG(a.k, c(), 26, 18) : ""}
      <span>${a ? esc(a.name) : "choose …"}</span></span><span class="sw-pfeil">▾</span>`;
  };
  host.dataset.k = gewaehlt || MAP.at[0].k;
  zeichne();
  host.addEventListener("click", ev => {
    ev.stopPropagation();
    if (pickerOffen){ pickerOffen.remove(); pickerOffen = null; }
    const p = document.createElement("div");
    p.className = "sw-liste";
    const gruppe = (titel, arr) => `<div class="sw-h">${titel}</div>` + arr.map(a =>
      `<button data-k="${a.k}"${a.k===host.dataset.k?' class="an"':''}>
         ${symbolSVG(a.k, c(), 26, 18)}<span>${esc(a.name)}</span></button>`).join("");
    p.innerHTML = gruppe("Army", MAP.at.filter(a=>a.arm==="army"))
                + gruppe("Air Force", MAP.at.filter(a=>a.arm==="air"));
    document.body.appendChild(p);
    const r = host.getBoundingClientRect();
    p.style.left = r.left + "px";
    p.style.top = (r.bottom + 2 + window.scrollY) + "px";
    p.style.minWidth = r.width + "px";
    if (r.bottom + p.offsetHeight > window.innerHeight)
      p.style.top = (r.top - p.offsetHeight - 2) + "px";
    pickerOffen = p;
    p.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", ev2 => {
      ev2.stopPropagation();
      host.dataset.k = b.dataset.k; zeichne();
      p.remove(); pickerOffen = null;
      beiWahl && beiWahl(b.dataset.k);
    }));
  });
  return host;
}
document.addEventListener("click", ()=>{ if (pickerOffen){ pickerOffen.remove(); pickerOffen = null; } });

/* ---------------- picking a town ----------------
   1438 Namen in einer Klappliste sind nicht bedienbar. Also dasselbe Feld wie
   für Symbole und Ausrüstung: ein Knopf, der eine Liste mit Suchfeld öffnet.
   Ohne Sucheingabe stehen die kriegswichtigen Orte oben — Fabriken, Flugplätze,
   Hauptstädte —, denn darum geht es fast immer. */
function stadtWahl(host, start, leerText, beiWahl){
  host.className = "sympick";
  host.dataset.stadt = (start === null || start === undefined) ? "" : String(start);
  const zeichne = () => {
    const i = host.dataset.stadt;
    const n = i === "" ? null : MAP.n[+i];
    host.innerHTML = `<span class="sw-cur"><span${n ? "" : ' style="color:var(--dim2)"'}>${
      n ? esc(n[0]) : esc(leerText || "choose a town …")}</span></span>
      <span class="sw-pfeil">▾</span>`;
  };
  zeichne();
  host.addEventListener("click", ev => {
    ev.stopPropagation();
    if (pickerOffen){ pickerOffen.remove(); pickerOffen = null; }
    const p = document.createElement("div");
    p.className = "sw-liste";
    p.style.width = Math.max(250, host.getBoundingClientRect().width) + "px";

    const suche = q => {
      const roh = q.trim().toLowerCase();
      if (!roh){
        const raus = [];
        for (let i = 0; i < MAP.n.length && raus.length < 60; i++) if (isObj(i)) raus.push(i);
        return raus;
      }
      /* Namensanfang schlägt Treffer in der Mitte — "Ber" soll Berlin zeigen,
         nicht Bergheim Flugplatz zuerst. */
      const vorn = [], drin = [];
      for (let i = 0; i < MAP.n.length; i++){
        const stelle = MAP.n[i][0].toLowerCase().indexOf(roh);
        if (stelle === 0) vorn.push(i);
        else if (stelle > 0) drin.push(i);
        if (vorn.length >= 60) break;
      }
      return vorn.concat(drin).slice(0, 60);
    };

    const bau = q => {
      const treffer = suche(q);
      const zeile = i => {
        const f = factionOf(i);
        return `<button data-i="${i}"${String(i) === host.dataset.stadt ? ' class="an"' : ""}>
          <span style="color:${col(f)};font-size:9px">●</span>
          <span style="flex:1">${esc(MAP.n[i][0])}</span>
          <small style="color:var(--dim2)">${esc(MAP.typen[MAP.n[i][3]])}${
            isCap(i) ? " ★" : ""}</small></button>`;
      };
      p.innerHTML = `<div style="padding:4px"><input id="sw-such" placeholder="type a town …"
          autocomplete="off" spellcheck="false"
          style="width:100%;background:var(--panel2);border:1px solid var(--line);
            border-radius:2px;padding:4px 6px;outline:0;font-size:11.5px"></div>`
        + (leerText ? `<button data-i=""${host.dataset.stadt === "" ? ' class="an"' : ""}>
            <span style="flex:1;color:var(--dim2)">${esc(leerText)}</span></button>` : "")
        + (q.trim() ? "" : `<div class="sw-h">Objectives</div>`)
        + treffer.map(zeile).join("")
        + (treffer.length ? "" : `<div class="sw-h">nothing found</div>`);

      p.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", ev2 => {
        ev2.stopPropagation();
        host.dataset.stadt = b.dataset.i;
        zeichne();
        p.remove(); pickerOffen = null;
        if (beiWahl) beiWahl(b.dataset.i === "" ? null : +b.dataset.i);
      }));
      const such = p.querySelector("#sw-such");
      such.value = q;
      such.addEventListener("click", e2 => e2.stopPropagation());
      such.addEventListener("keydown", e2 => {
        if (e2.key === "Enter"){
          e2.preventDefault();
          const erster = p.querySelector("[data-i]:not([data-i=''])");
          if (erster) erster.click();
        }
      });
      such.addEventListener("input", () => {
        const wert = such.value;
        bau(wert);
        const neu = p.querySelector("#sw-such");
        neu.focus(); neu.setSelectionRange(wert.length, wert.length);
      });
    };
    bau("");
    document.body.appendChild(p);
    const r = host.getBoundingClientRect();
    p.style.left = Math.max(6, Math.min(r.left, window.innerWidth - 268)) + "px";
    p.style.top = (r.bottom + 2) + "px";
    if (r.bottom + p.offsetHeight > window.innerHeight)
      p.style.top = Math.max(6, r.top - p.offsetHeight - 2) + "px";
    pickerOffen = p;
    p.querySelector("#sw-such").focus();
  });
  return host;
}
const stadtAus = id => {
  const el = document.getElementById(id);
  const v = el && el.dataset ? el.dataset.stadt : "";
  return v === "" || v === undefined ? null : +v;
};


/* ---------------- intel ----------------
   Everything about the other side in one window: which clans are out there
   and what they field, every player on record with the faction they fight
   for this war, and the sightings that feed both. Names are matched loosely,
   so "/!(§Peter" and "Peter" find each other without being merged. */
document.getElementById("b-intel").addEventListener("click", ()=>intelDialog());
function intelDialog(tab){
  const c = light() ? "#1a2029" : "#e9e2d5";
  const proSpieler = new Map();
  for (const k of Object.keys(S.spot)){
    const e = S.spot[k];
    if (!e || !Array.isArray(e.v)) continue;
    const town = +k.slice(0, k.indexOf(":"));
    for (const u of e.v){
      if (!u || !u.owner) continue;
      const key = spielerKey(u.owner);
      const d = proSpieler.get(key) || {name:u.owner, f:u.f, teams:0, arten:new Map(), orte:new Set(), t:0};
      d.teams += u.n; d.orte.add(town); d.t = Math.max(d.t, e.t||0);
      d.arten.set(u.k, (d.arten.get(u.k)||0) + u.n);
      if (u.f != null) d.f = u.f;
      proSpieler.set(key, d);
    }
  }
  for (const p of spielerListe())
    if (!proSpieler.has(p.key))
      proSpieler.set(p.key, {name:p.name, f:p.f, teams:0, arten:new Map(), orte:new Set(), t:p.t});
  const liste = [...proSpieler.entries()].sort((a,b)=> b[1].teams - a[1].teams);
  const nz = n => n.toLocaleString("en");
  const sicht = allSpots();

  /* Clans are not a table in the game — they are what players call
     themselves. Grouped here they turn a handful of sightings into
     "an organised operation", which is the whole point of the window. */
  const clans = clanListe().map(cl => {
    const top = [...cl.f.entries()].sort((a,b)=>b[1]-a[1])[0];
    const kompo = new Map();
    let t = 0, gesehen = 0;
    for (const p of cl.spieler){
      t = Math.max(t, p.t || 0);
      for (const d of feindDepot(p.key)) kompo.set(d.k, (kompo.get(d.k)||0) + 1);
      const s = proSpieler.get(p.key);
      if (s){ gesehen += s.teams; t = Math.max(t, s.t || 0); }
    }
    return {...cl, top: top ? top[0] : null, kompo, t, gesehen};
  }).sort((a,b)=> b.spieler.length - a.spieler.length || b.teams - a.teams);

  openDlg(`
    <div class="dlg-h"><h2>Intel</h2>
      <p>${liste.length ? `<b>${clans.length}</b> clan${clans.length===1?"":"s"} and
         <b>${liste.length}</b> player${liste.length===1?"":"s"} on record ·
         <b>${sicht.length}</b> town${sicht.length===1?"":"s"} with sightings.`
         : "Nothing recorded yet. Report a sighting with an owner, or add names below, and this fills up."}</p></div>
    <div class="tabs">
      <button data-tab="clans"   aria-pressed="true">Clans</button>
      <button data-tab="players" aria-pressed="false">Players</button>
      <button data-tab="gaps"    aria-pressed="false">Gaps</button>
      <button data-tab="when"    aria-pressed="false">When</button>
      <button data-tab="spots"   aria-pressed="false">Sightings</button>
    </div>
    <div class="dlg-b">
      <div class="tabp on" data-tab="clans">
        ${clans.length ? `<div class="tw"><table>
          <thead><tr><th>Clan</th><th>Fights for</th><th>Players</th><th>Known teams</th>
            <th>Seen</th><th colspan="2">What they field</th><th>Hours</th><th>Last</th></tr></thead>
          <tbody>${clans.map(cl=>`<tr class="fac-row"
              style="--f:${cl.top!=null?col(FACTIONS[cl.top]):"var(--dim2)"}">
            <td><b style="color:var(--accent)">${esc(cl.name)}</b></td>
            <td style="text-align:left"><select data-clanfac="${esc(cl.name)}" class="mini">
              <option value="">${cl.top!=null?FACTIONS[cl.top].tag:"—"}</option>
              ${FACTIONS.map(f=>`<option value="${f.id}">→ ${f.tag}</option>`).join("")}
            </select></td>
            <td>${cl.spieler.length}</td>
            <td>${cl.teams||"—"}</td>
            <td>${cl.gesehen||"—"}</td>
            <td colspan="2" style="text-align:left;max-width:260px;white-space:normal">${
              [...cl.kompo.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>
                `<span title="${esc(atName(k))}" style="display:inline-flex;align-items:center;gap:2px;margin-right:6px">
                   ${symbolSVG(k, c, 20, 14)}<small>${v}</small></span>`).join("") || "—"}</td>
            <td style="color:var(--dim2)">${(()=>{ const z = clanZeit(cl.name);
              return z ? `<span title="${z.von} of ${z.gesamt} recorded">${esc(tzText(z.tz))}</span>` : "—"; })()}</td>
            <td style="color:var(--dim2)">${cl.t?alterText(cl.t):"—"}</td>
          </tr>`).join("")}</tbody></table></div>`
          : `<div class="empty">No clans yet. Put a tag in a player's <b>clan</b> field on the
             Players tab and they group up here.</div>`}
        <div class="note">A clan's side follows the majority of its recorded players this war.
          “Known teams” is what we have written down; “seen” is what has been spotted
          on the map. Setting a side here moves <b>every recorded member</b> of that clan —
          until you know better about the individuals, the clan is the best guess you have.</div>
      </div>

      <div class="tabp" data-tab="players">
        <div class="row">
          <input type="text" id="en-name" placeholder="add a player by name" style="flex:1">
          <select id="en-fac" style="width:120px">
            <option value="">faction?</option>
            ${FACTIONS.map(f=>`<option value="${f.id}">${f.name}</option>`).join("")}
          </select>
          <input type="text" id="en-clan" placeholder="clan" style="width:110px">
          <button class="btn" id="en-add">Add</button>
        </div>
        <div class="row">
          <button class="btn" id="en-bulk" style="flex:1">Add many at once …</button>
          <button class="btn" id="en-ocr" style="flex:1">Read a battle screenshot …</button>
        </div>
        ${liste.length ? `<div class="tw"><table>
          <thead><tr><th>Player</th><th>Clan</th><th>Fights for</th><th>Hours</th><th>Known teams</th><th>Seen</th><th>Towns</th><th>What</th><th>Last</th></tr></thead>
          <tbody>${liste.map(([key,d])=>`<tr>
            <td><a href="#" data-oeffne="${esc(key)}" style="color:var(--accent)">${esc(d.name)}</a></td>
            <td><input class="mini" data-clan="${esc(key)}" value="${esc((S.roster[key]&&S.roster[key].v&&S.roster[key].v.clan)||"")}"
                  placeholder="—" style="width:88px"></td>
            <td><select data-fac="${esc(key)}" class="mini">
              <option value="">—</option>
              ${FACTIONS.map(f=>`<option value="${f.id}"${d.f===f.id?" selected":""}>${f.tag}</option>`).join("")}
            </select></td>
            <td><select data-tz="${esc(key)}" class="mini" style="width:96px">
              <option value="">—</option>
              ${TZ_WAHL.map(([v,n2])=>`<option value="${v}"${spielerZeit(key)===v?" selected":""}
                >${esc(n2)}</option>`).join("")}
            </select></td>
            <td>${atEcht(feindDepot(key)).length || "—"}</td>
            <td>${d.teams?nz(d.teams):"—"}</td>
            <td>${d.orte.size||"—"}</td>
            <td style="text-align:left">${[...d.arten.entries()].map(([k,v])=>
                `<span title="${esc(atName(k))}" style="display:inline-flex;align-items:center;gap:2px;margin-right:6px">
                   ${symbolSVG(k, c, 20, 14)}<small>${v}</small></span>`).join("") || "—"}</td>
            <td style="color:var(--dim2)">${d.t?alterText(d.t):"—"}</td>
          </tr>`).join("")}</tbody></table></div>` : `<div class="empty">Nobody on record yet.</div>`}
        <div class="note">Click a name to record the teams they own.</div>
      </div>

      <div class="tabp" data-tab="gaps">
        ${(()=>{
          const zeilen = [];
          for (const [key, d] of proSpieler){
            const dep = feindDepot(key);
            const echt = atEcht(dep).length, offen = atOffen(dep).length;
            const mind = atMindestens(dep);
            const fehlt = Math.max(0, mind - echt);
            if (!fehlt && !offen && echt) continue;      // vollstaendig, nichts zu tun
            if (!fehlt && !offen && !echt && !d.teams) { zeilen.push({key, d, echt, offen, mind, fehlt:0, leer:true}); continue; }
            if (!fehlt && !offen) continue;
            zeilen.push({key, d, echt, offen, mind, fehlt, leer:false});
          }
          zeilen.sort((a,b)=> (b.fehlt+b.offen) - (a.fehlt+a.offen) || b.mind - a.mind);
          if (!zeilen.length) return `<div class="empty">Nothing missing that we could tell.
            Record a team with a numbered tag and the gaps show up here.</div>`;
          return `<div class="tw"><table>
            <thead><tr><th>Player</th><th>Clan</th><th>Recorded</th><th>At least</th>
              <th>Missing</th><th>Placeholders</th></tr></thead>
            <tbody>${zeilen.slice(0,300).map(z=>`<tr>
              <td><a href="#" data-oeffne="${esc(z.key)}" style="color:var(--accent)">${esc(z.d.name)}</a></td>
              <td style="color:var(--dim2)">${esc((S.roster[z.key]&&S.roster[z.key].v&&S.roster[z.key].v.clan)||"—")}</td>
              <td>${z.echt||"—"}</td>
              <td>${z.mind||"—"}</td>
              <td style="color:${z.fehlt?"var(--accent)":"var(--dim2)"}"><b>${z.fehlt||"—"}</b></td>
              <td style="color:var(--dim2)">${z.offen||"—"}</td>
            </tr>`).join("")}</tbody></table></div>`;
        })()}
        <div class="note">How many assault teams somebody has follows from their tags: whoever
          fields <b>USSR-012</b> owns twelve, even if only four are written down. <b>Missing</b> is
          the difference — that is what to look for. <b>Placeholders</b> are entries created for
          known gaps; they carry no information yet.</div>
      </div>

      <div class="tabp" data-tab="when">
        <div class="row" style="align-items:center;gap:6px">
          <select id="ak-f" style="width:110px">
            ${FACTIONS.map(q=>`<option value="${q.id}">${q.tag}</option>`).join("")}
          </select>
          <input type="text" id="ak-clan" placeholder="clan (optional)" style="width:140px" dir="auto">
          <input type="number" id="ak-n" placeholder="how many" style="width:100px" min="0" max="9999">
          <button class="btn primary" id="ak-add">Record now</button>
        </div>
        ${(()=>{
          const l = aktListe();
          if (!l.length) return `<div class="empty">Nothing recorded yet. Enter how many of a side
            are around right now — the timestamp comes along, and the picture builds itself.</div>`;
          const m = aktMuster(l);
          const maxS = Math.max(1, ...m.std), maxT = Math.max(1, ...m.tag);
          const TAGE = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
          const balken = (wert, max, breit) => `<div style="background:var(--panel2);border-radius:2px;
            height:9px;width:${breit}px;overflow:hidden"><div style="height:100%;
            width:${Math.round(100*wert/max)}%;background:var(--accent)"></div></div>`;
          return `<div style="display:flex;gap:18px;flex-wrap:wrap">
            <div style="flex:1;min-width:230px">
              <div style="font-size:11px;color:var(--dim);margin-bottom:4px">By hour, your time</div>
              ${m.std.map((v,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:1px">
                <span style="font-size:10px;color:var(--dim2);width:24px;text-align:right">${i}</span>
                ${balken(v, maxS, 150)}
                <span style="font-size:10px;color:var(--dim2)">${v||""}</span></div>`).join("")}
            </div>
            <div style="flex:1;min-width:200px">
              <div style="font-size:11px;color:var(--dim);margin-bottom:4px">By weekday</div>
              ${m.tag.map((v,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
                <span style="font-size:10px;color:var(--dim2);width:26px">${TAGE[i]}</span>
                ${balken(v, maxT, 150)}
                <span style="font-size:10px;color:var(--dim2)">${v||""}</span></div>`).join("")}
              <div style="font-size:11px;color:var(--dim);margin:10px 0 4px">Last recorded</div>
              ${l.slice(0,8).map(a=>`<div style="font-size:11px;color:var(--dim2)">
                ${new Date(a.t).toLocaleString()} · ${FACTIONS[a.f]?FACTIONS[a.f].tag:"?"}${
                a.clan?` · ${esc(a.clan)}`:""} · <b>${a.n}</b></div>`).join("")}
            </div>
          </div>`;
        })()}
        <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
          <div style="font-size:12px;color:var(--dim);margin-bottom:5px">What changed in the game</div>
          ${ereignisse().length ? `<div style="display:flex;flex-direction:column;gap:3px">${
            ereignisse().map((e,i)=>`<div style="display:flex;align-items:center;gap:8px;font-size:11px">
              <span style="color:var(--accent);width:82px">${esc(e.d||"")}</span>
              <span style="flex:1" dir="auto">${esc(e.t||"")}</span>
              <button class="btn" data-erm="${i}" style="font-size:10px;padding:0 5px">×</button>
            </div>`).join("")}</div>`
            : `<div style="font-size:11px;color:var(--dim2)">Nothing noted.</div>`}
          <div class="row" style="margin-top:6px">
            <input type="date" id="er-d" style="width:150px">
            <input type="text" id="er-t" placeholder="gold is back, underpopulation bonus gone …"
              style="flex:1" dir="auto">
            <button class="btn" id="er-add">Note it</button>
          </div>
        </div>
        <div class="note">Every entry carries its timestamp, so the picture builds itself — nobody
          has to keep a statistic. The hours are shown in <b>your</b> time, because that is what you
          plan in. Events sit next to it: otherwise nobody remembers why everything looks different
          from one Tuesday on.</div>
      </div>

      <div class="tabp" data-tab="spots">
        ${sicht.length ? `<div class="tw"><table>
          <thead><tr><th>Town</th><th>Faction</th><th>Teams</th><th>What</th><th>Clan</th><th>Reported</th></tr></thead>
          <tbody>${sicht.map(d=>`<tr data-go="${d.town}" style="cursor:pointer">
            <td>${esc(MAP.n[d.town][0])}</td>
            <td style="text-align:left">${fBadge(d.f)}</td>
            <td>${nz(d.n)}</td>
            <td style="text-align:left;max-width:230px;white-space:normal">${
              [...d.arten].map(k=>`<span title="${esc(atName(k))}"
                style="display:inline-block;margin-right:4px">${symbolSVG(k, c, 20, 14)}</span>`).join("")}</td>
            <td style="text-align:left;color:var(--accent)">${clansAt(d.town).map(x=>esc(x.name)).join(", ") || "—"}</td>
            <td style="color:${alter(d.t)<FRISCH?"var(--text)":"var(--dim2)"}">${alterText(d.t)}</td>
          </tr>`).join("")}</tbody></table></div>`
          : `<div class="empty">Nothing reported. Tool <b>8</b> puts a sighting on a town.</div>`}
        <div class="note">Reports fade on the map after ${Math.round(FRISCH/3600e3)} hours and go pale
          after a day. Click a row to fly there.</div>
      </div>
    </div>
    <div class="dlg-f"><button class="btn primary" id="d-close">Close</button></div>`, "xwide");
  tabsAktiv(document.getElementById("dlg"), tab);
  document.getElementById("d-close").addEventListener("click", closeDlg);
  document.getElementById("en-add").addEventListener("click", ()=>{
    const nm = document.getElementById("en-name").value.trim();
    if (!nm){ toast("Type a name first."); return; }
    const fv = document.getElementById("en-fac").value;
    merkeSpieler(nm, fv === "" ? undefined : +fv, document.getElementById("en-clan").value.trim());
    closeDlg(); toast(`${nm} recorded`);
  });
  document.getElementById("en-bulk").addEventListener("click", massenDialog);
  document.getElementById("en-ocr").addEventListener("click", ocrDialog);
  document.querySelectorAll("[data-fac]").forEach(s => s.addEventListener("change", ev=>{
    ev.stopPropagation();
    const d = proSpieler.get(s.dataset.fac);
    merkeSpieler(d.name, s.value === "" ? null : +s.value);
    draw(); toast("Faction updated");
  }));
  document.querySelectorAll("[data-tz]").forEach(sel => sel.addEventListener("change", ()=>{
    setSpielerZeit(sel.dataset.tz, sel.value === "" ? null : +sel.value);
    toast("Noted");
  }));
  {
    const ab = document.getElementById("ak-add");
    if (ab) ab.addEventListener("click", ()=>{
      const n = +document.getElementById("ak-n").value;
      if (!(n >= 0)){ toast("How many?"); return; }
      aktMelden(+document.getElementById("ak-f").value,
                document.getElementById("ak-clan").value, n);
      intelDialog("when"); toast("Recorded");
    });
    const eb = document.getElementById("er-add");
    if (eb) eb.addEventListener("click", ()=>{
      const d = document.getElementById("er-d").value;
      const x = document.getElementById("er-t").value.trim();
      if (!d || !x){ toast("Date and what happened, please."); return; }
      setEreignisse(ereignisse().concat([{d, t:x}]));
      intelDialog("when");
    });
    document.querySelectorAll("[data-erm]").forEach(b => b.addEventListener("click", ()=>{
      const l = ereignisse(); l.splice(+b.dataset.erm, 1); setEreignisse(l); intelDialog("when");
    }));
  }
  document.querySelectorAll("[data-clanfac]").forEach(sel => {
    sel.addEventListener("change", ()=>{
      const f = sel.value === "" ? null : +sel.value;
      if (f === null) return;
      const name = sel.dataset.clanfac;
      const mit = spielerListe().filter(p => (p.clan||"").trim().toLowerCase() === name.trim().toLowerCase());
      if (!mit.length) return;
      if (!confirm(`Move all ${mit.length} recorded member${mit.length===1?"":"s"} of `
                 + `${name} to ${FACTIONS[f].name}?`)){ intelDialog("clans"); return; }
      for (const p of mit) merkeSpieler(p.name, f, p.clan);
      intelDialog("clans");
      toast(`${name}: ${mit.length} moved to ${FACTIONS[f].tag}`);
    });
  });
  document.querySelectorAll("[data-clan]").forEach(inp => {
    inp.addEventListener("click", ev => ev.stopPropagation());
    inp.addEventListener("change", ()=>{
      const d = proSpieler.get(inp.dataset.clan);
      merkeSpieler(d.name, undefined, inp.value.trim());
      draw(); toast(inp.value.trim() ? `${d.name} → ${inp.value.trim()}` : "Clan cleared");
    });
  });
  document.querySelectorAll("[data-oeffne]").forEach(el => el.addEventListener("click", ev=>{
    ev.preventDefault();
    feindDialog(el.dataset.oeffne, proSpieler.get(el.dataset.oeffne).name);
  }));
  document.querySelectorAll("#dlg [data-go]").forEach(el => el.addEventListener("click", ()=>{
    sel = +el.dataset.go; closeDlg(); flyTo(sel); side(); draw();
  }));
}

/* Bulk entry — after a match you often have a dozen names at once. */
function massenDialog(){
  openDlg(`
    <div class="dlg-h"><h2>Add many players</h2>
      <p>One per line. A clan tag in brackets or after a slash is picked up automatically —
         <code>[ROS] Peter</code>, <code>Peter /ROS</code>.</p></div>
    <div class="dlg-b">
      <textarea id="bulk-txt" style="min-height:150px"
        placeholder="[ROS] Peter&#10;Peter123&#10;/!(§Peter"></textarea>
      <div class="row" style="align-items:center">
        <span style="font-size:12px;color:var(--dim);flex:1">Apply to all of them</span>
        <input type="text" id="bulk-clan" placeholder="clan (optional)" style="width:120px">
        <select id="bulk-fac" style="width:120px"><option value="">faction?</option>
          ${FACTIONS.map(f=>`<option value="${f.id}">${f.name}</option>`).join("")}</select>
      </div>
    </div>
    <div class="dlg-f">
      <button class="btn" id="d-close">Cancel</button>
      <button class="btn primary" id="bulk-go">Add</button>
    </div>`);
  document.getElementById("d-close").addEventListener("click", ()=>{ closeDlg();
    intelDialog("players"); });
  document.getElementById("bulk-go").addEventListener("click", ()=>{
    const fv = document.getElementById("bulk-fac").value;
    const cAll = document.getElementById("bulk-clan").value.trim();
    let n = 0;
    for (let z of document.getElementById("bulk-txt").value.split(/\r?\n/)){
      z = z.trim();
      if (z.length < 2) continue;
      // Der Tag gehoert zum Namen — im Spiel gibt es keine Clans, die Leute
      // nennen sich selbst so. Der Tag wird nur zusaetzlich abgeleitet.
      if (merkeSpieler(z, fv === "" ? undefined : +fv, cAll || tagAus(z))) n++;
    }
    closeDlg(); toast(`${n} player${n===1?"":"s"} recorded`);
    intelDialog("players");
  });
}

document.getElementById("dep-shot").addEventListener("click", ()=>{
  openDlg(`
    <div class="dlg-h"><h2>Read your assault teams</h2>
      <p>Take the shot on the war map — the assault team list down the right-hand side.</p></div>
    <div class="dlg-b">
      ${bildQuelleHTML("ds-file")}
      <div id="ds-status" style="font-size:12px;color:var(--dim)">Waiting for an image …</div>
      <div id="ds-crop" style="display:none;flex-direction:column;gap:6px">
        <div class="hint">The box moves itself to the list. Drag your own only if a shot has
          several lists in it.</div>
        <div style="text-align:center">
          <div id="ds-bild" style="display:inline-block;position:relative;line-height:0;
            border:1px solid var(--line);border-radius:2px;background:#000;
            touch-action:none;cursor:crosshair;overflow:hidden;max-width:100%">
            <img id="ds-img" draggable="false" alt=""
              style="display:block;max-width:100%;max-height:40vh;width:auto;height:auto;
                     user-select:none;-webkit-user-drag:none">
            <div id="ds-box" style="position:absolute;border:2px solid var(--accent);
              box-shadow:0 0 0 9999px rgba(0,0,0,.62);pointer-events:none"></div>
          </div>
        </div>
        <div class="row">
          <button class="btn primary" id="ds-read">Read the box</button>
          <button class="btn" id="ds-all">Whole picture</button>
        </div>
      </div>
      <div id="ds-list" style="display:none;flex-direction:column;gap:4px;max-height:40vh;overflow-y:auto"></div>
      <details id="ds-roh" style="display:none;font-size:11px;color:var(--dim2)">
        <summary style="cursor:pointer">What the recogniser actually saw</summary>
        <div id="ds-rohbild" style="margin-top:6px"></div>
        <pre id="ds-rohtext" style="white-space:pre-wrap;word-break:break-word;margin:6px 0 0;
          font-size:11px;max-height:24vh;overflow:auto"></pre>
      </details>
    </div>
    <div class="dlg-f">
      <button class="btn" id="d-close">Cancel</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);cursor:pointer">
        <input type="checkbox" id="ds-stellen"> also put them on the map for the clan
      </label>
      <button class="btn primary" id="ds-go" disabled>Add ticked</button>
    </div>`, true);
  document.getElementById("d-close").addEventListener("click", closeDlg);

  /* Der Rahmen wird in Bruchteilen des Bildes gefuehrt, nicht in Pixeln - dann
     stimmt er unabhaengig davon, wie stark die Vorschau verkleinert ist. */
  const VORGABE = {x:.70, y:.05, w:.29, h:.90};
  const feld = document.getElementById("ds-bild");
  const kast = document.getElementById("ds-box");
  let datei = null, box = VORGABE, zieh = null;

  const malen = () => {
    kast.style.left  = (box.x*100)+"%"; kast.style.top    = (box.y*100)+"%";
    kast.style.width = (box.w*100)+"%"; kast.style.height = (box.h*100)+"%";
  };
  const anteil = ev => {
    const r = feld.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (ev.clientX-r.left)/r.width)),
            Math.min(1, Math.max(0, (ev.clientY-r.top )/r.height))];
  };
  feld.addEventListener("pointerdown", ev => {
    zieh = anteil(ev); box = {x:zieh[0], y:zieh[1], w:0, h:0}; malen();
    feld.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  feld.addEventListener("pointermove", ev => {
    if (!zieh) return;
    const [x,y] = anteil(ev);
    box = {x:Math.min(zieh[0],x), y:Math.min(zieh[1],y),
           w:Math.abs(x-zieh[0]), h:Math.abs(y-zieh[1])};
    malen();
  });
  const loslassen = () => {
    if (!zieh) return;
    zieh = null;
    if (box.w < .04 || box.h < .04){ box = VORGABE; malen(); }   // Fehlklick
  };
  feld.addEventListener("pointerup", loslassen);
  feld.addEventListener("pointercancel", loslassen);

  bildQuelle("ds-file", async f => {
    datei = f;
    document.getElementById("ds-img").src = URL.createObjectURL(f);
    document.getElementById("ds-crop").style.display = "flex";
    document.getElementById("ds-list").style.display = "none";
    document.getElementById("ds-roh").style.display  = "none";
    document.getElementById("ds-go").disabled = true;
    box = VORGABE; malen();
    const st = document.getElementById("ds-status");
    st.innerHTML = "Looking at the picture …";
    /* Erst schauen, wo wir sind. Ein ganzes Fenster verraet es an der golden
       hinterlegten Registerkarte; bei einem blossen Ausschnitt gibt es kein
       Urteil, und es geht weiter wie bisher. */
    let voll = null, wo = null;
    try {
      voll = await farbAusschnitt(f, null);
      wo = await ansichtErkennen(voll);
    } catch(e){ voll = null; }
    if (wo && wo.wo === "andere"){
      st.innerHTML = `<b>That is the ${esc(wo.text.slice(0,14).toLowerCase())} screen.</b>
        Switch the game to <b>War</b> or to <b>Soldiers</b> with a soldier's assault teams
        open, then take the shot again. You can also read this one anyway —
        press <b>Whole picture</b>.`;
      return;
    }
    const gefunden = voll ? listenRahmen(voll, wo && wo.wo) : null;
    if (gefunden){
      box = gefunden.box; malen();
      st.innerHTML = `${wo ? `<b>${wo.wo === "krieg" ? "War map" : "Soldiers"}</b> — ` : ""}${
        gefunden.n} assault team${gefunden.n===1?"":"s"} in view. Reading …`;
      return depotLesen(datei, box);
    }
    st.innerHTML = wo
      ? `<b>${wo.wo === "krieg" ? "War map" : "Soldiers"}</b>, but no assault team list in the
         picture. Open the list, then take the shot again — or drag a box around it yourself.`
      : "Drag a box around the assault team list, or just press <b>Whole picture</b>.";
  });
  document.getElementById("ds-read").addEventListener("click", ()=> depotLesen(datei, box));
  document.getElementById("ds-all").addEventListener("click", ()=>{
    box = {x:0, y:0, w:1, h:1}; malen(); depotLesen(datei, box);
  });

/* ---- the text recogniser ---------------------------------------------
   Tesseract expects dark letters on a light ground and about 30 px of line
   height. A game screenshot is the exact opposite: small light letters on a
   dark half-transparent panel over a busy map. Turning that around before
   handing the picture over is worth far more than any amount of tidying up
   the text afterwards - it is the difference between one team read and all
   of them. The engine itself is loaded from a CDN on demand; the map works
   without it, this is the one place that needs the network. */
let ocrWorker = null, ocrMelder = ()=>{}, ocrPsm = null;
/* Merker fuer den einen Fall, der sich nicht reparieren laesst: der Rahmen
   umschliesst nicht nur die Liste, sondern auch ein Stueck Karte. Deren gruene
   und rote Stadtkreise sehen fuer die Balkensuche aus wie Balken. Dann ist es
   ehrlicher, den Rahmen zu bemaengeln als etwas zu erfinden. */


async function ocrLaden(){
  if (window.Tesseract) return;
  await new Promise((ok, err) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = ok; s.onerror = () => err(new Error("could not be loaded"));
    document.head.appendChild(s);
  });
}
/* psm: 3 ganze Seite, 4 eine Spalte, 6 ein Block, 11 verstreute Zeilen.
   `weiss` begrenzt den Zeichenvorrat - bei einem reinen Zahlenfeld kann dann
   kein Buchstabe mehr entstehen, und die Erkennung ist deutlich schneller. */
async function ocrBereit(psm, weiss, melde){
  ocrMelder = melde || (()=>{});
  if (!window.Tesseract) ocrMelder("Loading the text recogniser (about 3 MB, first time only) …");
  await ocrLaden();
  if (!ocrWorker){
    ocrMelder("Starting the recogniser …");
    ocrWorker = await window.Tesseract.createWorker("eng", 1, {
      logger: m => { if (m.status === "recognizing text")
        ocrMelder(`Reading … ${Math.round(m.progress*100)} %`); }
    });
  }
  /* setParameters kostet bei jedem Aufruf Zeit - einmal je Einstellung reicht. */
  const stand = String(psm) + "|" + (weiss || "");
  if (ocrPsm !== stand){
    ocrPsm = stand;
    await ocrWorker.setParameters({tessedit_pageseg_mode: String(psm),
                                   tessedit_char_whitelist: weiss || ""});
  }
}
async function ocrText(quelle, psm, melde, weiss){
  return (await ocrMitZuv(quelle, psm, melde, weiss)).text;
}
/* Wie ocrText, gibt aber auch die Zuversicht zurueck. Damit laesst sich
   entscheiden, welche von mehreren Aufbereitungen die bessere war, ohne dass
   man wissen muesste, was dort stehen sollte.
   Nicht "ocrLesen" nennen - so heisst seit langem der Schlachtbildschirm-Leser
   weiter unten, und die spaetere Definition gewinnt. */
async function ocrMitZuv(quelle, psm, melde, weiss){
  await ocrBereit(psm, weiss, melde);
  const r = await ocrWorker.recognize(quelle);
  return {text: (r && r.data && r.data.text) || "",
          zuv: Math.round((r && r.data && r.data.confidence) || 0)};
}

/* Ausschnitt herausschneiden, hochskalieren und die Schrift vom Grund trennen.
   Nicht ueber eine globale Kontrastspanne: das Panel liegt halbdurchsichtig
   ueber der Karte, und dann bestimmt die Karte die Spanne und das Panel
   verschwindet darin. Entscheidend ist der Abstand jedes Punktes zu seiner
   eigenen Umgebung - der bleibt gross, egal was hinter dem Panel liegt. */
async function bildAufbereiten(datei, box){
  const bm = await createImageBitmap(datei);
  const bx = box || {x:0, y:0, w:1, h:1};
  const sx = Math.round(bx.x*bm.width), sy = Math.round(bx.y*bm.height);
  const sw = Math.max(16, Math.min(bm.width  - sx, Math.round(bx.w*bm.width)));
  const sh = Math.max(16, Math.min(bm.height - sy, Math.round(bx.h*bm.height)));
  /* Auf etwa 1400 px Breite bringen - darunter liest Tesseract Spielschrift
     schlecht -, aber die Flaeche deckeln, damit das Integralbild nicht
     ausufert. */
  const f = Math.max(1, Math.min(4, 1400/sw, Math.sqrt(4.2e6/(sw*sh))));
  const c = document.createElement("canvas");
  const W = c.width = Math.round(sw*f), H = c.height = Math.round(sh*f);
  const g = c.getContext("2d", {willReadFrequently:true});
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(bm, sx, sy, sw, sh, 0, 0, W, H);
  if (bm.close) bm.close();

  const bd = g.getImageData(0, 0, W, H), d = bd.data, n = W*H;
  /* Der hellste Kanal, nicht die uebliche Helligkeit: die Schrift ist weiss,
     der Grund ist farbig - so hebt sie sich am staerksten ab. */
  const grau = new Uint8ClampedArray(n), hist = new Uint32Array(256);
  for (let i=0, j=0; j<n; i+=4, j++){
    const v = Math.max(d[i], d[i+1], d[i+2]);
    grau[j] = v; hist[v]++;
  }
  /* Der Grund ist die Mehrheit der Flaeche, also der Mittelwert. Ein Vergleich
     der Randhundertstel taugt hier NICHT: Schrift nimmt weniger als drei
     Hundertstel des Feldes ein, das 97. Hundertstel liegt also noch im Grund.
     An beiden vorliegenden Bildern nachgemessen liegt diese Regel richtig. */
  let s = 0, mitte = 128;
  for (let v=0; v<256; v++){ s += hist[v]; if (s >= n*0.5){ mitte = v; break; } }
  const schriftHell = mitte < 128;      // dunkler Grund, helle Schrift

  // Integralbild -> Mittelwert eines Fensters in einem Zugriff
  const ii = new Float64Array((W+1)*(H+1));
  for (let y=0; y<H; y++){
    let z = 0;
    for (let x=0; x<W; x++){
      z += grau[y*W+x];
      ii[(y+1)*(W+1)+x+1] = ii[y*(W+1)+x+1] + z;
    }
  }
  /* Das Fenster muss deutlich breiter sein als ein Buchstabe dick ist, sonst
     ist der Mittelwert mitten im Strich gleich dem Strich - und dicke Schrift
     wird innen wieder hell. Etwa das Dreifache einer Zeilenhoehe. */
  const r = Math.min(400, Math.max(28, Math.round(55*f)));
  const abw = new Float32Array(n), habw = new Uint32Array(256);
  for (let y=0, j=0; y<H; y++){
    const y0 = Math.max(0, y-r), y1 = Math.min(H, y+r+1);
    for (let x=0; x<W; x++, j++){
      const x0 = Math.max(0, x-r), x1 = Math.min(W, x+r+1);
      const summe = ii[y1*(W+1)+x1] - ii[y0*(W+1)+x1] - ii[y1*(W+1)+x0] + ii[y0*(W+1)+x0];
      const dv = grau[j] - summe/((x1-x0)*(y1-y0));
      abw[j] = dv;
      habw[Math.min(255, Math.abs(dv)|0)]++;
    }
  }
  // Robuster Massstab: der Abstand, den nur noch ein Prozent uebertrifft
  let t = 0, sk = 24;
  for (let v=255; v>=0; v--){ t += habw[v]; if (t >= n*0.01){ sk = Math.max(14, v); break; } }
  for (let i=0, j=0; j<n; i+=4, j++){
    let v = (schriftHell ? abw[j] : -abw[j]) / sk;
    v = v < 0 ? 0 : v > 1 ? 1 : v;
    const px = 255 - Math.round(v*255);        // Schrift schwarz, Grund weiss
    d[i] = d[i+1] = d[i+2] = px; d[i+3] = 255;
  }
  g.putImageData(bd, 0, 0);
  return c;
}

/* Der Ausschnitt in Farbe und moeglichst unveraendert - die Rastererkennung
   braucht das Gruen der Balken, und die Einzelfelder werden erst danach
   vergroessert, damit sie nicht zweimal durch eine Skalierung laufen. */
async function farbAusschnitt(datei, box){
  const bm = await createImageBitmap(datei);
  const b = box || {x:0, y:0, w:1, h:1};
  const sx = Math.round(b.x*bm.width), sy = Math.round(b.y*bm.height);
  const sw = Math.max(16, Math.min(bm.width  - sx, Math.round(b.w*bm.width)));
  const sh = Math.max(16, Math.min(bm.height - sy, Math.round(b.h*bm.height)));
  const f = Math.max(1, Math.min(3, 600/sw));
  const c = document.createElement("canvas");
  c.width = Math.round(sw*f); c.height = Math.round(sh*f);
  const g = c.getContext("2d", {willReadFrequently:true});
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  g.drawImage(bm, sx, sy, sw, sh, 0, 0, c.width, c.height);
  if (bm.close) bm.close();
  return c;
}

/* ==== Das Kartenraster im Bildschirmfoto finden ========================
   Der fruehere Weg suchte die farbigen Staerkebalken und nahm jede
   Balkenzeile als eine Karte. Das brach an drei Stellen: der goldene
   Symbolkasten ist ebenso kraeftig gefaerbt und zaehlte mit, ein Streifen
   Landkarte im Rahmen brachte deren gruene und rote Stadtkreise ein, und die
   Balkenlaenge haengt am Fuellstand.

   Jetzt zwei unabhaengige Anker, die sich gegenseitig pruefen:

     Der goldene Kasten gibt Ort und Periode. Er ist unverwechselbar, immer
     gleich gross und genau einer je Karte - Fuellstand und Farbe aendern
     nichts daran.

     Die Hell/Dunkel-Kante in der Kartenmitte gibt die Phase. Sie ist das
     schaerfste Merkmal des ganzen Bildes (Sprung um rund 90 Graustufen,
     waehrend jede andere Flanke unter 50 bleibt).

   Weichen beide um mehr als 5 Prozent voneinander ab, wird abgelehnt. Damit
   ist eine stille Fehlmessung ausgeschlossen - und genau die hatte zuletzt
   die Namen um eine Zeile verschoben.

   Gemessen an Ennos Bildschirmfoto ueber 26 Zuschnitte: 24 richtig auf den
   Pixel, 2 ehrliche Ablehnungen, keine erfundene Karte. Auch mit 900 px
   Landkarte im Rahmen und auf dem ganzen 4K-Bild ohne jeden Zuschnitt. */

/* Praefixsummen: danach kostet jedes Kastenmittel drei Zugriffe. */
function summenBild(a, W, H){
  const s = new Float64Array((W+1)*(H+1));
  for (let y = 0; y < H; y++){
    let z = 0;
    for (let x = 0; x < W; x++){
      z += a[y*W+x];
      s[(y+1)*(W+1)+x+1] = s[y*(W+1)+x+1] + z;
    }
  }
  return s;
}
const kastenMittel = (s, W, x0, y0, x1, y1) => {
  x0 = Math.max(0, x0|0); y0 = Math.max(0, y0|0);
  x1 = Math.min(W-1, x1|0); y1 = Math.min(y1|0, y1|0);
  if (x1 < x0 || y1 < y0) return 0;
  const R = W+1;
  const su = s[(y1+1)*R + x1+1] - s[y0*R + x1+1] - s[(y1+1)*R + x0] + s[y0*R + x0];
  return su / ((x1-x0+1) * (y1-y0+1));
};

/* Normierte Autokorrelation der Ableitung - die Ableitung nimmt jeden
   langsamen Verlauf heraus, ohne dass man ihn schaetzen muss. */
function bestesLag(p, lo, hi){
  const n = p.length;
  if (n < hi + 4) return null;
  const d = new Float64Array(n-1);
  for (let i = 0; i < n-1; i++) d[i] = p[i+1] - p[i];
  let bestL = 0, bestR = -2;
  for (let L = lo; L <= hi; L++){
    const m = d.length - L;
    if (m < 8) break;
    let sa = 0, sb = 0;
    for (let i = 0; i < m; i++){ sa += d[i]; sb += d[i+L]; }
    const ma = sa/m, mb = sb/m;
    let num = 0, qa = 0, qb = 0;
    for (let i = 0; i < m; i++){
      const a = d[i]-ma, b = d[i+L]-mb;
      num += a*b; qa += a*a; qb += b*b;
    }
    const r = (qa && qb) ? num/Math.sqrt(qa*qb) : 0;
    if (r > bestR){ bestR = r; bestL = L; }
  }
  return {lag: bestL, r: bestR};
}

const median = a => {
  if (!a.length) return 0;
  const b = a.slice().sort((x,y)=>x-y);
  const m = b.length >> 1;
  return b.length % 2 ? b[m] : (b[m-1]+b[m])/2;
};

/* Kanten im Zeilenprofil: Mittel dahinter minus Mittel davor. */
function stufe(p, w){
  const n = p.length, s = new Float64Array(n+1);
  for (let i = 0; i < n; i++) s[i+1] = s[i] + p[i];
  const mit = (a,b) => { a = Math.max(0,a); b = Math.min(n,b); return b>a ? (s[b]-s[a])/(b-a) : 0; };
  const r = new Float64Array(n);
  for (let i = 0; i < n; i++) r[i] = mit(i, i+w) - mit(i-w, i);
  return r;
}

function kartenRaster(quelle){
  const W = quelle.width, H = quelle.height;
  const ctx = quelle.getContext("2d", {willReadFrequently:true});
  const d = ctx.getImageData(0, 0, W, H).data;
  const N = W*H;
  const L = new Uint8Array(N), SAT = new Uint8Array(N), gold = new Uint8Array(N);
  for (let i = 0, j = 0; j < N; i += 4, j++){
    const R = d[i], G = d[i+1], B = d[i+2];
    const mx = R > G ? (R > B ? R : B) : (G > B ? G : B);
    const mn = R < G ? (R < B ? R : B) : (G < B ? G : B);
    L[j] = (299*R + 587*G + 114*B) / 1000;
    SAT[j] = mx - mn;
    /* Der Farbort des Kastengoldes, beidseitig grosszuegig - kein Pixelmass,
       sondern ein Farbfenster, das auch Skalierungsschlieren mitnimmt. */
    /* Saettigung nur 0,30: eine gesperrte Kampfeinheit zeigt eine blasse
       Kachel - gemessen 0,34, mit der alten Schwelle 0,50 fielen in
       template.png zwei von fuenf Kacheln aus und der Stapel kam nicht
       zustande. Der Farbton bleibt eng, das Formsieb raeumt den Rest weg. */
    if (mx > 110 && R >= G && G >= B && R > B && (mx-mn)/Math.max(mx,1) > 0.30){
      const gn = (G-B)/Math.max(1, R-B);
      if (gn > 0.42 && gn < 0.86) gold[j] = 1;
    }
  }
  const nein = grund => ({ok:false, grund});

  /* ---- Goldflaechen ueber Laeufe und Union-Find --------------------- */
  const eltern = [], kasten = [];
  const finde = a => { while (eltern[a] !== a) a = eltern[a] = eltern[eltern[a]]; return a; };
  const eine = (a,b) => { a = finde(a); b = finde(b); if (a !== b) eltern[b] = a; };
  let vorige = [];
  for (let y = 0; y < H; y++){
    const jetzt = [];
    let x = 0;
    while (x < W){
      if (!gold[y*W+x]){ x++; continue; }
      const a = x;
      while (x < W && gold[y*W+x]) x++;
      const id = kasten.length;
      eltern.push(id);
      kasten.push({x0:a, x1:x-1, y0:y, y1:y, n:x-a});
      jetzt.push({id, a, b:x-1});
    }
    for (const j of jetzt)
      for (const v of vorige)
        if (j.a <= v.b && v.a <= j.b) eine(v.id, j.id);
    vorige = jetzt;
  }
  const flaechen = new Map();
  for (let i = 0; i < kasten.length; i++){
    const w = finde(i), k = kasten[i];
    const f = flaechen.get(w);
    if (!f) flaechen.set(w, {x0:k.x0, x1:k.x1, y0:k.y0, y1:k.y1, n:k.n});
    else {
      f.x0 = Math.min(f.x0, k.x0); f.x1 = Math.max(f.x1, k.x1);
      f.y0 = Math.min(f.y0, k.y0); f.y1 = Math.max(f.y1, k.y1);
      f.n += k.n;
    }
  }
  let stuecke = [...flaechen.values()].filter(f => f.n >= Math.max(24, 8e-6*W*H));
  /* Das dunkle Taktikzeichen zerschneidet den Kasten - wieder zusammensetzen. */
  for (let runde = 0; runde < 8; runde++){
    let fertig = true;
    for (let i = 0; i < stuecke.length && fertig; i++){
      for (let j = i+1; j < stuecke.length; j++){
        const a = stuecke[i], b = stuecke[j];
        const la = 0.22*Math.min(a.x1-a.x0+1, a.y1-a.y0+1);
        const lb = 0.22*Math.min(b.x1-b.x0+1, b.y1-b.y0+1);
        if (a.x0-la <= b.x1+lb && b.x0-lb <= a.x1+la &&
            a.y0-la <= b.y1+lb && b.y0-lb <= a.y1+la){
          a.x0 = Math.min(a.x0,b.x0); a.x1 = Math.max(a.x1,b.x1);
          a.y0 = Math.min(a.y0,b.y0); a.y1 = Math.max(a.y1,b.y1);
          a.n += b.n; stuecke.splice(j,1); fertig = false; break;
        }
      }
    }
    if (fertig) break;
  }
  const kandidaten = stuecke.filter(f => {
    const b = f.x1-f.x0+1, h = f.y1-f.y0+1;
    return b >= 6 && h >= 6 && b/h >= 0.70 && b/h <= 2.60 && f.n/(b*h) >= 0.45;
  }).map(f => ({...f, cx:(f.x0+f.x1)/2, cy:(f.y0+f.y1)/2, b:f.x1-f.x0+1, h:f.y1-f.y0+1}));
  /* ---- Kurze Listen: eine oder zwei Kampfeinheiten -------------------
     Ohne Wiederholung ist die Kartenhoehe nicht zu messen. Sie steckt aber in
     der Kachel: an beiden vorliegenden Bildern ist die Kachel 0,452 bzw.
     0,460 Kartenhoehen breit. 98 Punkte durch 0,456 ergeben 215 gegen
     gemessene 213 und 217 - genau genug, denn die Zeilenlagen sind Anteile
     der Kartenhoehe und verschieben sich damit um hoechstens zwei Punkte. */
  const KACHEL_BREIT = 0.456;   // Kachelbreite je Kartenhoehe
  const KACHEL_OBEN  = 0.11;    // Kachel-Oberkante unter der Kartenoberkante
  const kurzWeg = () => {
    /* Nur Kacheln von Kartenform - ohne Wiederholung, die es bestaetigt,
       muss die Form allein tragen. */
    /* Rechts neben einer echten Kachel steht der Name der Einheit. Neben
       einem Reiterknopf - und der Knopf fuer die Kampfeinheiten-Ansicht ist
       selbst eine Goldkachel in Kartenform - steht nichts. Ohne diese Probe
       wurde im Soldatenfenster der Knopf gelesen statt der Liste. */
    const hatText = k => {
      const Pd = (k.b) / KACHEL_BREIT;
      const oben = k.y0 - KACHEL_OBEN*Pd;
      const y0 = Math.round(oben + 0.07*Pd), y1 = Math.round(oben + 0.235*Pd);
      const x0 = Math.round(k.x1 + 0.05*Pd), x1 = Math.round(k.x1 + 1.20*Pd);
      if (y1 <= y0 || x1 <= x0 || y0 < 0 || y1 >= H || x0 >= W) return false;
      const w = [];
      for (let y = y0; y <= y1; y += 2)
        for (let x = x0; x <= Math.min(W-1, x1); x += 2) w.push(L[y*W+x]);
      if (w.length < 20) return false;
      const grund = median(w);
      let n = 0;
      for (const v of w) if (Math.abs(v - grund) > 45) n++;
      return n/w.length > 0.02;
    };
    /* Die belastbarste Probe: steckt ueberhaupt eines der achtzehn
       Taktikzeichen darin? Ein Stueck Uniform besteht Form, Rand und
       Textprobe, aber kein Zeichen. Das Fenster ist grosszuegig, damit auch
       eine Kachel gefunden wird, deren Goldflaeche das Zeichen zerschneidet. */
    const hatZeichen = k => {
      const Pd = k.b / KACHEL_BREIT;
      const z = zeichenLesen(quelle, k.x0 - 0.10*Pd, k.y0 - 0.16*Pd,
                             k.b + 0.20*Pd, k.h + 0.34*Pd);
      return !!z && (1 - z.abstand) >= 0.72;
    };
    const formOk = kandidaten.filter(k => k.b/k.h >= 1.20 && k.b/k.h <= 2.60);
    const passend = formOk.filter(k => hatZeichen(k) && hatText(k));
    if (!passend.length) return nein("keine Kachel mit Taktikzeichen");
    let reihe = [];
    for (const a of passend){
      const mit = passend.filter(b => Math.abs(b.cx-a.cx) < 0.35*a.b
        && Math.abs(b.b/a.b - 1) < 0.25 && Math.abs(b.h/a.h - 1) < 0.25);
      if (mit.length > reihe.length) reihe = mit;
    }
    reihe.sort((a,b) => a.cy - b.cy);
    const kb = median(reihe.map(k => k.b));
    let P = kb / KACHEL_BREIT;
    if (reihe.length >= 2){
      /* Stehen zwei Kacheln da, ist ihr Abstand das bessere Mass - sofern er
         zu einem ganzzahligen Vielfachen der geschaetzten Hoehe passt. */
      const d = (reihe[reihe.length-1].cy - reihe[0].cy) / (reihe.length-1);
      const k = Math.max(1, Math.round(d/P));
      if (Math.abs(d/k - P) < 0.15*P) P = d/k;
    }
    if (!(P >= 16)) return nein("Kachel zu klein");
    const x0 = Math.round(median(reihe.map(k => k.x0)));
    const x1 = Math.round(median(reihe.map(k => k.x1)));
    const textX = Math.min(W-2, Math.round(x1 + 0.09*P));

    /* Zeilenlagen und Zahlengruppen als Anteile - dieselben Werte, die der
       Regelweg als Ausgangspunkt nimmt. Die Gruppen sitzen gemessen bei
       -0,035 / +0,789 / +1,613 Kartenhoehen neben der Kachel, gut 0,78 breit. */
    const zwei  = [[0.070*P, 0.235*P], [0.310*P, 0.441*P]];
    const zZahl = [0.577*P, 0.770*P];
    const gruppen = [-0.035, 0.789, 1.613].map(a =>
      [Math.max(0, Math.round(x0 + a*P)), Math.min(W-1, Math.round(x0 + (a+0.78)*P))])
      .filter(g => g[1] > g[0] + 8 && g[0] < W-1);

    /* Grundhelligkeit der Karte, um zu entscheiden, ob eine Zahlengruppe
       ueberhaupt beschriftet ist. */
    const werte = [];
    for (const k of reihe)
      for (let y = Math.round(k.y0 - KACHEL_OBEN*P + 0.05*P); y < Math.round(k.y0 + 0.85*P); y += 3)
        for (let x = textX; x < Math.min(W, textX + Math.round(2*P)); x += 3)
          if (y >= 0 && y < H) werte.push(L[y*W+x]);
    const grund = werte.length ? median(werte) : 128;

    const karten = reihe.map(k => {
      const oben = k.y0 - KACHEL_OBEN*P;
      const belegt = gruppen.map(([a,b]) => {
        let n = 0, ct = 0;
        for (let dy = Math.round(zZahl[0]); dy <= Math.round(zZahl[1]); dy++){
          const y = Math.round(oben + dy);
          if (y < 0 || y >= H) continue;
          for (let x = a; x <= b; x++){ if (Math.abs(L[y*W+x] - grund) > 45) n++; ct++; }
        }
        return ct ? n/ct > 0.02 : false;
      });
      return {
        oben, unten: oben + P,
        name:    [oben + zwei[0][0], oben + zwei[0][1]],
        kuerzel: [oben + zwei[1][0], oben + zwei[1][1]],
        zahlen:  [oben + zZahl[0],   oben + zZahl[1]],
        gruppen: gruppen.map(([a,b], i) => ({x:[a,b], belegt: belegt[i]})),
      };
    });

    /* Textbreite wie im Regelweg ueber die Tinte messen. */
    const textRechts = zwei.map(band => {
      const von = Math.round(band[0]), bis = Math.round(band[1]);
      const xEnd = Math.min(W-1, textX + Math.round(3.5*P));
      if (xEnd <= textX) return W-1;
      const tinte = new Float64Array(xEnd - textX + 1);
      let nk = 0;
      for (const k of karten){
        const w2 = [];
        for (let dy = von; dy <= bis; dy += 2){
          const y = Math.round(k.oben + dy);
          if (y < 0 || y >= H) continue;
          for (let x = textX; x <= xEnd; x += 3) w2.push(L[y*W+x]);
        }
        if (!w2.length) continue;
        const g2 = median(w2);
        nk++;
        for (let x = textX; x <= xEnd; x++){
          let n = 0, ct = 0;
          for (let dy = von; dy <= bis; dy++){
            const y = Math.round(k.oben + dy);
            if (y < 0 || y >= H) continue;
            if (Math.abs(L[y*W+x] - g2) > 45) n++;
            ct++;
          }
          if (ct) tinte[x-textX] += n/ct;
        }
      }
      if (!nk) return W-1;
      let letzte = -1, leer = 0;
      for (let i = 0; i < tinte.length; i++){
        if (tinte[i]/nk > 0.05){ letzte = i; leer = 0; }
        else if (letzte >= 0 && ++leer > 0.5*P) break;
      }
      return letzte < 0 ? W-1 : Math.min(W-1, textX + letzte + Math.round(0.04*P));
    });

    return {ok:true, n:karten.length, P, panel:[x0, Math.max(...textRechts)],
            kastenX:[x0, x1], textX, textRechts, gruppen, karten, kurz:true,
            kastenH: Math.round(median(reihe.map(k => k.h)))};
  };
  if (kandidaten.length < 3) return kurzWeg();

  /* ---- Der Stapel: gleich grosse Kaesten uebereinander in festem Takt */
  let bestStapel = [], bestP = 0;
  for (const a of kandidaten){
    const partner = kandidaten.filter(b => b !== a
      && Math.abs(b.cx-a.cx) < 0.35*a.b
      && Math.abs(b.b/a.b - 1) < 0.35 && Math.abs(b.h/a.h - 1) < 0.35);
    for (const b of partner){
      const p = Math.abs(b.cy - a.cy);
      if (p < 8) continue;
      const treffer = new Map();
      for (const m of kandidaten.concat([a])){
        if (Math.abs(m.cx-a.cx) >= 0.35*a.b) continue;
        const k = Math.round((m.cy - a.cy)/p);
        if (Math.abs(m.cy - (a.cy + k*p)) <= 0.05*p && !treffer.has(k)) treffer.set(k, m);
      }
      const ks = [...treffer.keys()].sort((x,y)=>x-y);
      let lauf = [], best = [];
      for (let i = 0; i < ks.length; i++){
        if (i && ks[i] === ks[i-1]+1) lauf.push(ks[i]);
        else lauf = [ks[i]];
        if (lauf.length > best.length) best = lauf.slice();
      }
      if (best.length >= 3 && best.length > bestStapel.length){
        bestStapel = best.map(k => treffer.get(k)); bestP = p;
      }
    }
  }
  if (bestStapel.length < 3) return kurzWeg();
  bestStapel.sort((a,b)=>a.cy-b.cy);
  const hMed = median(bestStapel.map(k=>k.h));
  const voll = bestStapel.filter(k => Math.abs(k.h/hMed - 1) < 0.15);
  const anker = voll.length >= 2 ? voll : bestStapel;
  const Panker = (anker[anker.length-1].cy - anker[0].cy) / (anker.length-1);
  if (!(Panker >= 8)) return kurzWeg();

  /* ---- Panelspalten: was sich mit der Periode wiederholt -------------- */
  const P0 = Math.round(Panker);
  const ev = new Float64Array(W);
  for (let x = 0; x < W; x++){
    let s = 0, s2 = 0, n = 0, gs = 0, gs2 = 0, gn = 0;
    for (let dd = 0; dd < P0; dd += 2){
      let a = 0, an = 0;
      for (const k of bestStapel){
        const y = Math.round(k.cy + dd - P0/2);
        if (y < 0 || y >= H) continue;
        const v = L[y*W+x]; a += v; an++; gs += v; gs2 += v*v; gn++;
      }
      if (an){ const m = a/an; s += m; s2 += m*m; n++; }
    }
    if (n < 2 || gn < 2){ ev[x] = 0; continue; }
    const vA = s2/n - (s/n)*(s/n), vG = gs2/gn - (gs/gn)*(gs/gn);
    ev[x] = vG > 1 ? vA/vG : 0;
  }
  const r = Math.max(1, Math.round(0.05*P0));
  const evg = new Float64Array(W);
  { const s = new Float64Array(W+1);
    for (let x = 0; x < W; x++) s[x+1] = s[x] + ev[x];
    for (let x = 0; x < W; x++){
      const a = Math.max(0,x-r), b = Math.min(W,x+r+1);
      evg[x] = (s[b]-s[a])/(b-a);
    } }
  const kx = Math.round(median(bestStapel.map(k=>k.cx)));
  let pl = kx, pr = kx;
  while (pl > 0 && evg[pl-1] > 0.50) pl--;
  while (pr < W-1 && evg[pr+1] > 0.50) pr++;
  { let luecke = 0;
    for (let x = pr+1; x < W; x++){
      if (evg[x] > 0.50){ pr = x; luecke = 0; }
      else if (++luecke > 0.25*P0) break;
    }
    luecke = 0;
    for (let x = pl-1; x >= 0; x--){
      if (evg[x] > 0.50){ pl = x; luecke = 0; }
      else if (++luecke > 0.25*P0) break;
    } }
  const PB = pr - pl + 1;
  if (PB < 1.6*P0) return kurzWeg();

  /* ---- Messfenster ---------------------------------------------------- */
  const fx0 = Math.max(0, Math.round(pl - 0.03*PB));
  const fx1 = Math.min(W-1, Math.round(pr + 0.03*PB));
  /* Grosszuegig nach oben und unten: faellt der oberste Goldkasten aus dem
     Stapel, laege sonst die ganze erste Karte ausserhalb des Messfensters und
     wuerde als angeschnitten verworfen - genau so ging zuletzt die erste
     Einheit verloren. */
  /* Weit ueber die aeusserste Kachel hinaus. Ueber hellem Gelaende sind die
     Kacheln gesperrter Einheiten so blass, dass die Farbmaske sie nicht
     sieht - bei krieg_hell.png blieben zwei von sieben uebrig, und mit 2,2
     Kartenhoehen Rand endete das Fenster mitten in der Liste. Ein weites
     Fenster kostet nichts: welche Stelle wirklich eine Karte traegt,
     entscheidet danach der Kontrast bzw. die Balkenzeile. */
  const fy0 = Math.max(0, Math.round(anker[0].cy - 8*Panker));
  const fy1 = Math.min(H-1, Math.round(anker[anker.length-1].cy + 8*Panker));

  /* ---- Zeilenraster im Fenster --------------------------------------- */
  const hoehe = fy1 - fy0 + 1;
  const satHist = new Uint32Array(256);
  for (let y = fy0; y <= fy1; y++) for (let x = fx0; x <= fx1; x++) satHist[SAT[y*W+x]]++;
  let ges = 0; for (let v = 0; v < 256; v++) ges += satHist[v];
  let lauf = 0, p99 = 255;
  for (let v = 0; v < 256; v++){ lauf += satHist[v]; if (lauf >= ges*0.99){ p99 = v; break; } }
  const satThr = Math.min(130, Math.max(20, 0.40*p99));

  const fHell = new Float64Array(hoehe), fFarbe = new Float64Array(hoehe), fKante = new Float64Array(hoehe);
  for (let y = fy0; y <= fy1; y++){
    let s = 0, c = 0, k = 0;
    for (let x = fx0; x <= fx1; x++){
      const i = y*W+x;
      s += L[i];
      if (SAT[i] > satThr) c++;
      if (x < fx1 && Math.abs(L[i+1]-L[i]) > 40) k++;
    }
    const n = fx1-fx0+1;
    fHell[y-fy0] = s/n; fFarbe[y-fy0] = c/n; fKante[y-fy0] = k/n;
  }
  const lo = Math.max(4, Math.round(0.80*Panker)), hi = Math.round(1.25*Panker);
  const schaetzer = [fHell, fFarbe, fKante].map(p => bestesLag(p, lo, hi)).filter(Boolean);
  if (!schaetzer.length || schaetzer.every(s => s.r < 0.25)) return kurzWeg();
  const med = median(schaetzer.map(s=>s.lag));
  const nah = schaetzer.map(s=>s.lag).filter(l => Math.abs(l-med) <= 0.04*med);
  let P = nah.length ? nah.reduce((a,b)=>a+b,0)/nah.length : med;
  if (Math.abs(P - Panker) > 0.05*Panker) return kurzWeg();

  /* Phase aus der Hell/Dunkel-Kante - dem schaerfsten Merkmal im Bild. */
  const Pi = Math.round(P);
  const gefaltet = new Float64Array(Pi);
  const zaehl = new Int32Array(Pi);
  for (let y = fy0; y <= fy1; y++){
    const f = ((y - fy0) % Pi + Pi) % Pi;
    gefaltet[f] += fHell[y-fy0]; zaehl[f]++;
  }
  for (let i = 0; i < Pi; i++) gefaltet[i] /= (zaehl[i] || 1);
  const w = Math.max(1, Math.round(0.03*P));
  const dop = new Float64Array(Pi*2);
  for (let i = 0; i < Pi*2; i++) dop[i] = gefaltet[i % Pi];
  const st = stufe(dop, w);
  /* Nicht "eindeutig oder gar nicht". Eine Karte hat zwei starke Kanten - die
     Oberkante und die Mitte zwischen Namens- und Zahlenteil -, und bei kleineren
     Bildern werden beide aehnlich tief. Also alle ernsthaften Tiefpunkte als
     Kandidaten nehmen, jeden zu Ende rechnen und den nehmen, der wirklich
     Karten ergibt: oben hell, unten dunkel. Der Goldanker prueft jeden Zweig. */
  let tief = Infinity;
  for (let i = 0; i < Pi; i++) if (st[i+Pi] < tief) tief = st[i+Pi];
  if (!(tief < 0)) return kurzWeg();
  const roh = [];
  for (let i = 0; i < Pi; i++){
    const v = st[i+Pi];
    if (v > 0.40*tief) continue;
    if (v > st[i-1+Pi] || v > st[i+1+Pi]) continue;   // nur oertliche Tiefpunkte
    roh.push({i, v});
  }
  if (!roh.length) return kurzWeg();
  roh.sort((p,q) => p.v - q.v);
  const phasen = [];                       // dicht Benachbartes ist derselbe
  for (const k of roh){
    if (phasen.some(p => Math.min(Math.abs(p-k.i), Pi-Math.abs(p-k.i)) < Pi/8)) continue;
    phasen.push(k.i);
    if (phasen.length >= 4) break;
  }

  const rmean = fHell;
  const stR = stufe(rmean, w);
  const mitP = (a,b) => {
    let s = 0, n = 0;
    for (let y = Math.round(a); y <= Math.round(b); y++){
      if (y < fy0 || y > fy1) continue;
      s += rmean[y-fy0]; n++;
    }
    return n ? s/n : NaN;
  };

  /* Ein Kandidat, ganz durchgerechnet: Kanten nachmessen, Gerade robust
     ausgleichen, Karten zaehlen. Null, wenn daraus keine Liste wird. */
